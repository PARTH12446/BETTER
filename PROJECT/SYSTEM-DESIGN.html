<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>System Design Mastery · 50 Topics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #f6f8fc;
            --bg-card: #ffffff;
            --bg-sidebar: #ffffff;
            --text: #1e293b;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --border-light: #f1f5f9;
            --primary: #2563eb;
            --primary-light: #dbeafe;
            --primary-dark: #1d4ed8;
            --success: #22c55e;
            --success-light: #f0fdf4;
            --warning: #eab308;
            --warning-light: #fef3c7;
            --danger: #ef4444;
            --danger-light: #fee2e2;
            --purple: #8b5cf6;
            --purple-light: #ede9fe;
            --pink: #ec4899;
            --pink-light: #fce7f3;
            --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            --shadow-lg: 0 10px 40px rgba(0,0,0,0.08);
            --radius: 16px;
            --radius-sm: 8px;
            --transition: 0.2s ease;
        }
        body.dark {
            --bg: #0f172a;
            --bg-card: #1e293b;
            --bg-sidebar: #1e293b;
            --text: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border: #334155;
            --border-light: #1e293b;
            --primary: #3b82f6;
            --primary-light: #1e3a5f;
            --shadow: 0 1px 3px rgba(0,0,0,0.3);
            --shadow-lg: 0 10px 40px rgba(0,0,0,0.4);
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            transition: background 0.3s, color 0.3s;
        }
        .app { display: flex; min-height: 100vh; }

        /* Sidebar */
        .sidebar {
            width: 380px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            padding: 1.2rem 1rem;
            overflow-y: auto;
            position: sticky;
            top: 0;
            height: 100vh;
            flex-shrink: 0;
            transition: background 0.3s, border 0.3s;
            z-index: 10;
        }
        .sidebar-brand {
            font-weight: 800;
            font-size: 1.3rem;
            padding: 0 0.5rem 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--primary);
        }
        .sidebar-brand i { font-size: 1.4rem; }
        .sidebar-stats {
            display: flex;
            gap: 8px;
            padding: 0 0.5rem 1rem;
            flex-wrap: wrap;
        }
        .sidebar-stats .stat {
            font-size: 0.7rem;
            padding: 4px 10px;
            border-radius: 40px;
            background: var(--primary-light);
            color: var(--primary);
            font-weight: 600;
        }
        body.dark .sidebar-stats .stat { background: #1e3a5f; color: #93c5fd; }
        .sidebar-search {
            margin-bottom: 1rem;
            padding: 0 0.5rem;
            position: relative;
        }
        .sidebar-search input {
            width: 100%;
            padding: 10px 14px 10px 38px;
            border-radius: 40px;
            border: 1px solid var(--border);
            background: var(--bg);
            font-size: 0.85rem;
            outline: none;
            transition: 0.2s;
            color: var(--text);
        }
        .sidebar-search input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }
        .sidebar-search .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }
        .topic-list {
            list-style: none;
            padding: 0 0.2rem;
            max-height: calc(100vh - 300px);
            overflow-y: auto;
        }
        .topic-list li {
            padding: 5px 10px;
            margin: 1px 0;
            border-radius: 30px;
            font-size: 0.72rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.15s;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-secondary);
            line-height: 1.3;
        }
        .topic-list li:hover { background: var(--border-light); }
        .topic-list li.active {
            background: var(--primary);
            color: #fff;
            font-weight: 600;
        }
        body.dark .topic-list li.active { background: var(--primary); }
        .topic-list li .badge {
            margin-left: auto;
            font-size: 0.5rem;
            padding: 1px 8px;
            border-radius: 30px;
            white-space: nowrap;
            font-weight: 600;
        }
        .topic-list li .badge.theory { background: var(--primary-light); color: var(--primary); }
        .topic-list li .badge.design { background: var(--warning-light); color: #92400e; }
        body.dark .topic-list li .badge.theory { background: #1e3a5f; color: #93c5fd; }
        body.dark .topic-list li .badge.design { background: #2d1f0a; color: #fbbf24; }
        .topic-list li .badge.done { background: var(--success-light); color: #166534; }
        body.dark .topic-list li .badge.done { background: #0f2a1a; color: #4ade80; }
        .topic-list li .num { opacity: 0.4; font-size: 0.6rem; min-width: 22px; }

        .progress-track {
            margin-top: 1rem;
            padding: 0.8rem 1rem;
            background: var(--border-light);
            border-radius: var(--radius-sm);
            font-size: 0.78rem;
            text-align: center;
            font-weight: 600;
            color: var(--text-secondary);
        }
        .progress-track .bar {
            height: 4px;
            background: var(--border);
            border-radius: 10px;
            margin-top: 6px;
            overflow: hidden;
        }
        .progress-track .bar .fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--purple));
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        /* Main */
        .main {
            flex: 1;
            padding: 2rem 2.5rem 4rem;
            max-width: 1200px;
            margin: 0 auto;
            min-width: 0;
            width: 100%;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        .top-bar .breadcrumb {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .top-bar .breadcrumb span { color: var(--text-secondary); }
        .top-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .top-actions button {
            background: var(--border-light);
            border: none;
            border-radius: 40px;
            padding: 8px 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 0.82rem;
            color: var(--text-secondary);
            transition: 0.2s;
        }
        .top-actions button:hover { background: var(--border); }
        body.dark .top-actions button { background: #334155; color: #e2e8f0; }
        .top-actions button.primary { background: var(--primary); color: #fff; }
        .top-actions button.primary:hover { background: var(--primary-dark); }

        .topic-detail {
            background: var(--bg-card);
            padding: 2rem 2.5rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: background 0.3s, border 0.3s;
        }
        .topic-detail h1 {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 0.3rem;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .topic-detail .sub {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 1.2rem;
            border-left: 4px solid var(--primary);
            padding-left: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .topic-detail .sub .tag {
            font-size: 0.65rem;
            padding: 2px 12px;
            border-radius: 40px;
            background: var(--primary-light);
            color: var(--primary);
            font-weight: 600;
        }
        .topic-detail .section {
            margin: 1.8rem 0 0.8rem;
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text);
            border-bottom: 2px solid var(--border);
            padding-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .topic-detail p, .topic-detail li { line-height: 1.8; color: var(--text-secondary); }
        .topic-detail ul, .topic-detail .ascii-box {
            background: var(--border-light);
            padding: 1.2rem 1.8rem;
            border-radius: var(--radius-sm);
            margin: 0.8rem 0;
        }
        .topic-detail ul li { margin: 4px 0; }
        .ascii-box {
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            font-size: 0.75rem;
            line-height: 1.6;
            background: var(--bg);
            border-radius: var(--radius-sm);
            padding: 1.2rem 1.5rem;
            overflow-x: auto;
            border: 1px solid var(--border);
        }
        .box {
            border-radius: var(--radius-sm);
            padding: 1rem 1.5rem;
            margin: 1rem 0;
            border-left: 4px solid;
        }
        .box.tip { background: var(--primary-light); border-color: var(--primary); }
        .box.mistake { background: var(--danger-light); border-color: var(--danger); }
        .box.success { background: var(--success-light); border-color: var(--success); }
        .box.warning { background: var(--warning-light); border-color: var(--warning); }
        .box.purple { background: var(--purple-light); border-color: var(--purple); }
        .box.pink { background: var(--pink-light); border-color: var(--pink); }
        body.dark .box.tip { background: #1e2a4a; border-color: #60a5fa; }
        body.dark .box.mistake { background: #2d1a1a; border-color: #f87171; }
        body.dark .box.success { background: #0f2a1a; border-color: #4ade80; }
        body.dark .box.warning { background: #2a1f0a; border-color: #fbbf24; }
        body.dark .box.purple { background: #1a1a2a; border-color: #a78bfa; }
        body.dark .box.pink { background: #2a0a1a; border-color: #f472b6; }
        .box strong { color: var(--text); }

        .keypoints { display: flex; flex-wrap: wrap; gap: 8px; margin: 0.8rem 0; }
        .keypoints span {
            background: var(--border-light);
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-secondary);
        }
        body.dark .keypoints span { background: #334155; }

        table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: 0.82rem; }
        table th, table td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
        table th { background: var(--border-light); font-weight: 600; color: var(--text); }
        body.dark table th { background: #0f172a; }

        .related-topics {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 0.8rem 0;
        }
        .related-topics span {
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.7rem;
            background: var(--border-light);
            cursor: pointer;
            transition: 0.15s;
            color: var(--text-secondary);
        }
        .related-topics span:hover { background: var(--primary); color: #fff; }
        body.dark .related-topics span:hover { background: var(--primary); }

        @media (max-width: 820px) {
            .app { flex-direction: column; }
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                border-right: 0;
                border-bottom: 1px solid var(--border);
                padding: 1rem;
                max-height: 400px;
                overflow-y: auto;
            }
            .topic-list { max-height: 250px; }
            .main { padding: 1.2rem; }
            .topic-detail { padding: 1.5rem; }
        }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: var(--border-light); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
        body.dark ::-webkit-scrollbar-track { background: #1e293b; }
        body.dark ::-webkit-scrollbar-thumb { background: #475569; }

        .fade-in { animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
        }
        .empty-state i { font-size: 3rem; margin-bottom: 1rem; opacity: 0.3; }
    </style>
</head>
<body>
<div class="app" id="app">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand"><i class="fas fa-server"></i> SysDesign</div>
        <div class="sidebar-stats">
            <span class="stat" id="statTotal">📚 50 Topics</span>
            <span class="stat" id="statDone">✅ 0 Done</span>

        <div class="sidebar-search">

        <ul class="topic-list" id="topicList"></ul>
        <div class="progress-track" id="progressTrack">

            <div class="bar"><div class="fill" id="progressFill" style="width:0%"></div></div>

    </aside>
    <main class="main">
        <div class="top-bar">
            <div class="breadcrumb"><i class="fas fa-home"></i> / <span id="breadcrumbTopic">System Design</span></div>
            <div class="top-actions">
                <button id="markDoneBtn"><i class="fas fa-check-circle"></i> Mark Done</button>
                <button id="cheatSheetToggle"><i class="fas fa-list-check"></i> Cheat Sheet</button>
                <button id="themeToggle"><i class="fas fa-moon"></i></button>
            </div>
        </div>
        <div class="topic-detail" id="topicDetail"></div>
    </main>
</div>

    const theoryData = {

    // ---- HELPERS ----
    function getData(idx) {
        if (idx < 40) return theoryData[idx] || theoryData[0];
        return problemData[idx] || problemData[40];
    }

    // ---- STATE ----
    let currentIndex = 0;
    let showCheatSheet = false;
    let doneSet = new Set();
    let filteredIndices = [];

    // ---- DOM ----
    const listEl = document.getElementById('topicList');
    const detailEl = document.getElementById('topicDetail');
    const searchInput = document.getElementById('searchInput');
    const themeToggle = document.getElementById('themeToggle');
    const cheatSheetToggle = document.getElementById('cheatSheetToggle');
    const markDoneBtn = document.getElementById('markDoneBtn');
    const progressTrack = document.getElementById('progressTrack');
    const progressFill = document.getElementById('progressFill');
    const breadcrumbTopic = document.getElementById('breadcrumbTopic');

    // ---- RENDER ----
    function renderList(filter = '') {
        const q = filter.toLowerCase().trim();
        let html = '';
        filteredIndices = [];
        topics.forEach((t, i) => {
            const match = t.toLowerCase().includes(q);
            if (!match && q) return;
            filteredIndices.push(i);
            const active = i === currentIndex ? 'active' : '';
            const isProblem = i >= 40;
            const isDone = doneSet.has(i);
            const badgeClass = isProblem ? 'design' : 'theory';
            const badgeText = isProblem ? 'Design' : 'Theory';
            const doneBadge = isDone ? ' <span class="badge done">✓</span>' : '';
            html += `<li class="${active}" data-index="${i}">
                <span class="num">${i+1}</span>
                <span>${t}</span>
                <span class="badge ${badgeClass}">${badgeText}</span>
                ${isDone ? '<span class="badge done">✓</span>' : ''}
            </li>`;
        });
        listEl.innerHTML = html || '<li class="empty-state">No topics found</li>';
        listEl.querySelectorAll('li[data-index]').forEach(li => {
            li.addEventListener('click', function() {
                const idx = parseInt(this.dataset.index);
                if (!isNaN(idx)) {
                    currentIndex = idx;
                    showCheatSheet = false;
                    cheatSheetToggle.innerHTML = '<i class="fas fa-list-check"></i> Cheat Sheet';
                    renderDetail(idx);
                    renderList(searchInput.value);
                    updateProgress();
                }
            });
        });
    }

    function renderDetail(idx) {
        const data = getData(idx);
        const title = topics[idx];
        const num = idx + 1;
        const isProblem = idx >= 40;
        const type = isProblem ? 'Design Problem' : 'Theory';
        const isDone = doneSet.has(idx);

        if (showCheatSheet) {
            detailEl.innerHTML = `
                <h1><i class="fas fa-list-check"></i> Quick Cheat Sheet</h1>
                <div class="sub">📌 All 50 topics · Quick revision</div>
                <div class="box purple">
                    <i class="fas fa-rocket"></i> <strong>System Design Cheat Sheet</strong>
                    <ul style="margin-top:8px;list-style:none;padding-left:0;">
                        <li><strong>🏛 Monolith vs Microservices:</strong> Start monolith, split when needed</li>
                        <li><strong>🚪 API Gateway:</strong> Auth, Rate Limiting, Routing</li>
                        <li><strong>⚖️ Load Balancer:</strong> Round Robin, Least Connections, IP Hash</li>
                        <li><strong>🗄 Database:</strong> SQL (ACID) vs NoSQL (BASE)</li>
                        <li><strong>⚡ Caching:</strong> Cache Aside (most common), Redis</li>
                        <li><strong>📈 Scaling:</strong> Vertical (power) vs Horizontal (machines)</li>
                        <li><strong>🎯 CAP Theorem:</strong> Choose 2 of 3 (Consistency, Availability, Partition)</li>
                        <li><strong>📨 Message Queues:</strong> Kafka (volume), RabbitMQ (routing)</li>
                        <li><strong>🚦 Rate Limiting:</strong> Token Bucket (burst support)</li>
                        <li><strong>🔒 Security:</strong> JWT, OAuth 2.0, CORS, CSRF</li>
                        <li><strong>💪 High Availability:</strong> Redundancy, Failover, Health checks</li>
                    </ul>
                </div>
                <div class="box success">📝 <strong>Key Reminders:</strong> Always discuss trade-offs. Start simple, scale gradually. Handle failures gracefully.</div>
                <p style="margin-top:12px; opacity:0.6;"><i class="fas fa-arrow-right"></i> Click any topic for detailed notes</p>
            `;
            return;
        }

        let extraHtml = '';
        if (isProblem) {
            extraHtml = `
                <div class="box warning"><i class="fas fa-pen"></i> <strong>Design Steps</strong><br>${(data.steps || '').replace(/\n/g, '<br>')}</div>
                <div class="box tip"><i class="fas fa-calculator"></i> <strong>Trade-offs</strong><br>${(data.adv || 'See advantages/disadvantages').replace(/\n/g, '<br>')}</div>
                <div class="box success"><i class="fas fa-comments"></i> <strong>Interview Approach</strong><br>${(data.interview || '').replace(/\n/g, '<br>')}</div>
                <div class="box pink"><i class="fas fa-list-check"></i> <strong>Cheat Sheet</strong><br>${(data.cheat || '').replace(/\n/g, '<br>')}</div>
            `;
        } else {
            extraHtml = `
                <div class="section"><i class="fas fa-check-circle"></i> Advantages</div>
                <ul>${(data.adv || '').split('\n').filter(a => a.trim()).map(a => `<li>${a}</li>`).join('')}</ul>
                <div class="section"><i class="fas fa-times-circle"></i> Disadvantages</div>
                <ul>${(data.dis || '').split('\n').filter(d => d.trim()).map(d => `<li>${d}</li>`).join('')}</ul>
                <div class="section"><i class="fas fa-rocket"></i> Use Cases</div>
                <ul>${(data.use || '').split('\n').filter(u => u.trim()).map(u => `<li>${u}</li>`).join('')}</ul>
                <div class="box success"><i class="fas fa-comments"></i> <strong>Interview Q&A</strong><br>${(data.interview || '').replace(/\n/g, '<br>')}</div>
                <div class="box pink"><i class="fas fa-list-check"></i> <strong>Cheat Sheet</strong><br>${(data.cheat || '').replace(/\n/g, '<br>')}</div>
            `;
        }

        const keypointsHtml = (data.keypoints || []).map(k => `<span>${k}</span>`).join('');

        detailEl.innerHTML = `
            <h1>
                <i class="fas ${isProblem ? 'fa-puzzle-piece' : 'fa-code'}"></i>
                Topic ${num}: ${title}
                ${isDone ? ' <span style="font-size:0.8rem;color:#22c55e;">✅ Done</span>' : ''}
            </h1>
            <div class="sub">
                📌 ${type} · ${num}/50
                <span class="tag">${isProblem ? 'Design' : 'Theory'}</span>
            </div>

            <div class="section"><i class="fas fa-question-circle"></i> ${isProblem ? 'Problem Statement' : 'Concept'}</div>
            <p>${data.desc || 'Detailed explanation'}</p>

            <div class="section"><i class="fas fa-globe"></i> ${isProblem ? 'Real-World Example' : 'Example'}</div>
            <p>${data.example || 'Real-world example'}</p>

            <div class="section"><i class="fas fa-project-diagram"></i> ${isProblem ? 'Architecture' : 'Visual Diagram'}</div>
            <div class="ascii-box">${data.diagram || 'Diagram here'}</div>

            ${data.keypoints ? `<div class="keypoints">${keypointsHtml}</div>` : ''}

            ${extraHtml}

            ${data.related ? `
                <div class="section"><i class="fas fa-link"></i> Related Topics</div>
                <div class="related-topics">
                    ${data.related.map(r => `<span data-index="${r}">${r+1}. ${topics[r]}</span>`).join('')}
                </div>
            ` : ''}

            <div class="box tip">💡 <strong>Interview Tip:</strong> Always discuss trade-offs. Interviewers want to see you think about pros and cons.</div>
            <div class="box mistake">⚠️ <strong>Common Mistake:</strong> Not considering trade-offs. Every design decision has implications.</div>
            <div class="box success">📝 <strong>Ek Line Mein Summary:</strong> ${title} — ${(data.desc || '').substring(0, 100)}...</div>
            <p style="margin-top:12px; opacity:0.6;"><i class="fas fa-arrow-right"></i> Navigate via sidebar · ${50 - num} topics remaining</p>
        `;

        // Related topics click
        detailEl.querySelectorAll('.related-topics span').forEach(el => {
            el.addEventListener('click', function() {
                const idx = parseInt(this.dataset.index);
                if (!isNaN(idx)) {
                    currentIndex = idx;
                    showCheatSheet = false;
                    cheatSheetToggle.innerHTML = '<i class="fas fa-list-check"></i> Cheat Sheet';
                    renderDetail(idx);
                    renderList(searchInput.value);
                    updateProgress();
                }
            });
        });

        breadcrumbTopic.textContent = title;
        detailEl.scrollIntoView({ block: 'start', behavior: 'smooth' });
    }

    function updateProgress() {
        const count = doneSet.size;
        const pct = (count / 50 * 100);
        progressTrack.innerHTML = `
            📌 ${count} / 50 mastered
            <div class="bar"><div class="fill" style="width:${pct}%"></div></div>
        `;
        progressFill.style.width = pct + '%';
        document.getElementById('statDone').textContent = `✅ ${count} Done`;
        // Update list to show done badges
        renderList(searchInput.value);
    }

    // ---- EVENTS ----
    searchInput.addEventListener('input', function(e) { renderList(e.target.value); });

    themeToggle.addEventListener('click', function() {
        document.body.classList.toggle('dark');
        this.innerHTML = document.body.classList.contains('dark')
            ? '<i class="fas fa-sun"></i>'
            : '<i class="fas fa-moon"></i>';
    });

    cheatSheetToggle.addEventListener('click', function() {
        showCheatSheet = !showCheatSheet;
        this.innerHTML = showCheatSheet
            ? '<i class="fas fa-book"></i> Back to Notes'
            : '<i class="fas fa-list-check"></i> Cheat Sheet';
        renderDetail(currentIndex);
    });

    markDoneBtn.addEventListener('click', function() {
        if (doneSet.has(currentIndex)) {
            doneSet.delete(currentIndex);
        } else {
            doneSet.add(currentIndex);
        }
        updateProgress();
        renderDetail(currentIndex);
        renderList(searchInput.value);
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
            const idx = filteredIndices.indexOf(currentIndex);
            if (idx < filteredIndices.length - 1) {
                currentIndex = filteredIndices[idx + 1];
                renderDetail(currentIndex);
                renderList(searchInput.value);
                e.preventDefault();
            }
        } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
            const idx = filteredIndices.indexOf(currentIndex);
            if (idx > 0) {
                currentIndex = filteredIndices[idx - 1];
                renderDetail(currentIndex);
                renderList(searchInput.value);
                e.preventDefault();
            }
        } else if (e.key === 'd' || e.key === 'D') {
            markDoneBtn.click();
        } else if (e.key === 'c' || e.key === 'C') {
            cheatSheetToggle.click();
        }
    });

    // ---- INIT ----thet
    renderList();
    renderDetail(0);
    doneSet.add(0);
    updateProgress();

    // Hash navigation
    window.addEventListener('hashchange', function() {
        const hash = parseInt(window.location.hash.slice(1));
        if (!isNaN(hash) && hash >= 0 && hash < topics.length) {
            currentIndex = hash;
            showCheatSheet = false;
            cheatSheetToggle.innerHTML = '<i class="fas fa-list-check"></i> Cheat Sheet';
            renderDetail(currentIndex);
            renderList(searchInput.value);
            updateProgress();
        }
    });
    if (!window.location.hash) window.location.hash = '0';

    console.log('🎯 System Design Mastery loaded!');
    console.log('⌨️ Keyboard shortcuts: ← → navigate, d = mark done, c = cheat sheet');
</script>
