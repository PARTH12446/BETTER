    // ---------- RENDER ----------
    const topicNav = document.getElementById('topicNav');
    const topicTitle = document.getElementById('topicTitle');
    const questionCount = document.getElementById('questionCount');
    const questionList = document.getElementById('questionList');

    const topicNames = Object.keys(TOPICS);
    let activeTopic = topicNames[0];

    function renderNav() {
        const label = topicNav.querySelector('span');
        topicNav.innerHTML = '';
        topicNav.appendChild(label);
        topicNames.forEach(name => {
            const btn = document.createElement('button');
            btn.className = 'topic-btn' + (name === activeTopic ? ' active' : '');
            btn.textContent = name;
            btn.dataset.topic = name;
            btn.addEventListener('click', () => {
                activeTopic = name;
                renderNav();
                renderQuestions(name);
            });
            topicNav.appendChild(btn);
        });
    }

    function renderQuestions(topicName) {
        const qs = TOPICS[topicName] || [];
        topicTitle.textContent = topicName;
        questionCount.textContent = qs.length + ' questions';

        if (qs.length === 0) {
            questionList.innerHTML = `<div style="padding:2rem;text-align:center;color:#64748b;">No questions for this topic.</div>`;
            return;
        }

        let html = '';
        qs.forEach((q, idx) => {
            const num = idx + 1;
            html += `
                <div class="question-item">
                    <span class="q-number">${num}.</span>
                    <span class="q-text">${q}</span>
                </div>
            `;
        });
        questionList.innerHTML = html;
    }

    // init
    renderNav();
    renderQuestions(activeTopic);
</script>
