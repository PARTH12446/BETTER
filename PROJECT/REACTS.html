                        <span class="keyword">export</span> <span class="keyword">function</span> <span class="function">ThemeProvider</span>({ children }) {
                            <span class="keyword">const</span> [theme, setTheme] = <span class="function">useState</span>(<span class="string">'light'</span>);

                            <span class="keyword">const</span> toggleTheme = () => {
                                <span class="function">setTheme</span>(prev => prev === <span class="string">'light'</span> ? <span class="string">'dark'</span> : <span class="string">'light'</span>);
                            };

                            <span class="keyword">return</span> (
                                <span class="tag">&lt;ThemeContext.Provider</span> <span class="variable">value</span>={{ theme, toggleTheme }}<span class="tag">&gt;</span>
                                    {children}
                                <span class="tag">&lt;/ThemeContext.Provider&gt;</span>
                            );
                        }

                        <span class="keyword">export</span> <span class="keyword">function</span> <span class="function">useTheme</span>() {
                            <span class="keyword">return</span> <span class="function">useContext</span>(ThemeContext);
                        }

                        <span class="comment">// App.js</span>
                        <span class="keyword">function</span> <span class="function">App</span>() {
                            <span class="keyword">return</span> (
                                <span class="tag">&lt;ThemeProvider&gt;</span>
                                    <span class="tag">&lt;HomeScreen /&gt;</span>
                                <span class="tag">&lt;/ThemeProvider&gt;</span>
                            );
                        }

                        <span class="comment">// HomeScreen.js</span>
                        <span class="keyword">function</span> <span class="function">HomeScreen</span>() {
                            <span class="keyword">const</span> { theme, toggleTheme } = <span class="function">useTheme</span>();

                            <span class="keyword">const</span> backgroundColor = theme === <span class="string">'light'</span> ? <span class="string">'#fff'</span> : <span class="string">'#333'</span>;
                            <span class="keyword">const</span> textColor = theme === <span class="string">'light'</span> ? <span class="string">'#333'</span> : <span class="string">'#fff'</span>;

                            <span class="keyword">return</span> (
                                <span class="tag">&lt;View</span> <span class="variable">style</span>={{ flex: 1, backgroundColor, justifyContent: <span class="string">'center'</span>, alignItems: <span class="string">'center'</span> }}<span class="tag">&gt;</span>
                                    <span class="tag">&lt;Text</span> <span class="variable">style</span>={{ color: textColor, fontSize: 20 }}<span class="tag">&gt;</span>
                                        Current Theme: {theme}
                                    <span class="tag">&lt;/Text&gt;</span>
                                    <span class="tag">&lt;Button</span> <span class="variable">title</span>=<span class="string">"Toggle Theme"</span> <span class="variable">onPress</span>={toggleTheme} <span class="tag">/&gt;</span>
                                <span class="tag">&lt;/View&gt;</span>
                            );
                        }
                    </div>
                </div>

                <div class="note-section">
                    <h3><i class="fas fa-store"></i> Redux with React Native</h3>
                    <div class="code-block">
                        <span class="lang-tag">Terminal</span>
                        npm install @reduxjs/toolkit react-redux

                        <span class="lang-tag">JavaScript</span>
                        <span class="comment">// store.js</span>
                        <span class="keyword">import</span> { configureStore } <span class="keyword">from</span> <span class="string">'@reduxjs/toolkit'</span>;

                        <span class="keyword">const</span> counterSlice = <span class="function">createSlice</span>({
                            <span class="variable">name</span>: <span class="string">'counter'</span>,
                            <span class="variable">initialState</span>: { <span class="variable">value</span>: 0 },
                            <span class="variable">reducers</span>: {
                                <span class="variable">increment</span>: (state) => { state.<span class="variable">value</span> += 1; },
                                <span class="variable">decrement</span>: (state) => { state.<span class="variable">value</span> -= 1; }
                            }
                        });

                        <span class="keyword">export</span> <span class="keyword">const</span> store = <span class="function">configureStore</span>({
                            <span class="variable">reducer</span>: {
                                <span class="variable">counter</span>: counterSlice.<span class="variable">reducer</span>
                            }
                        });

                        <span class="comment">// App.js</span>
                        <span class="keyword">import</span> { Provider } <span class="keyword">from</span> <span class="string">'react-redux'</span>;
                        <span class="keyword">import</span> { store } <span class="keyword">from</span> <span class="string">'./store'</span>;

                        <span class="keyword">function</span> <span class="function">App</span>() {
                            <span class="keyword">return</span> (
                                <span class="tag">&lt;Provider</span> <span class="variable">store</span>={store}<span class="tag">&gt;</span>
                                    <span class="tag">&lt;Counter /&gt;</span>
                                <span class="tag">&lt;/Provider&gt;</span>
                            );
                        }

                        <span class="comment">// Counter.js</span>
                        <span class="keyword">import</span> { useSelector, useDispatch } <span class="keyword">from</span> <span class="string">'react-redux'</span>;
                        <span class="keyword">import</span> { increment, decrement } <span class="keyword">from</span> <span class="string">'./store'</span>;

                        <span class="keyword">function</span> <span class="function">Counter</span>() {
                            <span class="keyword">const</span> count = <span class="function">useSelector</span>(state => state.<span class="variable">counter</span>.<span class="variable">value</span>);
                            <span class="keyword">const</span> dispatch = <span class="function">useDispatch</span>();

                            <span class="keyword">return</span> (
                                <span class="tag">&lt;View&gt;</span>
                                    <span class="tag">&lt;Text&gt;</span>Count: {count}<span class="tag">&lt;/Text&gt;</span>
                                    <span class="tag">&lt;Button</span> <span class="variable">title</span>=<span class="string">"+"</span> <span class="variable">onPress</span>={() => <span class="function">dispatch</span>(<span class="function">increment</span>())} <span class="tag">/&gt;</span>
                                    <span class="tag">&lt;Button</span> <span class="variable">title</span>=<span class="string">"-"</span> <span class="variable">onPress</span>={() => <span class="function">dispatch</span>(<span class="function">decrement</span>())} <span class="tag">/&gt;</span>
                                <span class="tag">&lt;/View&gt;</span>
                            );
                        }
                    </div>
                </div>

                <div class="note-box success">
                    <i class="fas fa-check-circle"></i>
                    <strong>State Management Tips:</strong>
                    <ul>
                        <li>Use useState for simple component-level state</li>
                        <li>Use Context for global state (theme, user, settings)</li>
                        <li>Use Redux for complex state (multiple features, frequent updates)</li>
                        <li>Use Zustand for a simpler Redux alternative</li>
                        <li>Use AsyncStorage for persistent data</li>
                    </ul>
                </div>
            `
        }

    };

    // ================================================================
    // RENDER ENGINE
    // ================================================================
    const topicNav = document.getElementById('topicNav');
    const topicTitle = document.getElementById('topicTitle');
    const topicBadge = document.getElementById('topicBadge');
    const notesContent = document.getElementById('notesContent');
    const progressFill = document.getElementById('progressFill');

    const topicNames = Object.keys(NOTES);
    let activeTopic = topicNames[0];

    function renderNav() {
        const label = topicNav.querySelector('.label');
        topicNav.innerHTML = '';
        topicNav.appendChild(label);
        topicNames.forEach(name => {
            const btn = document.createElement('button');
            btn.className = 'topic-btn' + (name === activeTopic ? ' active' : '');
            let displayName = name;
            if (name.length > 40) {
                displayName = name.substring(0, 37) + '...';
            }
            btn.textContent = displayName;
            btn.title = name;
            btn.dataset.topic = name;
            btn.addEventListener('click', () => {
                activeTopic = name;
                renderNav();
                renderContent(name);
            });
            topicNav.appendChild(btn);
        });
    }

    function renderContent(topicName) {
        const data = NOTES[topicName];
        if (!data) {
            notesContent.innerHTML = '<p>Topic not found.</p>';
            return;
        }

        topicTitle.textContent = topicName;
        topicBadge.textContent = 'Complete Notes';
        notesContent.innerHTML = data.content;

        const total = topicNames.length;
        const current = topicNames.indexOf(topicName) + 1;
        const progress = Math.round((current / total) * 100);
        progressFill.style.width = progress + '%';
        progressFill.title = progress + '% complete';
    }

    renderNav();
    renderContent(activeTopic);
</script>
