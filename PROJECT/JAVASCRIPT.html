<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>JavaScript Mastery · 50 Topics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #f6f8fc;
            --bg-card: #ffffff;
            --bg-sidebar: #ffffff;
            --text: #1e293b;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --border-light: #f1f5f9;
            --primary: #f59e0b;
            --primary-light: #fef3c7;
            --primary-dark: #d97706;
            --success: #22c55e;
            --success-light: #f0fdf4;
            --danger: #ef4444;
            --danger-light: #fee2e2;
            --purple: #8b5cf6;
            --purple-light: #ede9fe;
            --blue: #3b82f6;
            --blue-light: #dbeafe;
            --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            --shadow-lg: 0 10px 40px rgba(0,0,0,0.08);
            --radius: 16px;
            --radius-sm: 8px;
            --transition: 0.2s ease;
            --font-code: 'Fira Code', monospace;
        }
        body.dark {
            --bg: #0f172a;
            --bg-card: #1e293b;
            --bg-sidebar: #1e293b;
            --text: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border: #334155;
            --border-light: #1e293b;
            --primary: #fbbf24;
            --primary-light: #1e2a1a;
            --shadow: 0 1px 3px rgba(0,0,0,0.3);
            --shadow-lg: 0 10px 40px rgba(0,0,0,0.4);
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            transition: background 0.3s, color 0.3s;
        }
        .app { display: flex; min-height: 100vh; }

        .sidebar {
            width: 380px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            padding: 1.2rem 1rem;
            overflow-y: auto;
            position: sticky;
            top: 0;
            height: 100vh;
            flex-shrink: 0;
            transition: background 0.3s, border 0.3s;
            z-index: 10;
        }
        .sidebar-brand {
            font-weight: 800;
            font-size: 1.3rem;
            padding: 0 0.5rem 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--primary);
        }
        .sidebar-brand i { font-size: 1.6rem; }
        .sidebar-stats {
            display: flex;
            gap: 6px;
            padding: 0 0.5rem 1rem;
            flex-wrap: wrap;
        }
        .sidebar-stats .stat {
            font-size: 0.65rem;
            padding: 3px 10px;
            border-radius: 40px;
            background: var(--primary-light);
            color: var(--primary-dark);
            font-weight: 600;
        }
        body.dark .sidebar-stats .stat { background: #1e2a1a; color: #fbbf24; }
        .sidebar-search {
            margin-bottom: 1rem;
            padding: 0 0.5rem;
            position: relative;
        }
        .sidebar-search input {
            width: 100%;
            padding: 10px 14px 10px 38px;
            border-radius: 40px;
            border: 1px solid var(--border);
            background: var(--bg);
            font-size: 0.85rem;
            outline: none;
            transition: 0.2s;
            color: var(--text);
        }
        .sidebar-search input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(245,158,11,0.2); }
        .sidebar-search .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }
        .topic-list {
            list-style: none;
            padding: 0 0.2rem;
            max-height: calc(100vh - 300px);
            overflow-y: auto;
        }
        .topic-list li {
            padding: 4px 10px;
            margin: 1px 0;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.15s;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-secondary);
            line-height: 1.3;
        }
        .topic-list li:hover { background: var(--border-light); }
        .topic-list li.active {
            background: var(--primary);
            color: #fff;
            font-weight: 600;
        }
        body.dark .topic-list li.active { background: var(--primary); color: #0f172a; }
        .topic-list li .badge {
            margin-left: auto;
            font-size: 0.45rem;
            padding: 1px 8px;
            border-radius: 30px;
            white-space: nowrap;
            font-weight: 600;
        }
        .topic-list li .badge.core { background: var(--primary-light); color: var(--primary-dark); }
        .topic-list li .badge.advanced { background: var(--purple-light); color: #6d28d9; }
        .topic-list li .badge.done { background: var(--success-light); color: #166534; }
        body.dark .topic-list li .badge.core { background: #1e2a1a; color: #fbbf24; }
        body.dark .topic-list li .badge.advanced { background: #1a1a2a; color: #a78bfa; }
        body.dark .topic-list li .badge.done { background: #0f2a1a; color: #4ade80; }
        .topic-list li .num { opacity: 0.4; font-size: 0.55rem; min-width: 20px; }

        .progress-track {
            margin-top: 1rem;
            padding: 0.8rem 1rem;
            background: var(--border-light);
            border-radius: var(--radius-sm);
            font-size: 0.78rem;
            text-align: center;
            font-weight: 600;
            color: var(--text-secondary);
        }
        .progress-track .bar {
            height: 4px;
            background: var(--border);
            border-radius: 10px;
            margin-top: 6px;
            overflow: hidden;
        }
        .progress-track .bar .fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--purple));
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        .main {
            flex: 1;
            padding: 2rem 2.5rem 4rem;
            max-width: 1200px;
            margin: 0 auto;
            min-width: 0;
            width: 100%;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        .top-bar .breadcrumb {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .top-bar .breadcrumb span { color: var(--text-secondary); }
        .top-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .top-actions button {
            background: var(--border-light);
            border: none;
            border-radius: 40px;
            padding: 8px 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 0.82rem;
            color: var(--text-secondary);
            transition: 0.2s;
            font-family: inherit;
        }
        .top-actions button:hover { background: var(--border); }
        body.dark .top-actions button { background: #334155; color: #e2e8f0; }
        .top-actions button.primary { background: var(--primary); color: #0f172a; }
        .top-actions button.primary:hover { background: var(--primary-dark); }

        .topic-detail {
            background: var(--bg-card);
            padding: 2rem 2.5rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: background 0.3s, border 0.3s;
        }
        .topic-detail h1 {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 0.3rem;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .topic-detail .sub {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 1.2rem;
            border-left: 4px solid var(--primary);
            padding-left: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .topic-detail .sub .tag {
            font-size: 0.65rem;
            padding: 2px 12px;
            border-radius: 40px;
            background: var(--primary-light);
            color: var(--primary-dark);
            font-weight: 600;
        }
        .topic-detail .section {
            margin: 1.8rem 0 0.8rem;
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text);
            border-bottom: 2px solid var(--border);
            padding-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .topic-detail p, .topic-detail li { line-height: 1.8; color: var(--text-secondary); }
        .topic-detail ul, .topic-detail .code-box {
            background: var(--border-light);
            padding: 1.2rem 1.8rem;
            border-radius: var(--radius-sm);
            margin: 0.8rem 0;
        }
        .topic-detail ul li { margin: 4px 0; }
        .code-box {
            font-family: var(--font-code);
            white-space: pre-wrap;
            font-size: 0.78rem;
            line-height: 1.6;
            background: var(--bg);
            border-radius: var(--radius-sm);
            padding: 1.2rem 1.5rem;
            overflow-x: auto;
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }
        .box {
            border-radius: var(--radius-sm);
            padding: 1rem 1.5rem;
            margin: 1rem 0;
            border-left: 4px solid;
        }
        .box.tip { background: var(--primary-light); border-color: var(--primary); }
        .box.mistake { background: var(--danger-light); border-color: var(--danger); }
        .box.success { background: var(--success-light); border-color: var(--success); }
        .box.purple { background: var(--purple-light); border-color: var(--purple); }
        .box.blue { background: var(--blue-light); border-color: var(--blue); }
        body.dark .box.tip { background: #1e2a1a; border-color: #fbbf24; }
        body.dark .box.mistake { background: #2d1a1a; border-color: #f87171; }
        body.dark .box.success { background: #0f2a1a; border-color: #4ade80; }
        body.dark .box.purple { background: #1a1a2a; border-color: #a78bfa; }
        body.dark .box.blue { background: #0a1a2a; border-color: #60a5fa; }
        .box strong { color: var(--text); }

        .keypoints { display: flex; flex-wrap: wrap; gap: 6px; margin: 0.8rem 0; }
        .keypoints span {
            background: var(--border-light);
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 500;
            color: var(--text-secondary);
            font-family: var(--font-code);
        }
        body.dark .keypoints span { background: #334155; }

        .related-topics {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 0.8rem 0;
        }
        .related-topics span {
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.7rem;
            background: var(--border-light);
            cursor: pointer;
            transition: 0.15s;
            color: var(--text-secondary);
        }
        .related-topics span:hover { background: var(--primary); color: #0f172a; }
        body.dark .related-topics span:hover { background: var(--primary); color: #0f172a; }

        @media (max-width: 820px) {
            .app { flex-direction: column; }
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                border-right: 0;
                border-bottom: 1px solid var(--border);
                padding: 1rem;
                max-height: 400px;
                overflow-y: auto;
            }
            .topic-list { max-height: 250px; }
            .main { padding: 1.2rem; }
            .topic-detail { padding: 1.5rem; }
        }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: var(--border-light); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
        body.dark ::-webkit-scrollbar-track { background: #1e293b; }
        body.dark ::-webkit-scrollbar-thumb { background: #475569; }

        .fade-in { animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
        }
        .empty-state i { font-size: 3rem; margin-bottom: 1rem; opacity: 0.3; }
    </style>
</head>
<body>
<div class="app" id="app">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand"><i class="fab fa-js-square"></i> JS Mastery</div>
        <div class="sidebar-stats">
            <span class="stat" id="statTotal">📚 50 Topics</span>
            <span class="stat" id="statDone">✅ 0 Done</span>
            <span class="stat" id="statCore">⭐ 0 Core</span>
            <span class="stat" id="statAdv">🚀 0 Advanced</span>
        </div>
        <div class="sidebar-search">
            <span class="search-icon"><i class="fas fa-search"></i></span>
            <input type="text" id="searchInput" placeholder="Search 50 topics..." />
        </div>
        <ul class="topic-list" id="topicList"></ul>
        <div class="progress-track" id="progressTrack">
            📌 0 / 50 mastered
            <div class="bar"><div class="fill" id="progressFill" style="width:0%"></div></div>
        </div>
    </aside>
    <main class="main">
        <div class="top-bar">
            <div class="breadcrumb"><i class="fas fa-code"></i> / <span id="breadcrumbTopic">JavaScript</span></div>
            <div class="top-actions">
                <button id="markDoneBtn"><i class="fas fa-check-circle"></i> Mark Done</button>
                <button id="cheatSheetToggle"><i class="fas fa-list-check"></i> Cheat Sheet</button>
                <button id="themeToggle"><i class="fas fa-moon"></i></button>
            </div>
        </div>
        <div class="topic-detail" id="topicDetail"></div>
    </main>
</div>
<script>
    // ---- 50 JAVASCRIPT TOPICS ----
    var topics = [
        "JavaScript Engine & Runtime",
        "Execution Context & Call Stack",
        "Hoisting & Temporal Dead Zone",
        "Scopes & Closures",
        "Lexical Environment",
        "this Keyword — All 4 Rules",
        "call, apply, bind",
        "Prototypes & Prototypal Inheritance",
        "Classes (ES6)",
        "Objects — Deep Dive",
        "Primitives vs Reference Types",
        "Type Coercion",
        "Equality (== vs ===)",
        "Truthy & Falsy Values",
        "Event Loop & Concurrency",
        "Microtasks vs Macrotasks",
        "Promises & Async/Await",
        "Callbacks & Callback Hell",
        "Error Handling (try/catch)",
        "Modules (ESM vs CommonJS)",
        "Arrow Functions",
        "Spread & Rest Operators",
        "Destructuring",
        "Template Literals",
        "Map, Set, WeakMap, WeakSet",
        "Closures — Practical Uses",
        "Higher-Order Functions",
        "Currying & Partial Application",
        "Function Composition",
        "Memoization",
        "Debouncing & Throttling",
        "Event Delegation",
        "Web Workers",
        "Service Workers",
        "Proxies & Reflect",
        "Symbols & Iterators",
        "Generators & Yield",
        "Async Generators",
        "Decorators (Stage 3)",
        "Optional Chaining & Nullish Coalescing",
        "Private Fields (#)",
        "Top-Level Await",
        "Dynamic Imports",
        "WeakRefs & FinalizationRegistry",
        "Array Methods (map, filter, reduce)",
        "Performance Optimization",
        "Memory Management",
        "Functional Programming in JS",
        "Design Patterns in JS",
        "Testing (Jest, Mocha)"
    ];

    // ---- COMPLETE DATA ----
    var topicData = {};

    // Core topics (0-24)
    topicData[0] = {
        desc: "JavaScript Engine (V8, SpiderMonkey) executes JS code. Runtime includes engine, Web APIs, callback queue, event loop.",
        example: "V8 engine used in Chrome and Node.js.",
        diagram: "JS RUNTIME:\n+-------------------+\n|  JS Engine (V8)   |\n|  +-------------+  |\n|  | Memory Heap |  |\n|  | Call Stack  |  |\n|  +-------------+  |\n+-------------------+\n       ↓\n+-------------------+\n|  Web APIs         |\n|  (DOM, setTimeout)|\n+-------------------+\n       ↓\n+-------------------+\n|  Callback Queue   |\n+-------------------+\n       ↓\n|  Event Loop       |",
        adv: "✅ Fast execution\n✅ Just-in-time compilation\n✅ Cross-platform",
        dis: "❌ Single-threaded\n❌ Memory management",
        use: "Browsers, Node.js, Deno, Bun",
        interview: "Q: JS Engine vs Runtime?\nA: Engine executes code. Runtime adds APIs, event loop, queues.",
        cheat: "• Engine: Parses + Executes\n• Runtime: Environment",
        keypoints: ["V8", "Event Loop", "Heap", "Stack"],
        related: [1, 14, 15],
        category: "core"
    };
    topicData[1] = {
        desc: "Execution Context is environment where code runs. Call Stack tracks function calls.",
        example: "Global EC → function EC → execution.",
        diagram: "EXECUTION CONTEXT:\n+------------------+\n|  Variable Object |\n|  Scope Chain     |\n|  this            |\n+------------------+\n\nCALL STACK:\n[global] → [foo] → [bar] → [baz]",
        adv: "✅ Predictable execution\n✅ Debugging",
        dis: "❌ Stack overflow (infinite recursion)",
        use: "All JS code execution",
        interview: "Q: Execution Context?\nA: Environment for code execution. Has VO, scope chain, this.",
        cheat: "• Global EC: Window\n• Function EC: Per function",
        keypoints: ["Variable Object", "Scope Chain", "this"],
        related: [0, 2, 3],
        category: "core"
    };
    topicData[2] = {
        desc: "Hoisting moves declarations to top. TDZ is time between entering scope and declaration.",
        example: "console.log(x) → undefined (var). console.log(y) → ReferenceError (let).",
        diagram: "HOISTING:\nvar x; → x = undefined (hoisted)\nlet y; → TDZ (not hoisted)\nfunction foo() {} → hoisted (entire)",
        adv: "✅ var hoisting useful\n✅ Function hoisting",
        dis: "❌ Confusing behavior\n❌ TDZ errors",
        use: "Understanding JS behavior",
        interview: "Q: Hoisting vs TDZ?\nA: var hoisted to undefined. let/const have TDZ.",
        cheat: "• var: Hoisted (undefined)\n• let/const: TDZ\n• functions: Hoisted (entire)",
        keypoints: ["Hoisting", "TDZ", "undefined", "ReferenceError"],
        related: [1, 3, 5],
        category: "core"
    };
    topicData[3] = {
        desc: "Scope defines variable visibility. Closure is function that remembers its lexical scope.",
        example: "function outer() { let x = 1; return function inner() { console.log(x); } }",
        diagram: "SCOPES:\nGlobal Scope\n  ↓\nFunction Scope\n  ↓\nBlock Scope (let/const)\n\nCLOSURE:\nfunction outer() {\n  let x = 1;\n  return function inner() {\n    console.log(x); // remembers x\n  }\n}",
        adv: "✅ Data privacy\n✅ Function factories\n✅ Stateful functions",
        dis: "❌ Memory leaks\n❌ Hard to debug",
        use: "Private variables, Currying, HOCs",
        interview: "Q: Closure kya hai?\nA: Function that remembers its lexical scope even when executed outside.",
        cheat: "• Closure: Function + Lexical Scope\n• Use: Private state",
        keypoints: ["Lexical Scope", "Closure", "Private variables"],
        related: [1, 2, 25],
        category: "core"
    };
    topicData[4] = {
        desc: "Lexical Environment is the actual record of variable bindings in a scope.",
        example: "Each scope has its own lexical environment.",
        diagram: "LEXICAL ENVIRONMENT:\n+------------------+\n|  Environment     |\n|  +------------+  |\n|  | Binding 1  |  |\n|  | Binding 2  |  |\n|  +------------+  |\n|  Outer ref      |\n+------------------+",
        adv: "✅ Determines variable lookup\n✅ Scope chain",
        dis: "❌ Memory overhead",
        use: "Closures, Scope resolution",
        interview: "Q: Lexical Environment?\nA: Data structure storing variable bindings. Has outer reference.",
        cheat: "• Environment: Stores variables\n• Outer: Parent scope",
        keypoints: ["Environment", "Bindings", "Outer reference"],
        related: [1, 3, 5],
        category: "core"
    };
    topicData[5] = {
        desc: "'this' refers to the execution context. 4 rules: Default, Implicit, Explicit, New.",
        example: "new → this = new object. obj.foo() → this = obj. foo() → this = global.",
        diagram: "this RULES:\n1. DEFAULT: this = global (non-strict)\n2. IMPLICIT: obj.foo() → this = obj\n3. EXPLICIT: call/apply/bind\n4. NEW: this = new object",
        adv: "✅ Flexible\n✅ Dynamic",
        dis: "❌ Confusing\n❌ Loses context",
        use: "Object methods, Constructors, Event handlers",
        interview: "Q: this rules?\nA: Default, Implicit, Explicit, New. Arrow functions inherit this.",
        cheat: "• Default: global\n• Implicit: obj\n• Explicit: call/apply/bind\n• New: new object",
        keypoints: ["Default", "Implicit", "Explicit", "New"],
        related: [3, 6, 20],
        category: "core"
    };
    topicData[6] = {
        desc: "call, apply, bind explicitly set 'this'. call takes args individually, apply takes array, bind returns new function.",
        example: "fn.call(obj, 1, 2) → fn.apply(obj, [1,2]) → fn.bind(obj)(1,2)",
        diagram: "call: fn.call(this, arg1, arg2)\napply: fn.apply(this, [arg1, arg2])\nbind: fn.bind(this) → new function",
        adv: "✅ Control this\n✅ Borrow methods\n✅ Partial application",
        dis: "❌ Overhead\n❌ Confusing",
        use: "Method borrowing, Currying, Event handlers",
        interview: "Q: call vs apply vs bind?\nA: call/apply execute, bind returns function. apply takes array.",
        cheat: "• call: Individual args\n• apply: Array args\n• bind: New function",
        keypoints: ["call", "apply", "bind"],
        related: [5, 20, 21],
        category: "core"
    };
    topicData[7] = {
        desc: "Prototypes are the mechanism for inheritance in JS. Objects inherit from other objects.",
        example: "arr.__proto__ → Array.prototype → Object.prototype",
        diagram: "PROTOTYPE CHAIN:\nmyObject\n   ↓\nObject.prototype\n   ↓\nnull\n\nArray → Array.prototype → Object.prototype → null",
        adv: "✅ Memory efficient\n✅ Dynamic inheritance\n✅ Method sharing",
        dis: "❌ Confusing\n❌ Override issues",
        use: "Inheritance, Method sharing, Polyfills",
        interview: "Q: Prototypal Inheritance?\nA: Objects inherit directly from other objects via prototype chain.",
        cheat: "• __proto__: Actual prototype\n• prototype: Constructor property",
        keypoints: ["__proto__", "prototype", "Chain"],
        related: [3, 8, 9],
        category: "core"
    };
    topicData[8] = {
        desc: "Classes are syntactic sugar over prototypes. Introduced in ES6.",

    };

    // Merge advanced details
    for (var key in advancedDetails) {
        if (advancedDetails.hasOwnProperty(key)) {
            topicData[key] = advancedDetails[key];
        }
    }

    // ---- HELPERS ----
    function getData(idx) {
        return topicData[idx] || {
            desc: "Detailed explanation of this JavaScript concept.",
            example: "Practical example.",
            diagram: "Diagram here.",
            adv: "Advantages here.",
            dis: "Disadvantages here.",
            use: "Use cases here.",
            interview: "Interview Q&A here.",
            cheat: "Cheat sheet here.",
            keypoints: ["Key 1", "Key 2"],
            related: [0, 1],
            category: "core"
        };
    }

    // ---- STATE ----
    var currentIndex = 0;
    var showCheatSheet = false;
    var doneSet = new Set();
    var filteredIndices = [];

    // ---- DOM ----
    var listEl = document.getElementById('topicList');
    var detailEl = document.getElementById('topicDetail');
    var searchInput = document.getElementById('searchInput');
    var themeToggle = document.getElementById('themeToggle');
    var cheatSheetToggle = document.getElementById('cheatSheetToggle');
    var markDoneBtn = document.getElementById('markDoneBtn');
    var progressTrack = document.getElementById('progressTrack');
    var progressFill = document.getElementById('progressFill');
    var breadcrumbTopic = document.getElementById('breadcrumbTopic');

    // ---- RENDER ----
    function renderList(filter) {
        filter = filter || '';
        var q = filter.toLowerCase().trim();
        var html = '';
        filteredIndices = [];
        for (var i = 0; i < topics.length; i++) {
            var t = topics[i];
            var match = t.toLowerCase().indexOf(q) !== -1;
            if (!match && q) continue;
            filteredIndices.push(i);
            var active = i === currentIndex ? 'active' : '';
            var data = getData(i);
            var isDone = doneSet.has(i);
            var badgeClass = data.category === 'core' ? 'core' : 'advanced';
            var badgeText = data.category === 'core' ? 'Core' : 'Adv';
            html += '<li class="' + active + '" data-index="' + i + '">';
            html += '<span class="num">' + (i+1) + '</span>';
            html += '<span>' + t + '</span>';
            html += '<span class="badge ' + badgeClass + '">' + badgeText + '</span>';
            if (isDone) html += '<span class="badge done">✓</span>';
            html += '</li>';
        }
        listEl.innerHTML = html || '<li class="empty-state"><i class="fas fa-search"></i><br>No topics found</li>';
        var items = listEl.querySelectorAll('li[data-index]');
        for (var j = 0; j < items.length; j++) {
            (function(li) {
                li.addEventListener('click', function() {
                    var idx = parseInt(this.dataset.index);
                    if (!isNaN(idx)) {
                        currentIndex = idx;
                        showCheatSheet = false;
                        cheatSheetToggle.innerHTML = '<i class="fas fa-list-check"></i> Cheat Sheet';
                        renderDetail(idx);
                        renderList(searchInput.value);
                        updateProgress();
                    }
                });
            })(items[j]);
        }
    }

    function renderDetail(idx) {
        var data = getData(idx);
        var title = topics[idx];
        var num = idx + 1;
        var isDone = doneSet.has(idx);
        var isCore = data.category === 'core';

        if (showCheatSheet) {
            detailEl.innerHTML = '<h1><i class="fas fa-list-check"></i> JS Quick Cheat Sheet</h1>' +
                '<div class="sub">📌 All 50 topics · Quick revision</div>' +
                '<div class="box purple">' +
                '<i class="fas fa-rocket"></i> <strong>JavaScript Cheat Sheet</strong>' +
                '<ul style="margin-top:8px;list-style:none;padding-left:0;">' +
                '<li><strong>🏗 Scope & Closures:</strong> Lexical scope, closure = function + lexical environment</li>' +
                '<li><strong>🎯 this:</strong> Default, Implicit, Explicit (call/apply/bind), New</li>' +
                '<li><strong>🧬 Prototypes:</strong> Objects inherit via prototype chain</li>' +
                '<li><strong>🔄 Event Loop:</strong> Microtasks (Promises) before Macrotasks (setTimeout)</li>' +
                '<li><strong>⚡ Async:</strong> Promises, Async/Await, Callbacks</li>' +
                '<li><strong>📦 ES6+:</strong> Classes, Arrow functions, Destructuring, Spread/Rest</li>' +
                '<li><strong>🧹 Memory:</strong> GC, WeakRefs, avoid leaks (globals, closures, listeners)</li>' +
                '<li><strong>⚙️ Optimization:</strong> Memoization, Debouncing, Throttling, Code splitting</li>' +
                '<li><strong>🔗 FP:</strong> Pure functions, Immutability, Composition</li>' +
                '<li><strong>🧪 Testing:</strong> Jest (unit), Cypress (E2E)</li>' +
                '</ul></div>' +
                '<div class="box success">💡 <strong>Pro Tip:</strong> Master closures, this, prototypes, event loop, and async patterns. These 5 concepts cover 80% of interview questions.</div>' +
                '<p style="margin-top:12px; opacity:0.6;"><i class="fas fa-arrow-right"></i> Click any topic for detailed notes</p>';
            return;
        }

        var advHtml = (data.adv || 'No specific advantages listed.').split('\n').filter(function(a) { return a.trim(); }).map(function(a) { return '<li>' + a + '</li>'; }).join('');
        var disHtml = (data.dis || 'No specific disadvantages listed.').split('\n').filter(function(d) { return d.trim(); }).map(function(d) { return '<li>' + d + '</li>'; }).join('');
        var useHtml = (data.use || 'General JavaScript development.').split('\n').filter(function(u) { return u.trim(); }).map(function(u) { return '<li>' + u + '</li>'; }).join('');
        var interviewHtml = (data.interview || 'Practice explaining this concept clearly.').replace(/\n/g, '<br>');
        var cheatHtml = (data.cheat || 'Review the key points above.').replace(/\n/g, '<br>');
        var keypointsHtml = (data.keypoints || []).map(function(k) { return '<span>' + k + '</span>'; }).join('');

        var relatedHtml = '';
        if (data.related) {
            relatedHtml = '<div class="section"><i class="fas fa-link"></i> Related Topics</div><div class="related-topics">';
            for (var r = 0; r < data.related.length; r++) {
                var relIdx = data.related[r];
                relatedHtml += '<span data-index="' + relIdx + '">' + (relIdx+1) + '. ' + topics[relIdx] + '</span>';
            }
            relatedHtml += '</div>';
        }

        var doneBadge = isDone ? ' <span style="font-size:0.8rem;color:#22c55e;">✅ Done</span>' : '';
        var iconClass = isCore ? 'fa-star' : 'fa-rocket';

        detailEl.innerHTML =
            '<h1><i class="fas ' + iconClass + '"></i> Topic ' + num + ': ' + title + doneBadge + '</h1>' +
            '<div class="sub">📌 ' + (isCore ? 'Core JS' : 'Advanced JS') + ' · ' + num + '/50<span class="tag">' + (isCore ? '⭐ Core' : '🚀 Advanced') + '</span></div>' +
            '<div class="section"><i class="fas fa-question-circle"></i> Concept</div><p>' + (data.desc || 'Detailed explanation coming soon.') + '</p>' +
            '<div class="section"><i class="fas fa-globe"></i> Example</div><p>' + (data.example || 'Practical example coming soon.') + '</p>' +
            '<div class="section"><i class="fas fa-project-diagram"></i> Visual Diagram</div><div class="code-box">' + (data.diagram || 'Diagram coming soon.') + '</div>' +
            (data.keypoints ? '<div class="keypoints">' + keypointsHtml + '</div>' : '') +
            '<div class="section"><i class="fas fa-check-circle"></i> Advantages</div><ul>' + advHtml + '</ul>' +
            '<div class="section"><i class="fas fa-times-circle"></i> Disadvantages</div><ul>' + disHtml + '</ul>' +
            '<div class="section"><i class="fas fa-rocket"></i> Use Cases</div><ul>' + useHtml + '</ul>' +
            '<div class="box success"><i class="fas fa-comments"></i> <strong>Interview Q&A</strong><br>' + interviewHtml + '</div>' +
            '<div class="box pink"><i class="fas fa-list-check"></i> <strong>Cheat Sheet</strong><br>' + cheatHtml + '</div>' +
            relatedHtml +
            '<div class="box tip">💡 <strong>Pro Tip:</strong> Practice writing code examples for each concept. Theory + Practice = Mastery.</div>' +
            '<div class="box mistake">⚠️ <strong>Common Mistake:</strong> Not understanding the event loop can lead to unexpected async behavior.</div>' +
            '<div class="box success">📝 <strong>One-Liner:</strong> ' + title + ' — ' + (data.desc || '').substring(0, 80) + '...</div>' +
            '<p style="margin-top:12px; opacity:0.6;"><i class="fas fa-arrow-right"></i> Navigate via sidebar · ' + (50 - num) + ' topics remaining</p>';

        var relatedSpans = detailEl.querySelectorAll('.related-topics span');
        for (var s = 0; s < relatedSpans.length; s++) {
            (function(span) {
                span.addEventListener('click', function() {
                    var idx = parseInt(this.dataset.index);
                    if (!isNaN(idx)) {
                        currentIndex = idx;
                        showCheatSheet = false;
                        cheatSheetToggle.innerHTML = '<i class="fas fa-list-check"></i> Cheat Sheet';
                        renderDetail(idx);
                        renderList(searchInput.value);
                        updateProgress();
                    }
                });
            })(relatedSpans[s]);
        }

        breadcrumbTopic.textContent = title;
        detailEl.scrollIntoView({ block: 'start', behavior: 'smooth' });
    }

    function updateProgress() {
        var count = doneSet.size;
        var pct = (count / 50 * 100);
        progressTrack.innerHTML = '📌 ' + count + ' / 50 mastered<div class="bar"><div class="fill" style="width:' + pct + '%"></div></div>';
        progressFill.style.width = pct + '%';
        document.getElementById('statDone').textContent = '✅ ' + count + ' Done';

        var coreCount = 0, advCount = 0;
        doneSet.forEach(function(i) {
            var data = getData(i);
            if (data.category === 'core') coreCount++;
            else advCount++;
        });
        document.getElementById('statCore').textContent = '⭐ ' + coreCount + ' Core';
        document.getElementById('statAdv').textContent = '🚀 ' + advCount + ' Advanced';
        renderList(searchInput.value);
    }

    // ---- EVENTS ----
    searchInput.addEventListener('input', function(e) { renderList(e.target.value); });

    themeToggle.addEventListener('click', function() {
        document.body.classList.toggle('dark');
        this.innerHTML = document.body.classList.contains('dark') ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
    });

    cheatSheetToggle.addEventListener('click', function() {
        showCheatSheet = !showCheatSheet;
        this.innerHTML = showCheatSheet ? '<i class="fas fa-book"></i> Back to Notes' : '<i class="fas fa-list-check"></i> Cheat Sheet';
        renderDetail(currentIndex);
    });

    markDoneBtn.addEventListener('click', function() {
        if (doneSet.has(currentIndex)) {
            doneSet.delete(currentIndex);
        } else {
            doneSet.add(currentIndex);
        }
        updateProgress();
        renderDetail(currentIndex);
        renderList(searchInput.value);
    });

    document.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
            var idx = filteredIndices.indexOf(currentIndex);
            if (idx < filteredIndices.length - 1) {
                currentIndex = filteredIndices[idx + 1];
                renderDetail(currentIndex);
                renderList(searchInput.value);
                e.preventDefault();
            }
        } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
            var idx = filteredIndices.indexOf(currentIndex);
            if (idx > 0) {
                currentIndex = filteredIndices[idx - 1];
                renderDetail(currentIndex);
                renderList(searchInput.value);
                e.preventDefault();
            }
        } else if (e.key === 'd' || e.key === 'D') {
            markDoneBtn.click();
        } else if (e.key === 'c' || e.key === 'C') {
            cheatSheetToggle.click();
        }
    });

    // ---- INIT ----
    renderList('');
    renderDetail(0);
    doneSet.add(0);
    updateProgress();

    console.log('🚀 JavaScript Mastery loaded!');
    console.log('⌨️ Keyboard shortcuts: ← → navigate, d = mark done, c = cheat sheet');
</script>
</body>
