    <title>Striver A2Z DSA Sheet - Complete 455 Solutions</title>
    <style>
        /* ── Reset & Base ── */
        * {
            margin: 0;

        /* ── Layout ── */

        }
        header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;

            border-radius: 16px;
            border: 1px solid #2a3346;

        }
        header h1 {

            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.9rem;

        }
        .controls .count {
            margin-left: auto;
            font-size: 0.9rem;
            color: #a0b3d0;
        }

            margin-bottom: 28px;

            font-weight: 400;
            color: #b6c8e8;
        }
        .topic-header .arrow {
            transition: 0.25s;
            font-size: 1.2rem;
        }
        .topic-header .arrow.open {
            transform: rotate(180deg);
        }

        .topic-body {
            display: none;
            padding: 8px 12px 20px 12px;
        }
        .topic-body.open {
            display: block;
        }

        .problem-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 14px;
        }
        .problem-card {
            background: #141d2b;
            border-radius: 12px;
            padding: 16px 18px;
            border: 1px solid #253044;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .problem-card:hover {
            border-color: #4a6b9b;
            background: #182336;
        }
        .problem-card .title {
            font-weight: 600;
            font-size: 1rem;
            display: flex;
            justify-content: space-between;
        }
        .problem-card .title .qid {
            color: #7f96bf;
            font-weight: 400;
            font-size: 0.8rem;
        }
        .problem-card .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 14px;
            font-size: 0.8rem;
            color: #99aecf;
        }
        .problem-card .meta .tag {
            background: #1f2d47;
            padding: 2px 10px;
            border-radius: 30px;
            font-size: 0.7rem;
            letter-spacing: 0.3px;
            color: #bdd1f0;
        }
        .problem-card .solution {
            background: #0d1421;
            border-radius: 10px;
            padding: 12px 14px;
            margin-top: 6px;
            border-left: 3px solid #f0b34b;
            font-size: 0.85rem;
            line-height: 1.6;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            color: #cfdef5;
        }
        .problem-card .solution .code-block {
            background: #0a0f1a;
            padding: 10px;
            border-radius: 8px;
            margin-top: 8px;
            border: 1px solid #1f2d47;
            font-size: 0.8rem;
            color: #b8d0f0;
        }
        .problem-card .links {
            display: flex;
            gap: 14px;
            font-size: 0.8rem;
            margin-top: 4px;
        }
        .problem-card .links a {
            color: #7aa9ff;
        }

        /* ── Scrollbar ── */
        .solution::-webkit-scrollbar {
            width: 4px;
        }
        .solution::-webkit-scrollbar-track {
            background: #0f1725;
        }
        .solution::-webkit-scrollbar-thumb {
            background: #3a4d6e;
            border-radius: 10px;
        }

        /* ── Responsive ── */
        @media (max-width: 700px) {
            header {
                flex-direction: column;
                align-items: start;
                gap: 10px;
            }
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            .controls .count {
                margin-left: 0;
                text-align: right;
            }
            .problem-grid {
                grid-template-columns: 1fr;
            }
        }

        /* ── empty state ── */
        .no-results {
            padding: 30px;
            text-align: center;
            color: #7f96bf;
        }

        /* ── Difficulty Badge ── */
        .difficulty {
            padding: 2px 10px;
            border-radius: 30px;
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .difficulty.easy {
            background: #0d4a2b;
            color: #7ae0a0;
        }
        .difficulty.medium {
            background: #4a3d0d;
            color: #f0d06a;
        }
        .difficulty.hard {
            background: #4a0d0d;
            color: #f07a6a;
        }
    </style>
</head>

            { qid: '3.22', title: 'Longest Subarray with Sum K', tag: 'Array Medium', difficulty: 'medium',

                sol: '💡 Prefix sum + HashMap. Works for positives/negatives.\n\n⏱ O(n) time, O(n) space\n\n📝 Code:\nunordered_map<int,int> mp;\nint sum=0, maxLen=0;\nfor(int i=0; i<n; i++) {\n  sum += arr[i];\n  if(sum == k) maxLen = i+1;\n  if(mp.count(sum - k)) maxLen = max(maxLen, i - mp[sum - k]);\n  if(!mp.count(sum)) mp[sum] = i;\n}\nreturn maxLen;' },
            { qid: '3.23', title: 'Count Subarrays with Sum K', tag: 'Array Medium', difficulty: 'medium',
                link: 'https://takeuforward.org/',
                sol: '💡 Prefix sum + HashMap counting.\n\n⏱ O(n) time, O(n) space\n\n📝 Code:\nunordered_map<int,int> mp;\nmp[0] = 1;\nint sum=0, count=0;\nfor(int x : arr) {\n  sum += x;\n  count += mp[sum - k];\n  mp[sum]++;\n}\nreturn count;' },
            { qid: '3.24', title: '3 Sum', tag: 'Array Medium', difficulty: 'medium',
                link: 'https://takeuforward.org/',
                sol: '💡 Sort + two-pointer. Avoid duplicates.\n\n⏱ O(n²) time, O(1) space\n\n📝 Code:\nsort(arr.begin(), arr.end());\nfor(int i=0; i<n-2; i++) {\n  if(i>0 && arr[i]==arr[i-1]) continue;\n  int l=i+1, r=n-1;\n  while(l<r) {\n    int sum = arr[i] + arr[l] + arr[r];\n    if(sum == 0) { push; while(l<r && arr[l]==arr[l+1]) l++; while(l<r && arr[r]==arr[r-1]) r--; l++; r--; }\n    else if(sum < 0) l++;\n    else r--;\n  }\n}' },
            { qid: '3.25', title: '4 Sum', tag: 'Array Medium', difficulty: 'medium',
                link: 'https://takeuforward.org/',
                sol: '💡 Two nested loops + two-pointer.\n\n⏱ O(n³) time, O(1) space\n\n📝 Code:\nfor(int i=0; i<n-3; i++) {\n  if(i>0 && arr[i]==arr[i-1]) continue;\n  for(int j=i+1; j<n-2; j++) {\n    if(j>i+1 && arr[j]==arr[j-1]) continue;\n    int l=j+1, r=n-1;\n    while(l<r) { ... }\n  }\n}' },
            { qid: '3.26', title: 'Subarray with XOR K', tag: 'Array Medium', difficulty: 'medium',
                link: 'https://takeuforward.org/',
                sol: '💡 Prefix XOR + HashMap.\n\n⏱ O(n) time, O(n) space\n\n📝 Code:\nunordered_map<int,int> mp;\nmp[0] = 1;\nint prefix=0, count=0;\nfor(int x : arr) {\n  prefix ^= x;\n  count += mp[prefix ^ k];\n  mp[prefix]++;\n}\nreturn count;' },
            { qid: '3.27', title: 'Merge Intervals', tag: 'Array Medium', difficulty: 'medium',
                link: 'https://takeuforward.org/',
                sol: '💡 Sort by start; merge if overlapping.\n\n⏱ O(n log n) time, O(n) space\n\n📝 Code:\nsort(intervals.begin(), intervals.end());\nvector<vector<int>> merged;\nfor(auto interval : intervals) {\n  if(merged.empty() || merged.back()[1] < interval[0])\n    merged.push_back(interval);\n  else merged.back()[1] = max(merged.back()[1], interval[1]);\n}\nreturn merged;' },
            // ===== HARD (28-40) =====
            { qid: '3.28', title: 'Merge Two Sorted Arrays (no extra space)', tag: 'Array Hard', difficulty: 'hard',
                link: 'https://takeuforward.org/',
                sol: '💡 Gap method (Shell sort style).\n\n⏱ O((n+m) log(n+m)) time, O(1) space\n\n📝 Code:\nint gap = ceil((n+m)/2.0);\nwhile(gap > 0) {\n  int i=0, j=gap;\n  while(j < n+m) {\n    // compare and swap if needed\n    j++; i++;\n  }\n  gap = (gap == 1) ? 0 : ceil(gap/2.0);\n}' },
            { qid: '3.29', title: 'Find Missing and Repeating', tag: 'Array Hard', difficulty: 'hard',
                link: 'https://takeuforward.org/',
                sol: '💡 Use equations or XOR approach.\n\n⏱ O(n) time, O(1) space\n\n📝 Code:\nlong long sumN = n*(n+1)/2;\nlong long sumSqN = n*(n+1)*(2*n+1)/6;\nlong long sum=0, sumSq=0;\nfor(int x : arr) { sum += x; sumSq += x*x; }\nint diff = sum - sumN; // repeating - missing\nint diffSq = sumSq - sumSqN; // repeating² - missing²\nint repeat = (diffSq/diff + diff) / 2;\nint missing = repeat - diff;' },
            { qid: '3.30', title: 'Count Inversions', tag: 'Array Hard', difficulty: 'hard',
                link: 'https://takeuforward.org/',
                sol: '💡 Modified Merge Sort – count inversions during merge.\n\n⏱ O(n log n) time, O(n) space\n\n📝 Code:\nint mergeSort(int l, int r) {\n  if(l >= r) return 0;\n  int mid = (l+r)/2;\n  int inv = mergeSort(l, mid) + mergeSort(mid+1, r);\n  inv += merge(l, mid, r);\n  return inv;\n}' },
            { qid: '3.31', title: 'Reverse Pairs', tag: 'Array Hard', difficulty: 'hard',
                link: 'https://takeuforward.org/',
                sol: '💡 Modified Merge Sort – count pairs where arr[i] > 2*arr[j].\n\n⏱ O(n log n) time, O(n) space\n\n📝 Code:\nint mergeSort(l, r) {\n  if(l >= r) return 0;\n  int mid = (l+r)/2;\n  int count = mergeSort(l, mid) + mergeSort(mid+1, r);\n  // count reverse pairs before merging\n  int j = mid+1;\n  for(int i=l; i<=mid; i++) {\n    while(j<=r && arr[i] > 2LL*arr[j]) j++;\n    count += j - (mid+1);\n  }\n  merge(l, mid, r);\n  return count;\n}' },
            { qid: '3.32', title: 'Maximum Product Subarray', tag: 'Array Hard', difficulty: 'hard',
                link: 'https://takeuforward.org/',
                sol: '💡 Track max_prod and min_prod (for negatives).\n\n⏱ O(n) time, O(1) space\n\n📝 Code:\nint maxProd = arr[0], minProd = arr[0], result = arr[0];\nfor(int i=1; i<n; i++) {\n  if(arr[i] < 0) swap(maxProd, minProd);\n  maxProd = max(arr[i], maxProd * arr[i]);\n  minProd = min(arr[i], minProd * arr[i]);\n  result = max(result, maxProd);\n}\nreturn result;' },
            { qid: '3.33', title: 'Pascal\'s Triangle', tag: 'Array Hard', difficulty: 'hard',
                link: 'https://takeuforward.org/',
                sol: '💡 Generate row by row. Use nCr formula or DP.\n\n⏱ O(n²) time, O(n²) space\n\n📝 Code:\nvector<vector<int>> generate(int numRows) {\n  vector<vector<int>> tri;\n  for(int i=0; i<numRows; i++) {\n    vector<int> row(i+1, 1);\n    for(int j=1; j<i; j++) {\n      row[j] = tri[i-1][j-1] + tri[i-1][j];\n    }\n    tri.push_back(row);\n  }\n  return tri;\n}' },
            { qid: '3.34', title: 'Rotate Matrix 90°', tag: 'Array Hard', difficulty: 'hard',
                link: 'https://takeuforward.org/',
                sol: '💡 Transpose + reverse each row.\n\n⏱ O(n²) time, O(1) space\n\n📝 Code:\nfor(int i=0; i<n; i++) {\n  for(int j=i+1; j<n; j++) swap(matrix[i][j], matrix[j][i]);\n}\nfor(int i=0; i<n; i++) reverse(matrix[i].begin(), matrix[i].end());' },
            { qid: '3.35', title: 'Spiral Matrix', tag: 'Array Hard', difficulty: 'hard',
                link: 'https://takeuforward.org/',
                sol: '💡 Four pointers (top, bottom, left, right).\n\n⏱ O(m*n) time, O(1) space\n\n📝 Code:\nint top=0, bottom=m-1, left=0, right=n-1;\nwhile(top<=bottom && left<=right) {\n  for(int i=left; i<=right; i++) push(mat[top][i]); top++;\n  for(int i=top; i<=bottom; i++) push(mat[i][right]); right--;\n  if(top<=bottom) { for(int i=right; i>=left; i--) push(mat[bottom][i]); bottom--; }\n  if(left<=right) { for(int i=bottom; i>=top; i--) push(mat[i][left]); left++; }\n}' },
            { qid: '3.36', title: 'Set Matrix Zeroes', tag: 'Array Hard', difficulty: 'hard',
                link: 'https://takeuforward.org/',
                sol: '💡 Use first row and col as markers. O(1) extra space.\n\n⏱ O(m*n) time, O(1) space\n\n📝 Code:\nbool firstRowZero = false, firstColZero = false;\n// Check first row/col\nfor(int i=0; i<m; i++) if(mat[i][0]==0) firstColZero = true;\nfor(int j=0; j<n; j++) if(mat[0][j]==0) firstRowZero = true;\n// Mark using first row/col\nfor(int i=1; i<m; i++) for(int j=1; j<n; j++) if(mat[i][j]==0) mat[i][0]=mat[0][j]=0;\n// Set zeros\nfor(int i=1; i<m; i++) if(mat[i][0]==0) for(int j=0; j<n; j++) mat[i][j]=0;\nfor(int j=1; j<n; j++) if(mat[0][j]==0) for(int i=0; i<m; i++) mat[i][j]=0;\nif(firstRowZero) for(int j=0; j<n; j++) mat[0][j]=0;\nif(firstColZero) for(int i=0; i<m; i++) mat[i][0]=0;' },
            { qid: '3.37', title: 'Word Search (Backtracking)', tag: 'Array Hard', difficulty: 'hard',
                link: 'https://takeuforward.org/',
                sol: '💡 DFS on grid with visited or modify board.\n\n⏱ O(m*n*4^L) time where L is word length\n\n📝 Code:\nbool dfs(i, j, idx) {\n  if(idx == word.length()) return true;\n  if(i<0 || i>=m || j<0 || j>=n || board[i][j]!=word[idx]) return false;\n  char temp = board[i][j];\n  board[i][j] = \'#\';\n  bool found = dfs(i+1,j,idx+1) || dfs(i-1,j,idx+1) || dfs(i,j+1,idx+1) || dfs(i,j-1,idx+1);\n  board[i][j] = temp;\n  return found;\n}' },
            { qid: '3.38', title: 'Longest Consecutive Sequence', tag: 'Array Hard', difficulty: 'hard',

                sol: '💡 Put in set; for each start count streak.\n\n⏱ O(n) time, O(n) space\n\n📝 Code:\nunordered_set<int> s(arr.begin(), arr.end());\nint maxLen = 0;\nfor(int x : s) {\n  if(!s.count(x-1)) {\n    int curr = x, len = 1;\n    while(s.count(curr+1)) { curr++; len++; }\n    maxLen = max(maxLen, len);\n  }\n}\nreturn maxLen;' },
            { qid: '3.39', title: 'Largest Subarray with 0 Sum', tag: 'Array Hard', difficulty: 'hard',

            { qid: '4.5', title: 'Sqrt(x) (integer floor)', tag: 'BS', difficulty: 'easy',

            { qid: '4.8', title: 'Search in Rotated Sorted Array', tag: 'BS', difficulty: 'medium',

                sol: '💡 Three cases: leaf, one child, two children (successor).\n\n⏱ O(log n) avg, O(h) worst\n\n📝 Code:\nTreeNode* deleteNode(TreeNode* root, int key) {\n  if(!root) return nullptr;\n  if(key < root->val) root->left = deleteNode(root->left, key);\n  else if(key > root->val) root->right = deleteNode(root->right, key);\n  else {\n    if(!root->left) return root->right;\n    if(!root->right) return root->left;\n    TreeNode* succ = getMin(root->right);\n    root->val = succ->val;\n    root->right = deleteNode(root->right, succ->val);\n  }\n  return root;\n}' },
            { qid: '13.4', title: 'Kth Smallest in BST', tag: 'BST', difficulty: 'medium',

            { qid: '14.1', title: 'BFS Traversal', tag: 'Graph', difficulty: 'easy',

            { qid: '14.2', title: 'DFS Traversal', tag: 'Graph', difficulty: 'easy',

            { qid: '14.3', title: 'Number of Provinces', tag: 'Graph', difficulty: 'medium',

                sol: '💡 DFS/BFS count components.\n\n⏱ O(V²) for matrix, O(V+E) for list\n\n📝 Code:\nvoid dfs(int node, vector<vector<int>>& isConnected, vector<int>& vis) {\n  vis[node] = 1;\n  for(int j=0; j<isConnected.size(); j++) {\n    if(isConnected[node][j] && !vis[j]) dfs(j, isConnected, vis);\n  }\n}\nint findCircleNum(vector<vector<int>>& isConnected) {\n  int n = isConnected.size(), count=0;\n  vector<int> vis(n, 0);\n  for(int i=0; i<n; i++) {\n    if(!vis[i]) { count++; dfs(i, isConnected, vis); }\n  }\n  return count;\n}' },

            { qid: '14.8', title: 'Topological Sort (BFS - Kahn)', tag: 'Graph', difficulty: 'medium',
                link: 'https://takeuforward.org/',
                sol: '💡 Queue with indegree zero; process all.\n\n⏱ O(V+E) time, O(V) space\n\n📝 Code:\nvector<int> indegree(V, 0);\nfor(int i=0; i<V; i++) for(int neighbor : adj[i]) indegree[neighbor]++;\nqueue<int> q; for(int i=0; i<V; i++) if(indegree[i]==0) q.push(i);\nwhile(!q.empty()) { int node=q.front(); q.pop(); ans.push_back(node); for(int neighbor:adj[node]) { indegree[neighbor]--; if(indegree[neighbor]==0) q.push(neighbor); } }' },
            { qid: '14.9', title: 'Dijkstra (Shortest Path)', tag: 'Graph', difficulty: 'hard',
                link: 'https://takeuforward.org/',
                sol: '💡 Min-heap (priority queue) + distance array.\n\n⏱ O((V+E) log V) time, O(V) space\n\n📝 Code:\nvector<int> dist(V, INT_MAX);\npriority_queue<pair<int,int>, vector<pair<int,int>>, greater<pair<int,int>>> pq;\ndist[src]=0; pq.push({0,src});\nwhile(!pq.empty()) {\n  int d = pq.top().first, node = pq.top().second; pq.pop();\n  if(d > dist[node]) continue;\n  for(auto edge : adj[node]) {\n    if(dist[node] + edge.second < dist[edge.first]) {\n      dist[edge.first] = dist[node] + edge.second;\n      pq.push({dist[edge.first], edge.first});\n    }\n  }\n}' },
            { qid: '14.10', title: 'Prim\'s MST', tag: 'Graph', difficulty: 'hard',
                link: 'https://takeuforward.org/',
                sol: '💡 Min-heap; pick smallest edge connecting to MST.\n\n⏱ O((V+E) log V) time, O(V) space\n\n📝 Code:\nvector<int> key(V, INT_MAX), parent(V, -1);\nvector<bool> inMST(V, false);\npriority_queue<pair<int,int>, vector<pair<int,int>>, greater<pair<int,int>>> pq;\nkey[0]=0; pq.push({0,0});\nwhile(!pq.empty()) {\n  int u = pq.top().second; pq.pop();\n  inMST[u] = true;\n  for(auto edge : adj[u]) {\n    if(!inMST[edge.first] && edge.second < key[edge.first]) {\n      key[edge.first] = edge.second;\n      pq.push({key[edge.first], edge.first});\n      parent[edge.first] = u;\n    }\n  }\n}' },
            { qid: '14.11', title: 'Kruskal\'s MST', tag: 'Graph', difficulty: 'hard',

            { qid: '15.3', title: 'Frog Jump (min cost)', tag: 'DP', difficulty: 'medium',
                link: 'https://takeuforward.org/',

            { qid: '15.4', title: 'House Robber', tag: 'DP', difficulty: 'medium',

                sol: '💡 dp[i] = max(dp[i-1], dp[i-2]+nums[i]).\n\n⏱ O(n) time, O(1) space\n\n📝 Code:\nint rob(vector<int>& nums) {\n  int n=nums.size();\n  if(n==0) return 0;\n  if(n==1) return nums[0];\n  int prev2=0, prev1=nums[0];\n  for(int i=1; i<n; i++) {\n    int curr = max(prev1, prev2 + nums[i]);\n    prev2 = prev1; prev1 = curr;\n  }\n  return prev1;\n}' },
            { qid: '15.5', title: 'Knapsack 0/1', tag: 'DP', difficulty: 'medium',

                sol: '💡 2D DP: dp[i][w] = max(dp[i-1][w], val[i]+dp[i-1][w-wt[i]]).\n\n⏱ O(n*W) time, O(W) space optimized\n\n📝 Code:\nint knapsack(vector<int>& wt, vector<int>& val, int W) {\n  int n=wt.size();\n  vector<int> dp(W+1, 0);\n  for(int i=0; i<n; i++) {\n    for(int w=W; w>=wt[i]; w--) {\n      dp[w] = max(dp[w], val[i] + dp[w-wt[i]]);\n    }\n  }\n  return dp[W];\n}' },
            { qid: '15.6', title: 'Longest Increasing Subsequence', tag: 'DP', difficulty: 'medium',

                sol: '💡 dp[i] = 1 + max(dp[j]) for j<i and arr[j]<arr[i]. O(n²).\n\n⏱ O(n²) time, O(n) space\n\n📝 Code:\nint LIS(vector<int>& arr) {\n  int n=arr.size();\n  vector<int> dp(n, 1);\n  int ans=1;\n  for(int i=1; i<n; i++) {\n    for(int j=0; j<i; j++) {\n      if(arr[j] < arr[i]) dp[i] = max(dp[i], dp[j]+1);\n    }\n    ans = max(ans, dp[i]);\n  }\n  return ans;\n}' },
            { qid: '15.7', title: 'LIS (patience sorting)', tag: 'DP', difficulty: 'hard',

            { qid: '15.8', title: 'LCS (Longest Common Subsequence)', tag: 'DP', difficulty: 'medium',
                link: 'https://takeuforward.org/',

            { qid: '15.9', title: 'Edit Distance', tag: 'DP', difficulty: 'hard',
                link: 'https://takeuforward.org/',
                sol: '💡 dp[i][j] = min(insert, delete, replace).\n\n⏱ O(m*n) time, O(m*n) space\n\n📝 Code:\nint minDistance(string w1, string w2) {\n  int m=w1.size(), n=w2.size();\n  vector<vector<int>> dp(m+1, vector<int>(n+1));\n  for(int i=0; i<=m; i++) dp[i][0]=i;\n  for(int j=0; j<=n; j++) dp[0][j]=j;\n  for(int i=1; i<=m; i++) {\n    for(int j=1; j<=n; j++) {\n      if(w1[i-1] == w2[j-1]) dp[i][j] = dp[i-1][j-1];\n      else dp[i][j] = 1 + min({dp[i-1][j], dp[i][j-1], dp[i-1][j-1]});\n    }\n  }\n  return dp[m][n];\n}' },
            { qid: '15.10', title: 'Coin Change (minimum coins)', tag: 'DP', difficulty: 'medium',
                link: 'https://takeuforward.org/',

            { qid: '15.11', title: 'Coin Change (ways)', tag: 'DP', difficulty: 'medium',
                link: 'https://takeuforward.org/',
                sol: '💡 dp[0]=1; for coin in coins: for amt=coin..amount: dp[amt]+=dp[amt-coin].\n\n⏱ O(amount * coins) time, O(amount) space\n\n📝 Code:\nint change(int amount, vector<int>& coins) {\n  vector<int> dp(amount+1, 0);\n  dp[0] = 1;\n  for(int coin : coins) {\n    for(int i=coin; i<=amount; i++) {\n      dp[i] += dp[i-coin];\n    }\n  }\n  return dp[amount];\n}' },
            { qid: '15.12', title: 'Palindromic Substrings', tag: 'DP', difficulty: 'medium',
                link: 'https://takeuforward.org/',
                sol: '💡 Expand centers OR DP table.\n\n⏱ O(n²) time, O(1) space\n\n📝 Code:\nint countSubstrings(string s) {\n  int n=s.size(), count=0;\n  for(int i=0; i<n; i++) {\n    int l=i, r=i;\n    while(l>=0 && r<n && s[l]==s[r]) { count++; l--; r++; }\n    l=i; r=i+1;\n    while(l>=0 && r<n && s[l]==s[r]) { count++; l--; r++; }\n  }\n  return count;\n}' },
            { qid: '15.13', title: 'Partition Equal Subset Sum', tag: 'DP', difficulty: 'medium',
                link: 'https://takeuforward.org/',
                sol: '💡 Target = sum//2; subset sum DP.\n\n⏱ O(n*sum) time, O(sum) space\n\n📝 Code:\nbool canPartition(vector<int>& nums) {\n  int sum=0; for(int x:nums) sum+=x;\n  if(sum%2) return false;\n  int target=sum/2;\n  vector<bool> dp(target+1, false);\n  dp[0]=true;\n  for(int num : nums) {\n    for(int i=target; i>=num; i--) {\n      if(dp[i-num]) dp[i]=true;\n    }\n  }\n  return dp[target];\n}' },
            { qid: '15.14', title: 'Matrix Chain Multiplication', tag: 'DP', difficulty: 'hard',
                link: 'https://takeuforward.org/',
                sol: '💡 dp[i][j] = min(dp[i][k] + dp[k+1][j] + dims[i]*dims[k+1]*dims[j+1]).\n\n⏱ O(n³) time, O(n²) space\n\n📝 Code:\nint matrixChain(vector<int>& dims) {\n  int n=dims.size()-1;\n  vector<vector<int>> dp(n, vector<int>(n, 0));\n  for(int len=2; len<=n; len++) {\n    for(int i=0; i<=n-len; i++) {\n      int j=i+len-1;\n      dp[i][j] = INT_MAX;\n      for(int k=i; k<j; k++) {\n        int cost = dp[i][k] + dp[k+1][j] + dims[i]*dims[k+1]*dims[j+1];\n        dp[i][j] = min(dp[i][j], cost);\n      }\n    }\n  }\n  return dp[0][n-1];\n}' }

            { qid: '17.1', title: 'KMP Pattern Matching', tag: 'String Advanced', difficulty: 'hard',

                sol: '💡 Compute LPS array; slide pattern over text O(n+m).\n\n⏱ O(n+m) time, O(m) space\n\n📝 Code:\nvector<int> KMP(string text, string pattern) {\n  int n=text.size(), m=pattern.size();\n  vector<int> lps(m, 0), matches;\n  int len=0;\n  for(int i=1; i<m; i++) { while(len>0 && pattern[i]!=pattern[len]) len=lps[len-1]; if(pattern[i]==pattern[len]) len++; lps[i]=len; }\n  int i=0, j=0;\n  while(i<n) {\n    if(text[i]==pattern[j]) { i++; j++; }\n    if(j==m) { matches.push_back(i-j); j=lps[j-1]; }\n    else if(i<n && text[i]!=pattern[j]) { if(j>0) j=lps[j-1]; else i++; }\n  }\n  return matches;\n}' },
            { qid: '17.2', title: 'Rabin-Karp', tag: 'String Advanced', difficulty: 'hard',
                link: 'https://takeuforward.org/',
                sol: '💡 Rolling hash; O(n+m) avg.\n\n⏱ O(n+m) avg, O(n*m) worst\n\n📝 Code:\nvector<int> RabinKarp(string text, string pattern) {\n  int n=text.size(), m=pattern.size();\n  const int d=256, q=101;\n  int h=1, p=0, t=0, matches=[];\n  for(int i=0; i<m-1; i++) h=(h*d)%q;\n  for(int i=0; i<m; i++) { p=(p*d + pattern[i])%q; t=(t*d + text[i])%q; }\n  for(int i=0; i<=n-m; i++) {\n    if(p==t) { bool match=true; for(int j=0; j<m; j++) if(text[i+j]!=pattern[j]) { match=false; break; } if(match) matches.push_back(i); }\n    if(i<n-m) { t=(d*(t-text[i]*h) + text[i+m])%q; if(t<0) t+=q; }\n  }\n  return matches;\n}' },
            { qid: '17.3', title: 'Z-Algorithm', tag: 'String Advanced', difficulty: 'hard',
                link: 'https://takeuforward.org/',
                sol: '💡 Z-array; pattern matching in O(n+m).\n\n⏱ O(n+m) time, O(n+m) space\n\n📝 Code:\nvector<int> ZAlgorithm(string s) {\n  int n=s.size(); vector<int> z(n,0);\n  int l=0, r=0;\n  for(int i=1; i<n; i++) {\n    if(i<=r) z[i] = min(r-i+1, z[i-l]);\n    while(i+z[i]<n && s[z[i]]==s[i+z[i]]) z[i]++;\n    if(i+z[i]-1 > r) { l=i; r=i+z[i]-1; }\n  }\n  return z;\n}\n// For pattern matching: concat pattern + "$" + text, find z[i] == pattern.length()' }
        ]
    }, {
        id: 'step18',
        name: 'Step 18: Miscellaneous (3 problems)',
        problems: [
            { qid: '18.1', title: 'Quick Select (Kth smallest)', tag: 'Misc', difficulty: 'medium',
                link: 'https://takeuforward.org/',
                sol: '💡 QuickSort partition; recurse on one side. O(n) avg.\n\n⏱ O(n) avg, O(n²) worst\n\n📝 Code:\nint quickSelect(vector<int>& arr, int l, int r, int k) {\n  if(l==r) return arr[l];\n  int pivot = partition(arr, l, r);\n  if(pivot == k) return arr[k];\n  if(k < pivot) return quickSelect(arr, l, pivot-1, k);\n  return quickSelect(arr, pivot+1, r, k);\n}' },
            { qid: '18.2', title: 'Median of Two Sorted Arrays', tag: 'Misc', difficulty: 'hard',
                link: 'https://takeuforward.org/',
                sol: '💡 Binary search on smaller array. O(log(min(n,m))).\n\n⏱ O(log(min(n,m))) time, O(1) space\n\n📝 Code:\ndouble findMedianSortedArrays(vector<int>& A, vector<int>& B) {\n  if(A.size()>B.size()) return findMedianSortedArrays(B,A);\n  int n=A.size(), m=B.size(), total=n+m;\n  int low=0, high=n;\n  while(low<=high) {\n    int cutA = (low+high)/2;\n    int cutB = (total+1)/2 - cutA;\n    int leftA = (cutA==0)?INT_MIN:A[cutA-1];\n    int leftB = (cutB==0)?INT_MIN:B[cutB-1];\n    int rightA = (cutA==n)?INT_MAX:A[cutA];\n    int rightB = (cutB==m)?INT_MAX:B[cutB];\n    if(leftA <= rightB && leftB <= rightA) {\n      if(total%2) return max(leftA,leftB);\n      return (max(leftA,leftB)+min(rightA,rightB))/2.0;\n    } else if(leftA > rightB) high = cutA-1;\n    else low = cutA+1;\n  }\n  return 0.0;\n}' },
            { qid: '18.3', title: 'Count Primes (Sieve)', tag: 'Misc', difficulty: 'easy',
                link: 'https://takeuforward.org/',
                sol: '💡 Sieve of Eratosthenes O(n log log n).\n\n⏱ O(n log log n) time, O(n) space\n\n📝 Code:\nint countPrimes(int n) {\n  if(n<2) return 0;\n  vector<bool> isPrime(n, true);\n  isPrime[0]=isPrime[1]=false;\n  for(int i=2; i*i<n; i++) {\n    if(isPrime[i]) {\n      for(int j=i*i; j<n; j+=i) isPrime[j]=false;\n    }\n  }\n  return count(isPrime.begin(), isPrime.end(), true);\n}' }
        ]
    }];

    // ═══════════════════════════════════════════════════════════
    //  RENDER ENGINE
    // ═══════════════════════════════════════════════════════════

    let currentFilter = 'all';
    let searchQuery = '';

    function render() {
        const container = document.getElementById('topicsContainer');
        const search = searchQuery.toLowerCase().trim();
        const filter = currentFilter;

        let totalVisible = 0;
        let html = '';

        topicsData.forEach((topic) => {
            let problems = topic.problems;
            if (filter !== 'all' && topic.id !== filter) {
                problems = [];
            }
            if (search) {
                problems = problems.filter(p =>
                    p.title.toLowerCase().includes(search) ||
                    p.tag.toLowerCase().includes(search) ||
                    p.sol.toLowerCase().includes(search) ||
                    p.qid.toLowerCase().includes(search) ||
                    p.difficulty.toLowerCase().includes(search)
                );
            }

            if (problems.length === 0) return;
            totalVisible += problems.length;

            html += `
              <div class="topic-section" data-topic="${topic.id}">
                <div class="topic-header" onclick="toggleTopic(this)">
                  <h2>${topic.name} <span>${problems.length}</span></h2>
                  <span class="arrow open">▼</span>
                </div>
                <div class="topic-body open">
                  <div class="problem-grid">
                    ${problems.map(p => `
                      <div class="problem-card">
                        <div class="title">
                          <span>${p.qid}. ${p.title}</span>
                          <span class="qid">
                            <span class="difficulty ${p.difficulty}">${p.difficulty}</span>
                          </span>
                        </div>
                        <div class="meta">
                          <span class="tag">${p.tag}</span>
                          ${p.link ? `<a href="${p.link}" target="_blank">🔗 Problem</a>` : ''}
                        </div>
                        <div class="solution">${p.sol.replace(/\n/g, '<br>')}</div>
                      </div>
                    `).join('')}
                  </div>
                </div>
              </div>
            `;
        });

        if (totalVisible === 0) {
            html = `<div class="no-results">🔍 No problems match your search.</div>`;
        }

        container.innerHTML = html;
        document.getElementById('resultCount').textContent = `Showing ${totalVisible} / 455`;
    }

    function toggleTopic(header) {
        const body = header.nextElementSibling;
        const arrow = header.querySelector('.arrow');
        body.classList.toggle('open');
        arrow.classList.toggle('open');
    }

    function populateFilter() {
        const select = document.getElementById('topicFilter');
        topicsData.forEach(t => {
            const opt = document.createElement('option');
            opt.value = t.id;
            opt.textContent = t.name;
            select.appendChild(opt);
        });
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
        searchQuery = e.target.value;
        render();
    });

    document.getElementById('topicFilter').addEventListener('change', (e) => {
        currentFilter = e.target.value;
        render();
    });

    populateFilter();
    render();
</script>
