<div class="note-section">

┌───────────────────────────┐
│  1. Timers (setTimeout)   │
├───────────────────────────┤
│  2. Pending Callbacks     │
├───────────────────────────┤
│  3. Idle/Prepare          │
├───────────────────────────┤
│  4. Poll (I/O)            │
├───────────────────────────┤
│  5. Check (setImmediate)  │
├───────────────────────────┤
│  6. Close Callbacks       │
└───────────────────────────┘</div>
</div>
<div class="note-section">
    <h3><i class="fas fa-microchip"></i> Microtasks vs Macrotasks</h3>

<span class="function">setTimeout</span>(() => {

<div class="note-section">
    <h3><i class="fas fa-project-diagram"></i> GraphQL with Apollo Server</h3>
    <p><strong>GraphQL</strong> is a query language for APIs that allows clients to request exactly the data they need.</p>
    <div class="code-block"><span class="lang-tag">JavaScript</span>
<span class="keyword">const</span> { ApolloServer, gql } = <span class="function">require</span>(<span class="string">'apollo-server-express'</span>);
<span class="keyword">const</span> express = <span class="function">require</span>(<span class="string">'express'</span>);

<span class="keyword">const</span> app = <span class="function">express</span>();

<span class="comment">// Type definitions (schema)</span>
<span class="keyword">const</span> typeDefs = <span class="function">gql</span>\`
    type User {
        id: ID!
        name: String!
        email: String!
        age: Int
        posts: [Post]
    }

    type Post {
        id: ID!
        title: String!
        content: String!
        author: User
    }

    type Query {
        users: [User]
        user(id: ID!): User
        posts: [Post]
        post(id: ID!): Post
    }

    type Mutation {
        createUser(name: String!, email: String!, age: Int): User
        createPost(title: String!, content: String!, authorId: ID!): Post
        updateUser(id: ID!, name: String, email: String): User
        deleteUser(id: ID!): Boolean
    }

    type Subscription {
        userCreated: User
    }
\`;

<span class="comment">// Resolvers</span>
<span class="keyword">const</span> resolvers = {
    <span class="variable">Query</span>: {
        <span class="function">users</span>: () => User.<span class="function">find</span>(),
        <span class="function">user</span>: (_, { id }) => User.<span class="function">findById</span>(id),
        <span class="function">posts</span>: () => Post.<span class="function">find</span>(),
        <span class="function">post</span>: (_, { id }) => Post.<span class="function">findById</span>(id)
    },
    <span class="variable">Mutation</span>: {
        <span class="function">createUser</span>: (_, { name, email, age }) => {
            <span class="keyword">return</span> User.<span class="function">create</span>({ name, email, age });
        },
        <span class="function">createPost</span>: (_, { title, content, authorId }) => {
            <span class="keyword">return</span> Post.<span class="function">create</span>({ title, content, author: authorId });
        },
        <span class="function">updateUser</span>: (_, { id, name, email }) => {
            <span class="keyword">return</span> User.<span class="function">findByIdAndUpdate</span>(id, { name, email }, { new: <span class="keyword">true</span> });
        },
        <span class="function">deleteUser</span>: <span class="keyword">async</span> (_, { id }) => {
            <span class="keyword">await</span> User.<span class="function">findByIdAndDelete</span>(id);
            <span class="keyword">return</span> <span class="keyword">true</span>;
        }
    },
    <span class="variable">User</span>: {
        <span class="function">posts</span>: (parent) => Post.<span class="function">find</span>({ <span class="variable">author</span>: parent.<span class="variable">id</span> })
    },
    <span class="variable">Post</span>: {
        <span class="function">author</span>: (parent) => User.<span class="function">findById</span>(parent.<span class="variable">author</span>)
    }
};

    };

    // RENDER ENGINE
    const topicNav = document.getElementById('topicNav');
    const topicTitle = document.getElementById('topicTitle');
    const topicBadge = document.getElementById('topicBadge');
    const notesContent = document.getElementById('notesContent');
    const progressFill = document.getElementById('progressFill');

    const topicNames = Object.keys(NOTES);
    let activeTopic = topicNames[0];

    function renderNav() {
        const label = topicNav.querySelector('.label');
        topicNav.innerHTML = '';
        topicNav.appendChild(label);
        topicNames.forEach(name => {
            const btn = document.createElement('button');
            btn.className = 'topic-btn' + (name === activeTopic ? ' active' : '');
            let displayName = name;
            if (name.length > 40) displayName = name.substring(0, 37) + '...';
            btn.textContent = displayName;
            btn.title = name;
            btn.dataset.topic = name;
            btn.addEventListener('click', () => {
                activeTopic = name;
                renderNav();
                renderContent(name);
            });
            topicNav.appendChild(btn);
        });
    }

    function renderContent(topicName) {
        const data = NOTES[topicName];
        if (!data) {
            notesContent.innerHTML = '<p>Topic not found.</p>';
            return;
        }
        topicTitle.textContent = topicName;
        topicBadge.textContent = 'Complete Notes';
        notesContent.innerHTML = data.content;

        const total = topicNames.length;
        const current = topicNames.indexOf(topicName) + 1;
        const progress = Math.round((current / total) * 100);
        progressFill.style.width = progress + '%';
        progressFill.title = progress + '% complete';
    }

    renderNav();
    renderContent(activeTopic);
</script>
