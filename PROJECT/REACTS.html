<!DOCTYPE html>
<html lang="en">

        .content {

            border-radius: 28px;

        .topic-header {
            display: flex;
            align-items: baseline;
            gap: 1rem;
            flex-wrap: wrap;
            border-bottom: 2px solid #e9edf4;
            padding-bottom: 0.75rem;
            margin-bottom: 2rem;
        }

        .topic-header h2 {
            font-size: 2rem;
            font-weight: 600;
            color: #0b1e33;
        }

        .topic-header .badge {
            background: #dbeafe;
            color: #1e4a7a;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
            margin-left: auto;
        }

        .note-section {
            margin-bottom: 2rem;
        }

        .note-section h3 {
            font-size: 1.3rem;
            font-weight: 600;
            color: #1e3a6f;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .note-section h3 i {
            color: #2563eb;
            font-size: 1rem;
            width: 1.5rem;
        }

        .note-section p, .note-section li {
            color: #334155;
            line-height: 1.7;
            font-size: 0.98rem;
        }

        .note-section ul, .note-section ol {
            padding-left: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .note-section li {
            margin-bottom: 0.3rem;
        }

        .code-block {
            background: #0b1e33;
            color: #e2e8f0;
            padding: 1.2rem 1.5rem;
            border-radius: 12px;
            margin: 0.8rem 0 1.2rem;
            font-family: 'Consolas', 'Monaco', monospace;

            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.6;
            position: relative;
        }

        .code-block .lang-tag {
            position: absolute;
            top: 0.5rem;
            right: 1rem;
            background: rgba(255,255,255,0.1);
            padding: 0.1rem 0.8rem;
            border-radius: 12px;
            font-size: 0.7rem;
            color: #94a3b8;
            font-family: 'Segoe UI', sans-serif;
        }

        .code-block .comment { color: #94a3b8; }
        .code-block .keyword { color: #f472b6; }
        .code-block .string { color: #34d399; }
        .code-block .function { color: #60a5fa; }
        .code-block .variable { color: #fbbf24; }
        .code-block .tag { color: #f87171; }

        .note-box {
            background: #f1f6fe;
            border-left: 4px solid #2563eb;
            padding: 1rem 1.5rem;

            margin: 0.8rem 0;
        }

        .note-box.warning {
            border-left-color: #f59e0b;
            background: #fffbeb;
        }

        .note-box.success {
            border-left-color: #10b981;
            background: #ecfdf5;
        }

        .note-box i {

        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        @media (max-width: 768px) {
            .container { padding: 1rem; }
            .header { padding: 1.5rem; }
            .header h1 { font-size: 1.8rem; flex-wrap: wrap; }
            .content { padding: 1.5rem; }
            .grid-2 { grid-template-columns: 1fr; }
            .topic-header h2 { font-size: 1.4rem; }
            .code-block { font-size: 0.8rem; padding: 1rem; }
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #e9edf4;
            border-radius: 4px;
            margin-top: 2rem;
        }

        .progress-bar .fill {
            height: 100%;

            border-radius: 4px;
            width: 100%;
            transition: width 0.3s;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="header">
        <h1>
            <i class="fab fa-react"></i>
            React.js Notes
        </h1>
        <p>Complete guide from scratch to master · 20+ topics · code examples · best practices</p>
        <div class="badge-group">
            <span><i class="fas fa-check-circle"></i> 20 Topics</span>
            <span><i class="fas fa-code"></i> 100+ Examples</span>
            <span><i class="fas fa-graduation-cap"></i> Beginner to Advanced</span>
        </div>
    </div>

    <div class="topic-nav" id="topicNav">
        <span class="label"><i class="fas fa-tag"></i> Topics:</span>
    </div>

    <div class="content" id="contentArea">
        <div class="topic-header">
            <h2 id="topicTitle">Loading...</h2>
            <span class="badge" id="topicBadge">Complete Notes</span>
        </div>
        <div id="notesContent"></div>
        <div class="progress-bar">
            <div class="fill" id="progressFill"></div>
        </div>
    </div>

</div>

<script>
    // ================================================================
    // COMPLETE REACT.JS NOTES DATA
    // ================================================================
    const NOTES = {

        '1. Introduction to React': {
            content: `
                <div class="note-section">
                    <h3><i class="fas fa-info-circle"></i> What is React?</h3>
                    <p><strong>React</strong> is a JavaScript library for building user interfaces. It's component-based, declarative, and uses a virtual DOM for efficient updates.</p>
                </div>

                <div class="note-section">
                    <h3><i class="fas fa-lightbulb"></i> Key Features</h3>
                    <ul>
                        <li><strong>Component-Based:</strong> Build encapsulated components that manage their own state</li>
                        <li><strong>Declarative:</strong> Describe what the UI should look like, React handles updates</li>
                        <li><strong>Virtual DOM:</strong> Efficiently updates only what changed</li>
                        <li><strong>JSX:</strong> JavaScript syntax extension for writing HTML-like code</li>
                        <li><strong>Unidirectional Data Flow:</strong> Data flows from parent to child via props</li>
                    </ul>
                </div>

                <div class="note-section">
                    <h3><i class="fas fa-terminal"></i> Setup & Installation</h3>
                    <div class="code-block">
                        <span class="lang-tag">Terminal</span>
                        # Create React App (CRA)
                        npx create-react-app my-app
                        cd my-app
                        npm start

                        # Vite (Faster, Modern)
                        npm create vite@latest my-app -- --template react
                        cd my-app
                        npm install
                        npm run dev

                        # Project Structure (CRA)
                        my-app/
                        ├── public/
                        │   ├── index.html
                        │   └── favicon.ico
                        ├── src/
                        │   ├── App.js
                        │   ├── App.css
                        │   ├── index.js
                        │   └── index.css
                        ├── package.json
                        └── README.md
                    </div>
                </div>

                <div class="note-section">
                    <h3><i class="fas fa-code"></i> First React Component</h3>
                    <div class="code-block">
                        <span class="lang-tag">JavaScript</span>
                        <span class="comment">// App.js - Functional Component</span>
                        <span class="keyword">import</span> React <span class="keyword">from</span> <span class="string">'react'</span>;
                        <span class="keyword">import</span> <span class="string">'./App.css'</span>;

                        <span class="keyword">function</span> <span class="function">App</span>() {
                            <span class="keyword">const</span> name = <span class="string">'React Developer'</span>;
                            <span class="keyword">const</span> handleClick = () => {
                                <span class="function">alert</span>(<span class="string">'Button clicked!'</span>);
                            };

                            <span class="keyword">return</span> (
                                <span class="tag">&lt;div</span> <span class="variable">className</span>=<span class="string">"App"</span><span class="tag">&gt;</span>
                                    <span class="tag">&lt;h1&gt;</span>Hello, {name}!<span class="tag">&lt;/h1&gt;</span>
                                    <span class="tag">&lt;button</span> <span class="variable">onClick</span>={handleClick}<span class="tag">&gt;</span>
                                        Click Me
                                    <span class="tag">&lt;/button&gt;</span>
                                    <span class="tag">&lt;p&gt;</span>Welcome to React!<span class="tag">&lt;/p&gt;</span>
                                <span class="tag">&lt;/div&gt;</span>
                            );
                        }

                        <span class="keyword">export</span> <span class="keyword">default</span> App;

                        <span class="comment">// index.js - Entry point</span>
                        <span class="keyword">import</span> React <span class="keyword">from</span> <span class="string">'react'</span>;
                        <span class="keyword">import</span> ReactDOM <span class="keyword">from</span> <span class="string">'react-dom/client'</span>;
                        <span class="keyword">import</span> App <span class="keyword">from</span> <span class="string">'./App'</span>;

                        <span class="keyword">const</span> root = ReactDOM.<span class="function">createRoot</span>(<span class="function">document</span>.<span class="function">getElementById</span>(<span class="string">'root'</span>));
                        root.<span class="function">render</span>(<span class="tag">&lt;App /&gt;</span>);
                    </div>
                </div>

                <div class="note-box success">
                    <i class="fas fa-check-circle"></i>
                    <strong>Key Concept:</strong> React components are JavaScript functions that return JSX. JSX looks like HTML but is actually JavaScript.
                </div>
            `
        },

        '2. JSX & Rendering': {
            content: `
                <div class="note-section">
                    <h3><i class="fas fa-code"></i> JSX (JavaScript XML)</h3>
                    <p><strong>JSX</strong> is a syntax extension that allows you to write HTML-like code in JavaScript files. It gets compiled to <code>React.createElement()</code> calls.</p>
                </div>

                <div class="note-section">
                    <h3><i class="fas fa-book"></i> JSX Rules & Best Practices</h3>
                    <div class="code-block">
                        <span class="lang-tag">JavaScript</span>
                        <span class="comment">// 1. Wrap multiple elements in a fragment or parent</span>
                        <span class="keyword">return</span> (
                            <span class="tag">&lt;&gt;</span>  <span class="comment">// React Fragment (shorthand)</span>
                                <span class="tag">&lt;h1&gt;</span>Title<span class="tag">&lt;/h1&gt;</span>
                                <span class="tag">&lt;p&gt;</span>Paragraph<span class="tag">&lt;/p&gt;</span>
                            <span class="tag">&lt;/&gt;</span>
                        );

                        <span class="comment">// 2. Use camelCase for attributes</span>
                        <span class="tag">&lt;div</span> <span class="variable">className</span>=<span class="string">"container"</span> <span class="variable">onClick</span>={handleClick} <span class="tag">/&gt;</span>

                        <span class="comment">// 3. Embed expressions with {}</span>
                        <span class="keyword">const</span> name = <span class="string">'John'</span>;
                        <span class="tag">&lt;h1&gt;</span>Hello, {name}!<span class="tag">&lt;/h1&gt;</span>
                        <span class="tag">&lt;p&gt;</span>2 + 2 = {2 + 2}<span class="tag">&lt;/p&gt;</span>

                        <span class="comment">// 4. Boolean attributes</span>
                        <span class="tag">&lt;input</span> <span class="variable">disabled</span>={true} <span class="tag">/&gt;</span>
                        <span class="tag">&lt;input</span> <span class="variable">disabled</span>={isDisabled} <span class="tag">/&gt;</span>

                        <span class="comment">// 5. Conditional rendering</span>
                        {isLoggedIn ? <span class="tag">&lt;UserGreeting /&gt;</span> : <span class="tag">&lt;GuestGreeting /&gt;</span>}

                        <span class="comment">// 6. Lists with keys</span>
                        {items.<span class="function">map</span>(item => (
                            <span class="tag">&lt;li</span> <span class="variable">key</span>={item.id}<span class="tag">&gt;</span>{item.name}<span class="tag">&lt;/li&gt;</span>
                        ))}
                    </div>
                </div>

                <div class="note-section">
                    <h3><i class="fas fa-eye"></i> Rendering Elements</h3>
                    <div class="code-block">
                        <span class="lang-tag">JavaScript</span>
                        <span class="comment">// React DOM updates only what changed</span>
                        <span class="keyword">function</span> <span class="function">Clock</span>() {
                            <span class="keyword">const</span> [time, setTime] = React.<span class="function">useState</span>(<span class="keyword">new</span> <span class="keyword">Date</span>());

                            React.<span class="function">useEffect</span>(() => {
                                <span class="keyword">const</span> timer = <span class="function">setInterval</span>(() => {
                                    <span class="function">setTime</span>(<span class="keyword">new</span> <span class="keyword">Date</span>());
                                }, 1000);
                                <span class="keyword">return</span> () => <span class="function">clearInterval</span>(timer);
                            }, []);

                            <span class="keyword">return</span> <span class="tag">&lt;div&gt;</span>{time.<span class="function">toLocaleTimeString</span>()}<span class="tag">&lt;/div&gt;</span>;
                        }

                        <span class="comment">// React only updates the time text, not the whole DOM</span>
                    </div>
                </div>

                <div class="note-box warning">
                    <i class="fas fa-exclamation-triangle"></i>
                    <strong>Important:</strong> In JSX, use <code>className</code> instead of <code>class</code>, and <code>htmlFor</code> instead of <code>for</code> for labels.
                </div>
            `
        },

        '3. Components & Props': {
            content: `
                <div class="note-section">
                    <h3><i class="fas fa-puzzle-piece"></i> React Components</h3>
                    <p>Components are the building blocks of React applications. There are two types: <strong>Functional</strong> and <strong>Class</strong> components.</p>
                </div>

                <div class="note-section">
                    <h3><i class="fas fa-code"></i> Functional vs Class Components</h3>
                    <div class="code-block">
                        <span class="lang-tag">JavaScript</span>
                        <span class="comment">// Functional Component (Modern, Recommended)</span>
                        <span class="keyword">function</span> <span class="function">Greeting</span>({ name, age }) {
                            <span class="keyword">return</span> (
                                <span class="tag">&lt;div&gt;</span>
                                    <span class="tag">&lt;h1&gt;</span>Hello, {name}!<span class="tag">&lt;/h1&gt;</span>
                                    <span class="tag">&lt;p&gt;</span>Age: {age}<span class="tag">&lt;/p&gt;</span>
                                <span class="tag">&lt;/div&gt;</span>
                            );
                        }

                        <span class="comment">// Class Component (Legacy, but still used)</span>
                        <span class="keyword">class</span> <span class="function">Greeting</span> <span class="keyword">extends</span> React.<span class="function">Component</span> {
                            <span class="function">render</span>() {
                                <span class="keyword">const</span> { name, age } = <span class="keyword">this</span>.<span class="variable">props</span>;
                                <span class="keyword">return</span> (
                                    <span class="tag">&lt;div&gt;</span>
                                        <span class="tag">&lt;h1&gt;</span>Hello, {name}!<span class="tag">&lt;/h1&gt;</span>
                                        <span class="tag">&lt;p&gt;</span>Age: {age}<span class="tag">&lt;/p&gt;</span>
                                    <span class="tag">&lt;/div&gt;</span>
                                );
                            }
                        }

                        <span class="comment">// Using the component</span>
                        <span class="keyword">function</span> <span class="function">App</span>() {
                            <span class="keyword">return</span> (
                                <span class="tag">&lt;div&gt;</span>
                                    <span class="tag">&lt;Greeting</span> <span class="variable">name</span>=<span class="string">"John"</span> <span class="variable">age</span>={30} <span class="tag">/&gt;</span>
                                    <span class="tag">&lt;Greeting</span> <span class="variable">name</span>=<span class="string">"Jane"</span> <span class="variable">age</span>={25} <span class="tag">/&gt;</span>
                                <span class="tag">&lt;/div&gt;</span>
                            );
                        }
                    </div>
                </div>

                <div class="note-section">
                    <h3><i class="fas fa-arrow-down"></i> Props (Properties)</h3>
                    <div class="code-block">
                        <span class="lang-tag">JavaScript</span>
                        <span class="comment">// Props are read-only, passed from parent to child</span>
                        <span class="keyword">function</span> <span class="function">UserCard</span>({ user, showEmail }) {
                            <span class="keyword">return</span> (
                                <span class="tag">&lt;div</span> <span class="variable">className</span>=<span class="string">"card"</span><span class="tag">&gt;</span>
                                    <span class="tag">&lt;h2&gt;</span>{user.name}<span class="tag">&lt;/h2&gt;</span>
                                    {showEmail && <span class="tag">&lt;p&gt;</span>{user.email}<span class="tag">&lt;/p&gt;</span>}
                                    <span class="tag">&lt;p&gt;</span>Role: {user.role || <span class="string">'User'</span>}<span class="tag">&lt;/p&gt;</span>
                                <span class="tag">&lt;/div&gt;</span>
                            );
                        }

                        <span class="comment">// Default props</span>
                        UserCard.<span class="variable">defaultProps</span> = {
                            <span class="variable">showEmail</span>: <span class="keyword">false</span>
                        };

                        <span class="comment">// PropTypes validation</span>
                        <span class="keyword">import</span> PropTypes <span class="keyword">from</span> <span class="string">'prop-types'</span>;
                        UserCard.<span class="variable">propTypes</span> = {
                            <span class="variable">user</span>: PropTypes.<span class="variable">shape</span>({
                                <span class="variable">name</span>: PropTypes.<span class="variable">string</span>.<span class="variable">isRequired</span>,
                                <span class="variable">email</span>: PropTypes.<span class="variable">string</span>,
                                <span class="variable">role</span>: PropTypes.<span class="variable">string</span>
                            }).<span class="variable">isRequired</span>,
                            <span class="variable">showEmail</span>: PropTypes.<span class="variable">bool</span>
                        };
                    </div>
                </div>

                <div class="note-section">
                    <h3><i class="fas fa-children"></i> Children Prop</h3>
                    <div class="code-block">
                        <span class="lang-tag">JavaScript</span>
                        <span class="comment">// Components can render children</span>
                        <span class="keyword">function</span> <span class="function">Card</span>({ title, children }) {
                            <span class="keyword">return</span> (
                                <span class="tag">&lt;div</span> <span class="variable">className</span>=<span class="string">"card"</span><span class="tag">&gt;</span>
                                    <span class="tag">&lt;h2&gt;</span>{title}<span class="tag">&lt;/h2&gt;</span>
                                    <span class="tag">&lt;div</span> <span class="variable">className</span>=<span class="string">"content"</span><span class="tag">&gt;</span>
                                        {children}
                                    <span class="tag">&lt;/div&gt;</span>
                                <span class="tag">&lt;/div&gt;</span>
                            );
                        }

                        <span class="keyword">function</span> <span class="function">App</span>() {
                            <span class="keyword">return</span> (
                                <span class="tag">&lt;Card</span> <span class="variable">title</span>=<span class="string">"Welcome"</span><span class="tag">&gt;</span>
                                    <span class="tag">&lt;p&gt;</span>This is the content inside the card.<span class="tag">&lt;/p&gt;</span>
                                    <span class="tag">&lt;button&gt;</span>Click Me<span class="tag">&lt;/button&gt;</span>
                                <span class="tag">&lt;/Card&gt;</span>
                            );
                        }
                    </div>
                </div>

                <div class="note-box">
                    <i class="fas fa-lightbulb"></i>
                    <strong>Tip:</strong> Props are read-only. Never modify props directly. Use state for data that changes.
                </div>
            `
        },

        '4. State & useState Hook': {
            content: `
                <div class="note-section">
                    <h3><i class="fas fa-database"></i> State in React</h3>
                    <p><strong>State</strong> is data that changes over time. When state changes, the component re-renders.</p>
                </div>

                <div class="note-section">
                    <h3><i class="fas fa-hook"></i> useState Hook</h3>
                    <div class="code-block">
                        <span class="lang-tag">JavaScript</span>
                        <span class="keyword">import</span> React, { useState } <span class="keyword">from</span> <span class="string">'react'</span>;

                        <span class="keyword">function</span> <span class="function">Counter</span>() {
                            <span class="comment">// useState returns [current value, setter function]</span>
                            <span class="keyword">const</span> [count, setCount] = <span class="function">useState</span>(0);
                            <span class="keyword">const</span> [name, setName] = <span class="function">useState</span>(<span class="string">'John'</span>);
                            <span class="keyword">const</span> [user, setUser] = <span class="function">useState</span>({ id: 1, name: <span class="string">'John'</span> });

                            <span class="comment">// Updating state</span>
                            <span class="keyword">const</span> increment = () => {
                                <span class="function">setCount</span>(count + 1); <span class="comment">// Direct update</span>
                            };

                            <span class="comment">// Using previous state (recommended for multiple updates)</span>
                            <span class="keyword">const</span> incrementSafe = () => {
                                <span class="function">setCount</span>(prev => prev + 1);
                            };

                            <span class="comment">// Updating object state</span>

                <div class="note-section">
                    <h3><i class="fas fa-share-alt"></i> Context API</h3>
                    <p><strong>Context</strong> provides a way to pass data through the component tree without having to pass props down manually at every level.</p>
                </div>

                <div class="note-section">
                    <h3><i class="fas fa-code"></i> Creating and Using Context</h3>
                    <div class="code-block">
                        <span class="lang-tag">JavaScript</span>
                        <span class="comment">// 1. Create a Context</span>
                        <span class="keyword">import</span> React, { createContext, useContext, useState } <span class="keyword">from</span> <span class="string">'react'</span>;

                        <span class="keyword">const</span> UserContext = <span class="function">createContext</span>();

                        <span class="comment">// 2. Create a Provider component</span>
                        <span class="keyword">function</span> <span class="function">UserProvider</span>({ children }) {
                            <span class="keyword">const</span> [user, setUser] = <span class="function">useState</span>({
                                <span class="variable">id</span>: 1,
                                <span class="variable">name</span>: <span class="string">'John Doe'</span>,
                                <span class="variable">email</span>: <span class="string">'john@example.com'</span>,
                                <span class="variable">role</span>: <span class="string">'admin'</span>
                            });

                            <span class="keyword">const</span> login = (userData) => <span class="function">setUser</span>(userData);
                            <span class="keyword">const</span> logout = () => <span class="function">setUser</span>(<span class="keyword">null</span>);

                            <span class="keyword">return</span> (
                                <span class="tag">&lt;UserContext.Provider</span> <span class="variable">value</span>={{ user, <span class="variable">login</span>, <span class="variable">logout</span> }}<span class="tag">&gt;</span>
                                    {children}
                                <span class="tag">&lt;/UserContext.Provider&gt;</span>
                            );
                        }

                        <span class="comment">// 3. Custom hook for using the context</span>
                        <span class="keyword">function</span> <span class="function">useUser</span>() {
                            <span class="keyword">const</span> context = <span class="function">useContext</span>(UserContext);
                            <span class="keyword">if</span> (!context) {
                                <span class="keyword">throw</span> <span class="keyword">new</span> <span class="keyword">Error</span>(<span class="string">'useUser must be used within UserProvider'</span>);
                            }
                            <span class="keyword">return</span> context;
                        }

                        <span class="comment">// 4. Using the context in components</span>
                        <span class="keyword">function</span> <span class="function">UserProfile</span>() {
                            <span class="keyword">const</span> { user, logout } = <span class="function">useUser</span>();

                            <span class="keyword">if</span> (!user) <span class="keyword">return</span> <span class="tag">&lt;p&gt;</span>Please log in<span class="tag">&lt;/p&gt;</span>;

                            <span class="keyword">return</span> (

                                    <span class="tag">&lt;h1&gt;</span>Welcome, {user.name}!<span class="tag">&lt;/h1&gt;</span>

                                <span class="tag">&lt;/div&gt;</span>
                            );
                        }

                        <span class="comment">// 5. Wrap the app with the provider</span>
                        <span class="keyword">function</span> <span class="function">App</span>() {
                            <span class="keyword">return</span> (
                                <span class="tag">&lt;UserProvider&gt;</span>
                                    <span class="tag">&lt;UserProfile /&gt;</span>
                                    <span class="tag">&lt;AnotherComponent /&gt;</span>
                                <span class="tag">&lt;/UserProvider&gt;</span>

                        }
                    </div>
                </div>

                <div class="note-section">
                    <h3><i class="fas fa-shopping-cart"></i> Example: Shopping Cart Context</h3>
                    <div class="code-block">
                        <span class="lang-tag">JavaScript</span>
                        <span class="keyword">const</span> CartContext = <span class="function">createContext</span>();

                        <span class="keyword">function</span> <span class="function">CartProvider</span>({ children }) {
                            <span class="keyword">const</span> [cart, setCart] = <span class="function">useState</span>([]);

                            <span class="keyword">const</span> addToCart = (product) => {
                                <span class="function">setCart</span>(prev => {
                                    <span class="keyword">const</span> existing = prev.<span class="function">find</span>(item => item.<span class="variable">id</span> === product.<span class="variable">id</span>);
                                    <span class="keyword">if</span> (existing) {
                                        <span class="keyword">return</span> prev.<span class="function">map</span>(item =>
                                            item.<span class="variable">id</span> === product.<span class="variable">id</span>
                                                ? { ...item, quantity: item.<span class="variable">quantity</span> + 1 }
                                                : item
                                        );
                                    }
                                    <span class="keyword">return</span> [...prev, { ...product, quantity: 1 }];
                                });
                            };

                            <span class="keyword">const</span> removeFromCart = (id) => {
                                <span class="function">setCart</span>(prev => prev.<span class="function">filter</span>(item => item.<span class="variable">id</span> !== id));

        '11. Redux & Redux Toolkit': {
            content: `
                <div class="note-section">
                    <h3><i class="fas fa-store"></i> Redux Introduction</h3>
                    <p><strong>Redux</strong> is a predictable state container for JavaScript apps. <strong>Redux Toolkit (RTK)</strong> is the modern, recommended way to write Redux logic.</p>

                    <h3><i class="fas fa-code"></i> Redux Toolkit Setup</h3>

                        <span class="comment">// store.js - Create the Redux store</span>

                                <span class="variable">todos</span>: todoReducer
                            }
                        });

                        <span class="comment">// App.js - Provide the store</span>
                        <span class="keyword">import</span> { Provider } <span class="keyword">from</span> <span class="string">'react-redux'</span>;
                        <span class="keyword">import</span> { store } <span class="keyword">from</span> <span class="string">'./store'</span>;

                        <span class="keyword">function</span> <span class="function">App</span>() {

                                    <span class="tag">&lt;Counter /&gt;</span>
                                <span class="tag">&lt;/Provider&gt;</span>

                    </div>
                </div>

                <div class="note-section">
                    <h3><i class="fas fa-code-branch"></i> Creating a Slice</h3>
                    <div class="code-block">
                        <span class="lang-tag">JavaScript</span>
                        <span class="comment">// features/counter/counterSlice.js</span>
                        <span class="keyword">import</span> { createSlice } <span class="keyword">from</span> <span class="string">'@reduxjs/toolkit'</span>;

                        <span class="keyword">const</span> initialState = {

                                },
                                <span class="variable">reset</span>: (state) => {
                                    state.<span class="variable">value</span> = 0;
                                }
                            }
                        });

                        <span class="comment">// Export actions and reducer</span>
                        <span class="keyword">export</span> <span class="keyword">const</span> { increment, decrement, incrementByAmount, reset } = counterSlice.<span class="variable">actions</span>;
                        <span class="keyword">export</span> <span class="keyword">default</span> counterSlice.<span class="variable">reducer</span>;

                        <span class="lang-tag">JavaScript</span>
                        <span class="comment">// Counter.jsx</span>
                        <span class="keyword">import</span> { useSelector, useDispatch } <span class="keyword">from</span> <span class="string">'react-redux'</span>;

                                    <span class="tag">&lt;button</span> <span class="variable">onClick</span>={() => <span class="function">dispatch</span>(<span class="function">decrement</span>())}<span class="tag">&gt;</span>-<span class="tag">&lt;/button&gt;</span>
                                    <span class="tag">&lt;button</span> <span class="variable">onClick</span>={() => <span class="function">dispatch</span>(<span class="function">incrementByAmount</span>(5))}<span class="tag">&gt;</span>+5<span class="tag">&lt;/button&gt;</span>
                                    <span class="tag">&lt;button</span> <span class="variable">onClick</span>={() => <span class="function">dispatch</span>(<span class="function">reset</span>())}<span class="tag">&gt;</span>Reset<span class="tag">&lt;/button&gt;</span>

                <div class="note-section">
                    <h3><i class="fas fa-tasks"></i> Async Thunks</h3>
                    <div class="code-block">
                        <span class="lang-tag">JavaScript</span>
                        <span class="comment">// features/user/userSlice.js</span>
                        <span class="keyword">import</span> { createSlice, createAsyncThunk } <span class="keyword">from</span> <span class="string">'@reduxjs/toolkit'</span>;

                        <span class="comment">// Async thunk for fetching users</span>
                        <span class="keyword">export</span> <span class="keyword">const</span> fetchUsers = <span class="function">createAsyncThunk</span>(
                            <span class="string">'users/fetchUsers'</span>,
                            <span class="keyword">async</span> () => {
                                <span class="keyword">const</span> response = <span class="keyword">await</span> <span class="function">fetch</span>(<span class="string">'https://jsonplaceholder.typicode.com/users'</span>);
                                <span class="keyword">const</span> data = <span class="keyword">await</span> response.<span class="function">json</span>();
                                <span class="keyword">return</span> data;
                            }
                        );

                        <span class="keyword">const</span> userSlice = <span class="function">createSlice</span>({
                            <span class="variable">name</span>: <span class="string">'users'</span>,
                            <span class="variable">initialState</span>: {
                                <span class="variable">users</span>: [],
                                <span class="variable">loading</span>: <span class="keyword">false</span>,
                                <span class="variable">error</span>: <span class="keyword">null</span>

                            <span class="variable">extraReducers</span>: (builder) => {
                                builder
                                    .<span class="function">addCase</span>(fetchUsers.<span class="variable">pending</span>, (state) => {
                                        state.<span class="variable">loading</span> = <span class="keyword">true</span>;
                                    })
                                    .<span class="function">addCase</span>(fetchUsers.<span class="variable">fulfilled</span>, (state, action) => {
                                        state.<span class="variable">loading</span> = <span class="keyword">false</span>;
                                        state.<span class="variable">users</span> = action.<span class="variable">payload</span>;
                                        state.<span class="variable">error</span> = <span class="keyword">null</span>;

                                    .<span class="function">addCase</span>(fetchUsers.<span class="variable">rejected</span>, (state, action) => {
                                        state.<span class="variable">loading</span> = <span class="keyword">false</span>;
                                        state.<span class="variable">error</span> = action.<span class="variable">error</span>.<span class="variable">message</span>;
                                    });
                            }
                        });

                        <span class="keyword">export</span> <span class="keyword">default</span> userSlice.<span class="variable">reducer</span>;

                        <span class="comment">// UserList.jsx</span>

                                    {users.<span class="function">map</span>(user => (

                    </div>

        '12. Custom Hooks': {
            content: `
                <div class="note-section">
                    <h3><i class="fas fa-hook"></i> Custom Hooks</h3>
                    <p><strong>Custom Hooks</strong> allow you to extract component logic into reusable functions. They are a powerful pattern for code reuse.</p>
                </div>

                <div class="note-section">
                    <h3><i class="fas fa-code"></i> Creating Custom Hooks</h3>
                    <div class="code-block">
                        <span class="lang-tag">JavaScript</span>
                        <span class="comment">// hooks/useCounter.js</span>
                        <span class="keyword">import</span> { useState, useCallback } <span class="keyword">from</span> <span class="string">'react'</span>;

                        <span class="keyword">function</span> <span class="function">useCounter</span>(initialValue = 0, step = 1) {
                            <span class="keyword">const</span> [count, setCount] = <span class="function">useState</span>(initialValue);

                            <span class="keyword">const</span> increment = <span class="function">useCallback</span>(() => {
                                <span class="function">setCount</span>(prev => prev + step);
                            }, [step]);

                            <span class="keyword">const</span> decrement = <span class="function">useCallback</span>(() => {
                                <span class="function">setCount</span>(prev => prev - step);
                            }, [step]);

                            <span class="keyword">const</span> reset = <span class="function">useCallback</span>(() => {
                                <span class="function">setCount</span>(initialValue);
                            }, [initialValue]);

                            <span class="keyword">return</span> { count, increment, decrement, reset };
                        }

                        <span class="keyword">export</span> <span class="keyword">default</span> useCounter;

                        <span class="comment">// Using the custom hook</span>
                        <span class="keyword">function</span> <span class="function">CounterComponent</span>() {
                            <span class="keyword">const</span> { count, increment, decrement, reset } = <span class="function">useCounter</span>(10, 2);

                            <span class="keyword">return</span> (
                                <span class="tag">&lt;div&gt;</span>
                                    <span class="tag">&lt;p&gt;</span>Count: {count}<span class="tag">&lt;/p&gt;</span>
                                    <span class="tag">&lt;button</span> <span class="variable">onClick</span>={increment}<span class="tag">&gt;</span>+{step}<span class="tag">&lt;/button&gt;</span>
                                    <span class="tag">&lt;button</span> <span class="variable">onClick</span>={decrement}<span class="tag">&gt;</span>-{step}<span class="tag">&lt;/button&gt;</span>
                                    <span class="tag">&lt;button</span> <span class="variable">onClick</span>={reset}<span class="tag">&gt;</span>Reset<span class="tag">&lt;/button&gt;</span>
                                <span class="tag">&lt;/div&gt;</span>
                            );
                        }
                    </div>
                </div>

                <div class="note-section">
                    <h3><i class="fas fa-database"></i> Data Fetching Hook</h3>
                    <div class="code-block">
                        <span class="lang-tag">JavaScript</span>
                        <span class="comment">// hooks/useFetch.js</span>
                        <span class="keyword">import</span> { useState, useEffect } <span class="keyword">from</span> <span class="string">'react'</span>;

                        <span class="keyword">function</span> <span class="function">useFetch</span>(url, options = {}) {
                            <span class="keyword">const</span> [data, setData] = <span class="function">useState</span>(<span class="keyword">null</span>);
                            <span class="keyword">const</span> [loading, setLoading] = <span class="function">useState</span>(<span class="keyword">true</span>);
                            <span class="keyword">const</span> [error, setError] = <span class="function">useState</span>(<span class="keyword">null</span>);

                            <span class="function">useEffect</span>(() => {
                                <span class="keyword">const</span> <span class="function">fetchData</span> = <span class="keyword">async</span> () => {
                                    <span class="keyword">try</span> {
                                        <span class="function">setLoading</span>(<span class="keyword">true</span>);
                                        <span class="keyword">const</span> response = <span class="keyword">await</span> <span class="function">fetch</span>(url, options);
                                        <span class="keyword">if</span> (!response.<span class="variable">ok</span>) {
                                            <span class="keyword">throw</span> <span class="keyword">new</span> <span class="keyword">Error</span>(<span class="string">'Network response was not ok'</span>);
                                        }
                                        <span class="keyword">const</span> result = <span class="keyword">await</span> response.<span class="function">json</span>();
                                        <span class="function">setData</span>(result);
                                        <span class="function">setError</span>(<span class="keyword">null</span>);
                                    } <span class="keyword">catch</span> (err) {
                                        <span class="function">setError</span>(err.<span class="variable">message</span>);
                                    } <span class="keyword">finally</span> {
                                        <span class="function">setLoading</span>(<span class="keyword">false</span>);
                                    }
                                };

                                <span class="function">fetchData</span>();
                            }, [url]);

                            <span class="keyword">return</span> { data, loading, error };
                        }

                        <span class="keyword">export</span> <span class="keyword">default</span> useFetch;

                        <span class="comment">// Using the hook</span>
                        <span class="keyword">function</span> <span class="function">UserList</span>() {
                            <span class="keyword">const</span> { data, loading, error } = <span class="function">useFetch</span>(<span class="string">'https://jsonplaceholder.typicode.com/users'</span>);

                            <span class="keyword">if</span> (loading) <span class="keyword">return</span> <span class="tag">&lt;div&gt;</span>Loading...<span class="tag">&lt;/div&gt;</span>;
                            <span class="keyword">if</span> (error) <span class="keyword">return</span> <span class="tag">&lt;div&gt;</span>Error: {error}<span class="tag">&lt;/div&gt;</span>;

                            <span class="keyword">return</span> (
                                <span class="tag">&lt;ul&gt;</span>
                                    {data?.<span class="function">map</span>(user => (
                                        <span class="tag">&lt;li</span> <span class="variable">key</span>={user.id}<span class="tag">&gt;</span>{user.name}<span class="tag">&lt;/li&gt;</span>
                                    ))}
                                <span class="tag">&lt;/ul&gt;</span>
                            );
                        }
                    </div>
                </div>

                <div class="note-section">
                    <h3><i class="fas fa-window-maximize"></i> Window Size Hook</h3>
                    <div class="code-block">
                        <span class="lang-tag">JavaScript</span>
                        <span class="comment">// hooks/useWindowSize.js</span>
                        <span class="keyword">import</span> { useState, useEffect } <span class="keyword">from</span> <span class="string">'react'</span>;

                        <span class="keyword">function</span> <span class="function">useWindowSize</span>() {
                            <span class="keyword">const</span> [windowSize, setWindowSize] = <span class="function">useState</span>({
                                <span class="variable">width</span>: window.<span class="variable">innerWidth</span>,
                                <span class="variable">height</span>: window.<span class="variable">innerHeight</span>
                            });

                            <span class="function">useEffect</span>(() => {
                                <span class="keyword">const</span> <span class="function">handleResize</span> = () => {
                                    <span class="function">setWindowSize</span>({
                                        <span class="variable">width</span>: window.<span class="variable">innerWidth</span>,
                                        <span class="variable">height</span>: window.<span class="variable">innerHeight</span>
                                    });
                                };

                                window.<span class="function">addEventListener</span>(<span class="string">'resize'</span>, handleResize);
                                <span class="keyword">return</span> () => window.<span class="function">removeEventListener</span>(<span class="string">'resize'</span>, handleResize);
                            }, []);

                            <span class="keyword">return</span> windowSize;
                        }

                        <span class="keyword">export</span> <span class="keyword">default</span> useWindowSize;
                    </div>
                </div>

                <div class="note-box success">
                    <i class="fas fa-check-circle"></i>
                    <strong>Custom Hook Rules:</strong>
                    <ul>
                        <li>Custom hooks must start with "use"</li>
                        <li>Only call hooks inside custom hooks or components</li>
                        <li>Return values or functions that components can use</li>
                        <li>Custom hooks can call other hooks</li>
                    </ul>
                </div>
            `
        },

        '13. Performance Optimization': {
            content: `
                <div class="note-section">
                    <h3><i class="fas fa-tachometer-alt"></i> Performance Optimization</h3>
                    <p>React provides several tools and techniques to optimize application performance.</p>
                </div>

                <div class="note-section">
                    <h3><i class="fas fa-code"></i> React.memo</h3>
                    <div class="code-block">
                        <span class="lang-tag">JavaScript</span>
                        <span class="comment">// React.memo prevents re-renders if props haven't changed</span>
                        <span class="keyword">const</span> ChildComponent = React.<span class="function">memo</span>(({ name, count }) => {

                                <span class="tag">&lt;div&gt;</span>
                                    <span class="tag">&lt;h2&gt;</span>Child: {name}<span class="tag">&lt;/h2&gt;</span>
                                    <span class="tag">&lt;p&gt;</span>Count: {count}<span class="tag">&lt;/p&gt;</span>
                                <span class="tag">&lt;/div&gt;</span>
                            );
                        });

                        <span class="comment">// Parent component</span>
                        <span class="keyword">function</span> <span class="function">Parent</span>() {
                            <span class="keyword">const</span> [count, setCount] = <span class="function">useState</span>(0);
                            <span class="keyword">const</span> [name] = <span class="function">useState</span>(<span class="string">'John'</span>);

                            <span class="keyword">return</span> (
                                <span class="tag">&lt;div&gt;</span>
                                    <span class="tag">&lt;button</span> <span class="variable">onClick</span>={() => <span class="function">setCount</span>(count + 1)}<span class="tag">&gt;</span>
                                        Parent Count: {count}
                                    <span class="tag">&lt;/button&gt;</span>
                                    <span class="tag">&lt;ChildComponent</span> <span class="variable">name</span>={name} <span class="variable">count</span>={count} <span class="tag">/&gt;</span>

                    </div>
                </div>

                <div class="note-section">
                    <h3><i class="fas fa-memory"></i> useMemo & useCallback</h3>
                    <div class="code-block">
                        <span class="lang-tag">JavaScript</span>
                        <span class="keyword">import</span> { useState, useMemo, useCallback } <span class="keyword">from</span> <span class="string">'react'</span>;

                        <span class="keyword">function</span> <span class="function">ExpensiveComponent</span>({ numbers }) {
                            <span class="comment">// useMemo caches the result of expensive calculations</span>
                            <span class="keyword">const</span> expensiveSum = <span class="function">useMemo</span>(() => {
                                <span class="function">console</span>.<span class="function">log</span>(<span class="string">'Calculating sum...'</span>);
                                <span class="keyword">return</span> numbers.<span class="function">reduce</span>((sum, num) => sum + num, 0);
                            }, [numbers]); <span class="comment">// Recalculate only when numbers change</span>

                            <span class="comment">// useCallback caches function references</span>
                            <span class="keyword">const</span> handleClick = <span class="function">useCallback</span>(() => {
                                <span class="function">console</span>.<span class="function">log</span>(<span class="string">'Button clicked!'</span>);
                            }, []); <span class="comment">// Function reference is stable</span>

                            <span class="keyword">return</span> (
                                <span class="tag">&lt;div&gt;</span>
                                    <span class="tag">&lt;p&gt;</span>Sum: {expensiveSum}<span class="tag">&lt;/p&gt;</span>
                                    <span class="tag">&lt;button</span> <span class="variable">onClick</span>={handleClick}<span class="tag">&gt;</span>Click Me<span class="tag">&lt;/button&gt;</span>

        '16. Next.js Introduction': {

                <div class="note-section">
                    <h3><i class="fas fa-server"></i> What is Next.js?</h3>
                    <p><strong>Next.js</strong> is a React framework that enables server-side rendering, static site generation, and other powerful features.</p>
                </div>

                <div class="note-section">
                    <h3><i class="fas fa-code"></i> Key Features</h3>
                    <ul>
                        <li><strong>Server-Side Rendering (SSR)</strong>: Render pages on the server</li>

                        <li><strong>Incremental Static Regeneration (ISR)</strong>: Update static content</li>
                        <li><strong>File-based Routing</strong>: Pages based on file structure</li>
                        <li><strong>API Routes</strong>: Build APIs within the same project</li>

                            <span class="keyword">return</span> (

                <div class="note-section">
                    <h3><i class="fas fa-route"></i> Routing in Next.js</h3>
                    <div class="code-block">
                        <span class="lang-tag">File Structure</span>
                        <span class="comment">// Pages Router (pages/)</span>
                        pages/
                        ├── index.js         → /
                        ├── about.js         → /about
                        ├── blog/
                        │   └── [id].js      → /blog/1, /blog/2

                        ├── page.js          → /

                        │   └── page.js      → /about

                        │   ├── [id]/

                        │   └── page.js      → /blog

                            └── users/

                        <span class="lang-tag">JavaScript</span>
                        <span class="comment">// pages/blog/[id].js - Dynamic routing</span>
                        <span class="keyword">import</span> { useRouter } <span class="keyword">from</span> <span class="string">'next/router'</span>;

                        <span class="keyword">export</span> <span class="keyword">default</span> <span class="keyword">function</span> <span class="function">BlogPost</span>() {
                            <span class="keyword">const</span> router = <span class="function">useRouter</span>();

                        <span class="keyword">export</span> <span class="keyword">default</span> <span class="keyword">function</span> <span class="function">BlogPost</span>({ params }) {

        '17. Next.js Data Fetching & Rendering': {
            content: `
                <div class="note-section">
                    <h3><i class="fas fa-database"></i> Data Fetching in Next.js</h3>

                <div class="note-section">
                    <h3><i class="fas fa-code"></i> Pages Router - Data Fetching</h3>
                    <div class="code-block">
                        <span class="lang-tag">JavaScript</span>
                        <span class="comment">// 1. Static Site Generation (SSG) - getStaticProps</span>
                        <span class="keyword">export</span> <span class="keyword">async</span> <span class="keyword">function</span> <span class="function">getStaticProps</span>() {
                            <span class="keyword">const</span> res = <span class="keyword">await</span> <span class="function">fetch</span>(<span class="string">'https://api.example.com/posts'</span>);
                            <span class="keyword">const</span> posts = <span class="keyword">await</span> res.<span class="function">json</span>();

                            <span class="keyword">return</span> {
                                <span class="variable">props</span>: { posts },
                                <span class="variable">revalidate</span>: 60 <span class="comment">// ISR: Revalidate every 60 seconds</span>
                            };
                        }

                        <span class="comment">// 2. Dynamic Routes with getStaticPaths</span>
                        <span class="keyword">export</span> <span class="keyword">async</span> <span class="keyword">function</span> <span class="function">getStaticPaths</span>() {
                            <span class="keyword">const</span> res = <span class="keyword">await</span> <span class="function">fetch</span>(<span class="string">'https://api.example.com/posts'</span>);
                            <span class="keyword">const</span> posts = <span class="keyword">await</span> res.<span class="function">json</span>();

                            <span class="keyword">const</span> paths = posts.<span class="function">map</span>(post => ({
                                <span class="variable">params</span>: { id: post.<span class="variable">id</span>.<span class="function">toString</span>() }
                            }));

                            <span class="keyword">return</span> { paths, <span class="variable">fallback</span>: <span class="string">'blocking'</span> };
                        }

                        <span class="keyword">export</span> <span class="keyword">async</span> <span class="keyword">function</span> <span class="function">getStaticProps</span>({ params }) {
                            <span class="keyword">const</span> res = <span class="keyword">await</span> <span class="function">fetch</span>(<span class="string">\`https://api.example.com/posts/\${params.id}\`</span>);
                            <span class="keyword">const</span> post = <span class="keyword">await</span> res.<span class="function">json</span>();

                            <span class="keyword">return</span> { <span class="variable">props</span>: { post } };
                        }

                        <span class="comment">// 3. Server-Side Rendering (SSR) - getServerSideProps</span>
                        <span class="keyword">export</span> <span class="keyword">async</span> <span class="keyword">function</span> <span class="function">getServerSideProps</span>(context) {
                            <span class="comment">// context includes: req, res, query, params, etc.</span>
                            <span class="keyword">const</span> { query } = context;
                            <span class="keyword">const</span> res = <span class="keyword">await</span> <span class="function">fetch</span>(<span class="string">\`https://api.example.com/search?q=\${query.q}\`</span>);
                            <span class="keyword">const</span> results = <span class="keyword">await</span> res.<span class="function">json</span>();

                            <span class="keyword">return</span> { <span class="variable">props</span>: { results } };
                        }
                    </div>
                </div>

                <div class="note-section">
                    <h3><i class="fas fa-code"></i> App Router - Data Fetching</h3>
                    <div class="code-block">
                        <span class="lang-tag">JavaScript</span>
                        <span class="comment">// Server Components (Default) - Fetch directly</span>
                        <span class="keyword">export</span> <span class="keyword">default</span> <span class="keyword">async</span> <span class="keyword">function</span> <span class="function">Page</span>() {
                            <span class="keyword">const</span> res = <span class="keyword">await</span> <span class="function">fetch</span>(<span class="string">'https://api.example.com/posts'</span>, {
                                <span class="variable">cache</span>: <span class="string">'force-cache'</span> <span class="comment">// SSG (static)</span>
                            });
                            <span class="keyword">const</span> posts = <span class="keyword">await</span> res.<span class="function">json</span>();

                            <span class="keyword">return</span> (
                                <span class="tag">&lt;div&gt;</span>
                                    {posts.<span class="function">map</span>(post => (
                                        <span class="tag">&lt;div</span> <span class="variable">key</span>={post.id}<span class="tag">&gt;</span>{post.title}<span class="tag">&lt;/div&gt;</span>
                                    ))}
                                <span class="tag">&lt;/div&gt;</span>
                            );
                        }

                        <span class="comment">// Dynamic data fetching with revalidation</span>
                        <span class="keyword">export</span> <span class="keyword">default</span> <span class="keyword">async</span> <span class="keyword">function</span> <span class="function">Page</span>() {
                            <span class="keyword">const</span> res = <span class="keyword">await</span> <span class="function">fetch</span>(<span class="string">'https://api.example.com/posts'</span>, {
                                <span class="variable">next</span>: { <span class="variable">revalidate</span>: 60 } <span class="comment">// ISR: Revalidate every 60 seconds</span>
                            });
                            <span class="keyword">const</span> posts = <span class="keyword">await</span> res.<span class="function">json</span>();

                            <span class="keyword">return</span> <span class="tag">&lt;div&gt;</span>{posts.<span class="function">map</span>(post => ...)}<span class="tag">&lt;/div&gt;</span>;
                        }

                        <span class="comment">// Dynamic routes in App Router</span>
                        <span class="keyword">export</span> <span class="keyword">default</span> <span class="keyword">async</span> <span class="keyword">function</span> <span class="function">Page</span>({ params }) {
                            <span class="keyword">const</span> res = <span class="keyword">await</span> <span class="function">fetch</span>(<span class="string">\`https://api.example.com/posts/\${params.id}\`</span>);
                            <span class="keyword">const</span> post = <span class="keyword">await</span> res.<span class="function">json</span>();

                            <span class="keyword">return</span> <span class="tag">&lt;div&gt;</span>{post.title}<span class="tag">&lt;/div&gt;</span>;
                        }

                        <span class="comment">// generateStaticParams for static paths</span>
                        <span class="keyword">export</span> <span class="keyword">async</span> <span class="keyword">function</span> <span class="function">generateStaticParams</span>() {
                            <span class="keyword">const</span> res = <span class="keyword">await</span> <span class="function">fetch</span>(<span class="string">'https://api.example.com/posts'</span>);
                            <span class="keyword">const</span> posts = <span class="keyword">await</span> res.<span class="function">json</span>();

                            <span class="keyword">return</span> posts.<span class="function">map</span>(post => ({
                                <span class="variable">id</span>: post.<span class="variable">id</span>.<span class="function">toString</span>()
                            }));
                        }
                    </div>
                </div>

                <div class="note-section">
                    <h3><i class="fas fa-chart-bar"></i> Rendering Comparison</h3>
                    <div class="code-block">
                        <span class="lang-tag">Comparison</span>
                        ┌──────────────────┬─────────────────┬──────────────────┐
                        │     SSG          │       SSR       │       ISR        │
                        ├──────────────────┼─────────────────┼──────────────────┤
                        │ Build Time       │ Request Time    │ Build + Runtime  │
                        │ Static HTML      │ Dynamic HTML    │ Static + Update  │
                        │ Fastest          │ Slower          │ Fast + Fresh     │
                        │ Good for blogs   │ Good for dash   │ Good for ecomm   │
                        │ Revalidate: N/A  │ Revalidate: N/A │ Revalidate: 60s  │
                        └──────────────────┴─────────────────┴──────────────────┘

                        <span class="comment">// Client-side data fetching (SWR)</span>
                        <span class="keyword">import</span> useSWR <span class="keyword">from</span> <span class="string">'swr'</span>;

                        <span class="keyword">function</span> <span class="function">Profile</span>() {
                            <span class="keyword">const</span> { data, error } = <span class="function">useSWR</span>(<span class="string">'/api/user'</span>, fetcher);

                            <span class="keyword">if</span> (error) <span class="keyword">return</span> <span class="tag">&lt;div&gt;</span>Failed to load<span class="tag">&lt;/div&gt;</span>;
                            <span class="keyword">if</span> (!data) <span class="keyword">return</span> <span class="tag">&lt;div&gt;</span>Loading...<span class="tag">&lt;/div&gt;</span>;

                            <span class="keyword">return</span> <span class="tag">&lt;div&gt;</span>Hello {data.name}!<span class="tag">&lt;/div&gt;</span>;
                        }
                    </div>
                </div>

                <div class="note-box success">
                    <i class="fas fa-check-circle"></i>
                    <strong>Choosing the Right Strategy:</strong>
                    <ul>
                        <li><strong>SSG:</strong> Static content that doesn't change often</li>
                        <li><strong>SSR:</strong> Dynamic content that needs real-time data</li>
                        <li><strong>ISR:</strong> Static content that updates periodically</li>
                        <li><strong>Client-side:</strong> User-specific data after login</li>
                    </ul>
                </div>
            `
