</head>
<body>
<div class="container">

        <h1><i class="fab fa-nextjs"></i> Next.js Complete Notes</h1>
        <p>Complete guide from basics to production · 15 topics · code examples · best practices</p>
        <div class="badge-group">
            <span><i class="fas fa-check-circle"></i> 15 Topics</span>

            <span><i class="fas fa-rocket"></i> Beginner to Advanced</span>

    <div class="topic-nav" id="topicNav">
        <span class="label"><i class="fas fa-tag"></i> Topics:</span>

    <div class="content" id="contentArea">
        <div class="topic-header">
            <h2 id="topicTitle">Loading...</h2>
            <span class="badge" id="topicBadge">Complete Notes</span>
        </div>
        <div id="notesContent"></div>
        <div class="progress-bar">
            <div class="fill" id="progressFill"></div>
        </div>
    </div>
</div>

<script>
    const NOTES = {
        '1. Next.js Introduction': {
            content: `
                <div class="note-section">
                    <h3><i class="fas fa-info-circle"></i> What is Next.js?</h3>
                    <p><strong>Next.js</strong> is a React framework that enables server-side rendering, static site generation, and other powerful features. It's the most popular React framework for production applications.</p>
                </div>

                <div class="note-section">
                    <h3><i class="fas fa-star"></i> Key Features</h3>
                    <div class="feature-grid">
                        <div class="feature-item"><i class="fas fa-server"></i> SSR (Server-Side Rendering)</div>
                        <div class="feature-item"><i class="fas fa-file-code"></i> SSG (Static Site Generation)</div>
                        <div class="feature-item"><i class="fas fa-sync"></i> ISR (Incremental Static Regeneration)</div>
                        <div class="feature-item"><i class="fas fa-route"></i> File-based Routing</div>
                        <div class="feature-item"><i class="fas fa-api"></i> API Routes</div>
                        <div class="feature-item"><i class="fas fa-image"></i> Image Optimization</div>
                        <div class="feature-item"><i class="fas fa-font"></i> Font Optimization</div>
                        <div class="feature-item"><i class="fas fa-shield-alt"></i> Middleware</div>
                    </div>
                </div>

                <div class="note-section">
                    <h3><i class="fas fa-terminal"></i> Installation</h3>
                    <div class="code-block">
                        <span class="lang-tag">Terminal</span>
                        # Create a new Next.js app (recommended)
                        npx create-next-app@latest my-app
                        cd my-app
                        npm run dev

                        # With TypeScript
                        npx create-next-app@latest my-app --typescript

                        # Project Structure (App Router)
                        my-app/
                        ├── app/
                        │   ├── page.js          → Home page
                        │   ├── layout.js         → Root layout
                        │   ├── about/
                        │   │   └── page.js       → /about
                        │   └── api/
                        │       └── users/
                        │           └── route.js  → /api/users
                        ├── public/               → Static assets
                        ├── next.config.js        → Configuration
                        └── package.json
                    </div>
                </div>

                <div class="note-section">
                    <h3><i class="fas fa-code"></i> First Next.js Page</h3>
                    <div class="code-block">
                        <span class="lang-tag">JavaScript</span>
                        <span class="comment">// app/page.js (App Router)</span>
                        <span class="keyword">export</span> <span class="keyword">default</span> <span class="keyword">function</span> <span class="function">HomePage</span>() {
                            <span class="keyword">return</span> (
                                <span class="tag">&lt;div&gt;</span>
                                    <span class="tag">&lt;h1&gt;</span>Welcome to Next.js!<span class="tag">&lt;/h1&gt;</span>
                                    <span class="tag">&lt;p&gt;</span>This is a server component by default.<span class="tag">&lt;/p&gt;</span>
                                <span class="tag">&lt;/div&gt;</span>
                            );
                        }

                        <span class="comment">// pages/index.js (Pages Router - Legacy)</span>
                        <span class="keyword">export</span> <span class="keyword">default</span> <span class="keyword">function</span> <span class="function">HomePage</span>() {
                            <span class="keyword">return</span> (
                                <span class="tag">&lt;div&gt;</span>
                                    <span class="tag">&lt;h1&gt;</span>Welcome to Next.js!<span class="tag">&lt;/h1&gt;</span>
                                <span class="tag">&lt;/div&gt;</span>
                            );
                        }
                    </div>
                </div>

                <div class="note-box success">
                    <i class="fas fa-check-circle"></i>
                    <strong>Note:</strong> Next.js uses <strong>React Server Components</strong> by default in the App Router. This means components render on the server, sending only HTML to the client.
                </div>
            `
        },

        '2. Routing (App Router)': {
            content: `
                <div class="note-section">
                    <h3><i class="fas fa-route"></i> App Router - File-based Routing</h3>
                    <p>The <strong>App Router</strong> is the modern routing system in Next.js. Routes are defined by folders and files.</p>
                </div>

                <div class="note-section">
                    <h3><i class="fas fa-folder"></i> Basic Routing</h3>
                    <div class="code-block">
                        <span class="lang-tag">File Structure</span>
                        app/
                        ├── page.js              → /
                        ├── about/
                        │   └── page.js          → /about
                        ├── blog/
                        │   ├── page.js          → /blog
                        │   ├── [slug]/
                        │   │   └── page.js      → /blog/hello-world
                        │   └── category/
                        │       └── [category]/
                        │           └── page.js  → /blog/category/tech
                        ├── dashboard/
                        │   ├── page.js          → /dashboard
                        │   └── settings/
                        │       └── page.js      → /dashboard/settings
                        └── (auth)/              ← Route Group (no URL segment)
                            ├── login/
                            │   └── page.js      → /login
                            └── register/
                                └── page.js      → /register

                        <span class="lang-tag">JavaScript</span>
                        <span class="comment">// app/blog/[slug]/page.js - Dynamic Route</span>
                        <span class="keyword">export</span> <span class="keyword">default</span> <span class="keyword">function</span> <span class="function">BlogPost</span>({ params }) {
                            <span class="keyword">return</span> (
                                <span class="tag">&lt;div&gt;</span>
                                    <span class="tag">&lt;h1&gt;</span>Blog Post: {params.slug}<span class="tag">&lt;/h1&gt;</span>
                                <span class="tag">&lt;/div&gt;</span>
                            );
                        }

                        <span class="comment">// app/blog/[slug]/page.js - Catch-all Routes</span>
                        <span class="comment">// file: app/blog/[...slug]/page.js</span>
                        <span class="keyword">export</span> <span class="keyword">default</span> <span class="keyword">function</span> <span class="function">CatchAll</span>({ params }) {
                            <span class="comment">// /blog/a/b/c → params.slug = ['a', 'b', 'c']</span>
                            <span class="keyword">return</span> <span class="tag">&lt;div&gt;</span>Path: {params.slug.<span class="function">join</span>(<span class="string">'/'</span>)}<span class="tag">&lt;/div&gt;</span>;
                        }
                    </div>
                </div>

                <div class="note-section">
                    <h3><i class="fas fa-link"></i> Navigation</h3>
                    <div class="code-block">
                        <span class="lang-tag">JavaScript</span>
                        <span class="keyword">import</span> Link <span class="keyword">from</span> <span class="string">'next/link'</span>;
                        <span class="keyword">import</span> { useRouter } <span class="keyword">from</span> <span class="string">'next/navigation'</span>;

                        <span class="keyword">function</span> <span class="function">Navigation</span>() {
                            <span class="keyword">const</span> router = <span class="function">useRouter</span>();

                            <span class="keyword">return</span> (
                                <span class="tag">&lt;nav&gt;</span>
                                    <span class="comment">// Client-side navigation</span>
                                    <span class="tag">&lt;Link</span> <span class="variable">href</span>=<span class="string">"/"</span><span class="tag">&gt;</span>Home<span class="tag">&lt;/Link&gt;</span>
                                    <span class="tag">&lt;Link</span> <span class="variable">href</span>=<span class="string">"/about"</span><span class="tag">&gt;</span>About<span class="tag">&lt;/Link&gt;</span>
                                    <span class="tag">&lt;Link</span> <span class="variable">href</span>=<span class="string">"/blog/hello-world"</span><span class="tag">&gt;</span>Blog Post<span class="tag">&lt;/Link&gt;</span>

                                    <span class="comment">// Dynamic navigation with query params</span>
                                    <span class="tag">&lt;Link</span>
                                        <span class="variable">href</span>={{
                                            <span class="variable">pathname</span>: <span class="string">'/search'</span>,
                                            <span class="variable">query</span>: { q: <span class="string">'nextjs'</span> }
                                        }}
                                    <span class="tag">&gt;</span>
                                        Search
                                    <span class="tag">&lt;/Link&gt;</span>

                                    <span class="comment">// Programmatic navigation</span>
                                    <span class="tag">&lt;button</span> <span class="variable">onClick</span>={() => router.<span class="function">push</span>(<span class="string">'/dashboard'</span>)}<span class="tag">&gt;</span>
                                        Go to Dashboard
                                    <span class="tag">&lt;/button&gt;</span>

                                    <span class="comment">// Replace (no history entry)</span>
                                    <span class="tag">&lt;button</span> <span class="variable">onClick</span>={() => router.<span class="function">replace</span>(<span class="string">'/login'</span>)}<span class="tag">&gt;</span>
                                        Login
                                    <span class="tag">&lt;/button&gt;</span>

                                    <span class="comment">// Go back</span>
                                    <span class="tag">&lt;button</span> <span class="variable">onClick</span>={() => router.<span class="function">back</span>()}<span class="tag">&gt;</span>
                                        Back
                                    <span class="tag">&lt;/button&gt;</span>
                                <span class="tag">&lt;/nav&gt;</span>
                            );
                        }
                    </div>
                </div>

                <div class="note-box">
                    <i class="fas fa-lightbulb"></i>
                    <strong>Tip:</strong> Use <code>&lt;Link&gt;</code> for client-side navigation. It prefetches pages in the background for faster transitions.
                </div>
            `
        },

        '3. Server & Client Components': {
            content: `
                <div class="note-section">
                    <h3><i class="fas fa-server"></i> Server Components (Default)</h3>
                    <p><strong>Server Components</strong> render on the server. They have access to server resources (database, file system) and send only HTML to the client.</p>
                </div>

                <div class="note-section">
                    <h3><i class="fas fa-code"></i> Server Component Example</h3>
                    <div class="code-block">
                        <span class="lang-tag">JavaScript</span>
                        <span class="comment">// app/users/page.js - Server Component (default)</span>
                        <span class="keyword">import</span> { getUsers } <span class="keyword">from</span> <span class="string">'../lib/data'</span>;

                        <span class="keyword">export</span> <span class="keyword">default</span> <span class="keyword">async</span> <span class="keyword">function</span> <span class="function">UsersPage</span>() {
                            <span class="comment">// Directly fetch data on the server</span>
                            <span class="keyword">const</span> users = <span class="keyword">await</span> <span class="function">getUsers</span>();

                            <span class="keyword">return</span> (
                                <span class="tag">&lt;div&gt;</span>
                                    <span class="tag">&lt;h1&gt;</span>Users<span class="tag">&lt;/h1&gt;</span>
                                    <span class="tag">&lt;ul&gt;</span>
                                        {users.<span class="function">map</span>(user => (
                                            <span class="tag">&lt;li</span> <span class="variable">key</span>={user.id}<span class="tag">&gt;</span>{user.name}<span class="tag">&lt;/li&gt;</span>
                                        ))}
                                    <span class="tag">&lt;/ul&gt;</span>
                                <span class="tag">&lt;/div&gt;</span>
                            );
                        }
                    </div>
                </div>

                <div class="note-section">
                    <h3><i class="fas fa-laptop"></i> Client Components</h3>
                    <p><strong>Client Components</strong> render on the client (browser) and have access to browser APIs, state, and effects.</p>
                    <div class="code-block">
                        <span class="lang-tag">JavaScript</span>
                        <span class="comment">// app/components/Counter.js - Client Component</span>
                        <span class="string">'use client'</span>  <span class="comment">// ← Required for client components</span>

                        <span class="keyword">import</span> { useState } <span class="keyword">from</span> <span class="string">'react'</span>;

                        <span class="keyword">export</span> <span class="keyword">default</span> <span class="keyword">function</span> <span class="function">Counter</span>() {
                            <span class="keyword">const</span> [count, setCount] = <span class="function">useState</span>(0);

                            <span class="keyword">return</span> (
                                <span class="tag">&lt;div&gt;</span>
                                    <span class="tag">&lt;p&gt;</span>Count: {count}<span class="tag">&lt;/p&gt;</span>
                                    <span class="tag">&lt;button</span> <span class="variable">onClick</span>={() => <span class="function">setCount</span>(count + 1)}<span class="tag">&gt;</span>
                                        Increment
                                    <span class="tag">&lt;/button&gt;</span>
                                <span class="tag">&lt;/div&gt;</span>
                            );
                        }

                        <span class="comment">// Using the client component in a server component</span>
                        <span class="comment">// app/page.js - Server Component</span>
                        <span class="keyword">import</span> Counter <span class="keyword">from</span> <span class="string">'../components/Counter'</span>;

                        <span class="keyword">export</span> <span class="keyword">default</span> <span class="keyword">function</span> <span class="function">Page</span>() {
                            <span class="keyword">return</span> (
                                <span class="tag">&lt;div&gt;</span>
                                    <span class="tag">&lt;h1&gt;</span>Home<span class="tag">&lt;/h1&gt;</span>
                                    <span class="comment">// Counter is a client component</span>
                                    <span class="tag">&lt;Counter /&gt;</span>
                                <span class="tag">&lt;/div&gt;</span>
                            );
                        }
                    </div>
                </div>

                <div class="note-section">
                    <h3><i class="fas fa-sync"></i> When to Use Each</h3>
                    <div class="grid-2">
                        <div class="note-box success">
                            <i class="fas fa-server"></i>
                            <strong>Use Server Components for:</strong>
                            <ul>
                                <li>Data fetching</li>
                                <li>Access to server resources</li>
                                <li>SEO-critical content</li>
                                <li>Large dependencies (keep bundle small)</li>
                                <li>Static content</li>
                            </ul>
                        </div>
                        <div class="note-box">
                            <i class="fas fa-laptop"></i>
                            <strong>Use Client Components for:</strong>
                            <ul>
                                <li>State and effects</li>
                                <li>Event handlers</li>
                                <li>Browser APIs</li>
                                <li>Interactive UI</li>
                                <li>Custom hooks</li>
                            </ul>
                        </div>
                    </div>
                </div>

                <div class="note-box warning">
                    <i class="fas fa-exclamation-triangle"></i>
                    <strong>Important:</strong> All components are Server Components by default. You must add <code>'use client'</code> at the top of files that need client-side features.
                </div>
            `
        },

        '4. Data Fetching (SSG, SSR, ISR)': {
            content: `
                <div class="note-section">
                    <h3><i class="fas fa-database"></i> Data Fetching in Next.js</h3>
                    <p>Next.js provides multiple strategies for fetching data, each optimized for different use cases.</p>
                </div>

                <div class="note-section">
                    <h3><i class="fas fa-code"></i> Pages Router - Data Fetching Methods</h3>
                    <div class="code-block">
                        <span class="lang-tag">JavaScript</span>
                        <span class="comment">// 1. SSG - Static Site Generation (getStaticProps)</span>
                        <span class="keyword">export</span> <span class="keyword">async</span> <span class="keyword">function</span> <span class="function">getStaticProps</span>() {
                            <span class="keyword">const</span> res = <span class="keyword">await</span> <span class="function">fetch</span>(<span class="string">'https://api.example.com/posts'</span>);
                            <span class="keyword">const</span> posts = <span class="keyword">await</span> res.<span class="function">json</span>();

                            <span class="keyword">return</span> {
                                <span class="variable">props</span>: { posts },
                                <span class="variable">revalidate</span>: 60 <span class="comment">// ISR - Rebuild every 60 seconds</span>
                            };
                        }

                            <span class="keyword">const</span> res = <span class="keyword">await</span> <span class="function">fetch</span>(<span class="string">'https://api.example.com/posts'</span>);

                    <div class="code-block">
                        <span class="lang-tag">Comparison</span>
                        ┌──────────┬─────────────┬─────────────┬─────────────┐
                        │          │    SSG      │    SSR      │    ISR      │
                        ├──────────┼─────────────┼─────────────┼─────────────┤
                        │ When     │ Build Time  │ Request     │ Build +     │
                        │          │             │ Time        │ Runtime     │
                        ├──────────┼─────────────┼─────────────┼─────────────┤
                        │ HTML     │ Static      │ Dynamic     │ Static +    │
                        │          │             │             │ Update      │
                        ├──────────┼─────────────┼─────────────┼─────────────┤
                        │ Speed    │ Fastest     │ Slower      │ Fast +      │
                        │          │             │             │ Fresh       │
                        ├──────────┼─────────────┼─────────────┼─────────────┤
                        │ Use Case │ Blog,       │ Dashboard,  │ E-commerce, │
                        │          │ Marketing   │ Search      │ News        │

                    <h3><i class="fas fa-code"></i> API Routes (App Router)</h3>
                    <div class="code-block">
                        <span class="lang-tag">JavaScript</span>
                        <span class="comment">// app/api/users/route.js - GET endpoint</span>
                        <span class="keyword">import</span> { NextResponse } <span class="keyword">from</span> <span class="string">'next/server'</span>;

                            <span class="keyword">const</span> users = <span class="keyword">await</span> <span class="function">getUsers</span>();

                        <span class="comment">// POST endpoint</span>
                        <span class="keyword">export</span> <span class="keyword">async</span> <span class="keyword">function</span> <span class="function">POST</span>(request) {

                        }

                        <span class="comment">// PUT endpoint</span>
                        <span class="keyword">export</span> <span class="keyword">async</span> <span class="keyword">function</span> <span class="function">PUT</span>(request, { params }) {
                            <span class="keyword">const</span> { id } = params;

                        <span class="lang-tag">JavaScript</span>
                        <span class="comment">// pages/api/users.js</span>

                        });

                                <span class="keyword">const</span> validated = userSchema.<span class="function">parse</span>(body);

                                <span class="keyword">return</span> NextResponse.<span class="function">json</span>(user, { <span class="variable">status</span>: 201 });
                            } <span class="keyword">catch</span> (error) {

                                    { <span class="variable">status</span>: 400 }

                            }

                        <span class="comment">// API with authentication</span>
                        <span class="keyword">export</span> <span class="keyword">async</span> <span class="keyword">function</span> <span class="function">GET</span>(request) {
                            <span class="keyword">const</span> authHeader = request.<span class="variable">headers</span>.<span class="function">get</span>(<span class="string">'authorization'</span>);

                        }

                </div>

                    <i class="fas fa-exclamation-triangle"></i>

        '8. Middleware': {
            content: `
                <div class="note-section">
                    <h3><i class="fas fa-shield-alt"></i> Middleware</h3>
                    <p><strong>Middleware</strong> runs before a request is completed. It can be used for authentication, redirects, rewrites, and more.</p>
                </div>

                <div class="note-section">
                    <h3><i class="fas fa-code"></i> Basic Middleware</h3>
                    <div class="code-block">
                        <span class="lang-tag">JavaScript</span>
                        <span class="comment">// middleware.js (at root level)</span>
                        <span class="keyword">import</span> { NextResponse } <span class="keyword">from</span> <span class="string">'next/server'</span>;

                        <span class="keyword">export</span> <span class="keyword">function</span> <span class="function">middleware</span>(request) {
                            <span class="comment">// Log request</span>
                            <span class="function">console</span>.<span class="function">log</span>(<span class="string">\`\${request.method} \${request.url}\`</span>);

                            <span class="comment">// Continue with the request</span>
                            <span class="keyword">return</span> NextResponse.<span class="function">next</span>();
                        }

                        <span class="comment">// Matcher - only run on specific paths</span>
                        <span class="keyword">export</span> <span class="keyword">const</span> config = {
                            <span class="variable">matcher</span>: [
                                <span class="string">'/dashboard/:path*'</span>,
                                <span class="string">'/api/:path*'</span>,
                                <span class="string">'/((?!api|_next/static|_next/image|favicon.ico).*)'</span>
                            ]
                        };
                    </div>
                </div>

                <div class="note-section">
                    <h3><i class="fas fa-lock"></i> Authentication Middleware</h3>
                    <div class="code-block">
                        <span class="lang-tag">JavaScript</span>
                        <span class="keyword">import</span> { NextResponse } <span class="keyword">from</span> <span class="string">'next/server'</span>;
                        <span class="keyword">import</span> { jwtVerify } <span class="keyword">from</span> <span class="string">'jose'</span>;

                        <span class="keyword">export</span> <span class="keyword">async</span> <span class="keyword">function</span> <span class="function">middleware</span>(request) {
                            <span class="keyword">const</span> path = request.<span class="variable">nextUrl</span>.<span class="variable">pathname</span>;

                            <span class="comment">// Public paths (no auth required)</span>
                            <span class="keyword">const</span> publicPaths = [<span class="string">'/'</span>, <span class="string">'/login'</span>, <span class="string">'/register'</span>, <span class="string">'/about'</span>];
                            <span class="keyword">const</span> isPublic = publicPaths.<span class="function">some</span>(p => path.<span class="function">startsWith</span>(p));

                            <span class="keyword">if</span> (isPublic) {
                                <span class="keyword">return</span> NextResponse.<span class="function">next</span>();
                            }

                            <span class="comment">// Check for token</span>
                            <span class="keyword">const</span> token = request.<span class="variable">cookies</span>.<span class="function">get</span>(<span class="string">'token'</span>)?.<span class="variable">value</span>;

                            <span class="keyword">if</span> (!token) {
                                <span class="comment">// Redirect to login</span>
                                <span class="keyword">const</span> loginUrl = <span class="keyword">new</span> <span class="keyword">URL</span>(<span class="string">'/login'</span>, request.<span class="variable">url</span>);
                                loginUrl.<span class="variable">searchParams</span>.<span class="function">set</span>(<span class="string">'redirect'</span>, path);
                                <span class="keyword">return</span> NextResponse.<span class="function">redirect</span>(loginUrl);
                            }

                            <span class="keyword">try</span> {
                                <span class="comment">// Verify token</span>
                                <span class="keyword">const</span> secret = <span class="keyword">new</span> <span class="keyword">TextEncoder</span>().<span class="function">encode</span>(process.<span class="variable">env</span>.<span class="variable">JWT_SECRET</span>);
                                <span class="keyword">await</span> <span class="function">jwtVerify</span>(token, secret);

                                <span class="keyword">return</span> NextResponse.<span class="function">next</span>();
                            } <span class="keyword">catch</span> (error) {
                                <span class="comment">// Invalid token - redirect to login</span>
                                <span class="keyword">return</span> NextResponse.<span class="function">redirect</span>(<span class="keyword">new</span> <span class="keyword">URL</span>(<span class="string">'/login'</span>, request.<span class="variable">url</span>));
                            }
                        }

                        <span class="keyword">export</span> <span class="keyword">const</span> config = {
                            <span class="variable">matcher</span>: [<span class="string">'/dashboard/:path*'</span>, <span class="string">'/profile/:path*'</span>, <span class="string">'/settings/:path*'</span>]
                        };
                    </div>
                </div>

                <div class="note-section">
                    <h3><i class="fas fa-route"></i> Redirects & Rewrites</h3>
                    <div class="code-block">
                        <span class="lang-tag">JavaScript</span>
                        <span class="comment">// middleware.js - Redirects</span>
                        <span class="keyword">export</span> <span class="keyword">function</span> <span class="function">middleware</span>(request) {
                            <span class="keyword">const</span> path = request.<span class="variable">nextUrl</span>.<span class="variable">pathname</span>;

                            <span class="comment">// Redirect old URLs</span>
                            <span class="keyword">if</span> (path === <span class="string">'/old-blog'</span>) {
                                <span class="keyword">return</span> NextResponse.<span class="function">redirect</span>(<span class="keyword">new</span> <span class="keyword">URL</span>(<span class="string">'/blog'</span>, request.<span class="variable">url</span>));
                            }

                            <span class="comment">// Redirect based on user agent</span>
                            <span class="keyword">const</span> userAgent = request.<span class="variable">headers</span>.<span class="function">get</span>(<span class="string">'user-agent'</span>) || <span class="string">''</span>;
                            <span class="keyword">if</span> (userAgent.<span class="function">includes</span>(<span class="string">'Mobile'</span>) && path === <span class="string">'/'</span>) {
                                <span class="keyword">return</span> NextResponse.<span class="function">redirect</span>(<span class="keyword">new</span> <span class="keyword">URL</span>(<span class="string">'/mobile'</span>, request.<span class="variable">url</span>));
                            }

                            <span class="comment">// Rewrite (URL stays same but shows different content)</span>
                            <span class="keyword">if</span> (path.<span class="function">startsWith</span>(<span class="string">'/products'</span>)) {
                                <span class="keyword">const</span> country = request.<span class="variable">geo</span>?.<span class="variable">country</span> || <span class="string">'US'</span>;
                                <span class="keyword">return</span> NextResponse.<span class="function">rewrite</span>(<span class="keyword">new</span> <span class="keyword">URL</span>(<span class="string">\`/products/\${country}\`</span>, request.<span class="variable">url</span>));
                            }

                            <span class="keyword">return</span> NextResponse.<span class="function">next</span>();
                        }

                        <span class="comment">// Geolocation example</span>
                        <span class="keyword">export</span> <span class="keyword">function</span> <span class="function">middleware</span>(request) {
                            <span class="keyword">const</span> { geo } = request;
                            <span class="keyword">const</span> country = geo?.<span class="variable">country</span> || <span class="string">'US'</span>;

                            <span class="comment">// Response with geolocation</span>
                            <span class="keyword">const</span> response = NextResponse.<span class="function">next</span>();
                            response.<span class="variable">headers</span>.<span class="function">set</span>(<span class="string">'x-country'</span>, country);
                            <span class="keyword">return</span> response;
                        }
                    </div>
                </div>

                <div class="note-box warning">
                    <i class="fas fa-exclamation-triangle"></i>
                    <strong>Note:</strong> Middleware runs on the edge runtime. It cannot use Node.js modules or file system operations.
                </div>
            `
        },

        '10. Authentication (NextAuth.js)': {
            content: `
                <div class="note-section">
                    <h3><i class="fas fa-lock"></i> Authentication with NextAuth.js</h3>
                    <p><strong>NextAuth.js</strong> (now Auth.js) is the most popular authentication library for Next.js applications.</p>
                </div>

                <div class="note-section">
                    <h3><i class="fas fa-code"></i> Setup & Installation</h3>
                    <div class="code-block">
                        <span class="lang-tag">Terminal</span>
                        npm install next-auth @auth/prisma-adapter @prisma/client
                        npm install prisma --save-dev

                        <span class="lang-tag">JavaScript</span>
                        <span class="comment">// app/api/auth/[...nextauth]/route.js</span>
                        <span class="keyword">import</span> NextAuth <span class="keyword">from</span> <span class="string">'next-auth'</span>;
                        <span class="keyword">import</span> GoogleProvider <span class="keyword">from</span> <span class="string">'next-auth/providers/google'</span>;
                        <span class="keyword">import</span> GitHubProvider <span class="keyword">from</span> <span class="string">'next-auth/providers/github'</span>;
                        <span class="keyword">import</span> CredentialsProvider <span class="keyword">from</span> <span class="string">'next-auth/providers/credentials'</span>;
                        <span class="keyword">import</span> { PrismaAdapter } <span class="keyword">from</span> <span class="string">'@auth/prisma-adapter'</span>;
                        <span class="keyword">import</span> { prisma } <span class="keyword">from</span> <span class="string">'@/lib/prisma'</span>;
                        <span class="keyword">import</span> bcrypt <span class="keyword">from</span> <span class="string">'bcryptjs'</span>;

                        <span class="keyword">export</span> <span class="keyword">const</span> authOptions = {
                            <span class="variable">adapter</span>: <span class="function">PrismaAdapter</span>(prisma),
                            <span class="variable">providers</span>: [
                                <span class="function">GoogleProvider</span>({
                                    <span class="variable">clientId</span>: process.<span class="variable">env</span>.<span class="variable">GOOGLE_CLIENT_ID</span>,
                                    <span class="variable">clientSecret</span>: process.<span class="variable">env</span>.<span class="variable">GOOGLE_CLIENT_SECRET</span>
                                }),
                                <span class="function">GitHubProvider</span>({
                                    <span class="variable">clientId</span>: process.<span class="variable">env</span>.<span class="variable">GITHUB_ID</span>,
                                    <span class="variable">clientSecret</span>: process.<span class="variable">env</span>.<span class="variable">GITHUB_SECRET</span>
                                }),
                                <span class="function">CredentialsProvider</span>({
                                    <span class="variable">name</span>: <span class="string">'Credentials'</span>,
                                    <span class="variable">credentials</span>: {
                                        <span class="variable">email</span>: { <span class="variable">label</span>: <span class="string">"Email"</span>, <span class="variable">type</span>: <span class="string">"email"</span> },
                                        <span class="variable">password</span>: { <span class="variable">label</span>: <span class="string">"Password"</span>, <span class="variable">type</span>: <span class="string">"password"</span> }
                                    },
                                    <span class="keyword">async</span> <span class="function">authorize</span>(credentials) {
                                        <span class="keyword">const</span> user = <span class="keyword">await</span> prisma.<span class="variable">user</span>.<span class="function">findUnique</span>({
                                            <span class="variable">where</span>: { <span class="variable">email</span>: credentials.<span class="variable">email</span> }
                                        });

                                        <span class="keyword">if</span> (!user) {
                                            <span class="keyword">throw</span> <span class="keyword">new</span> <span class="keyword">Error</span>(<span class="string">'No user found with this email'</span>);
                                        }

                                        <span class="keyword">const</span> isValid = <span class="keyword">await</span> bcrypt.<span class="function">compare</span>(credentials.<span class="variable">password</span>, user.<span class="variable">password</span>);

                                        <span class="keyword">if</span> (!isValid) {

    const topicNav = document.getElementById('topicNav');
    const topicTitle = document.getElementById('topicTitle');
    const topicBadge = document.getElementById('topicBadge');
    const notesContent = document.getElementById('notesContent');
    const progressFill = document.getElementById('progressFill');

    const topicNames = Object.keys(NOTES);
    let activeTopic = topicNames[0];

    function renderNav() {
        const label = topicNav.querySelector('.label');
        topicNav.innerHTML = '';
        topicNav.appendChild(label);
        topicNames.forEach(name => {
            const btn = document.createElement('button');
            btn.className = 'topic-btn' + (name === activeTopic ? ' active' : '');
            let displayName = name;
            if (name.length > 40) {
                displayName = name.substring(0, 37) + '...';
            }
            btn.textContent = displayName;
            btn.title = name;
            btn.dataset.topic = name;
            btn.addEventListener('click', () => {
                activeTopic = name;
                renderNav();
                renderContent(name);
            });
            topicNav.appendChild(btn);
        });
    }

    function renderContent(topicName) {
        const data = NOTES[topicName];
        if (!data) {
            notesContent.innerHTML = '<p>Topic not found.</p>';
            return;
        }

        topicTitle.textContent = topicName;
        topicBadge.textContent = 'Complete Notes';
        notesContent.innerHTML = data.content;

        const total = topicNames.length;
        const current = topicNames.indexOf(topicName) + 1;
        const progress = Math.round((current / total) * 100);
        progressFill.style.width = progress + '%';
        progressFill.title = progress + '% complete';
    }

    renderNav();
    renderContent(activeTopic);
