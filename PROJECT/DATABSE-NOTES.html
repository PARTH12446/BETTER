                        │  ┌─────────┐  ┌─────────┐                           │

                        │  │  ┌───┐ │  │ ┌───┐  │                           │

                        │  ┌─────────┐  ┌─────────┐                           │
                        │  │    A    │  │    B    │                           │
                        │  │  ┌─────┐│  │ ┌───┐  │                           │

                    <p>Aggregate functions perform calculations on multiple rows and return a single value.</p>
                </div>

                <div class="note-section">
                    <h3><i class="fas fa-code"></i> Common Aggregate Functions</h3>
                    <div class="code-block">
                        <span class="lang-tag">SQL</span>
                        <span class="comment">-- COUNT</span>
                        <span class="sql-keyword">SELECT</span> <span class="sql-function">COUNT</span>(*) <span class="sql-keyword">FROM</span> users;
                        <span class="sql-keyword">SELECT</span> <span class="sql-function">COUNT</span>(<span class="sql-keyword">DISTINCT</span> city) <span class="sql-keyword">FROM</span> users;

                        <span class="comment">-- SUM</span>
                        <span class="sql-keyword">SELECT</span> <span class="sql-function">SUM</span>(total) <span class="sql-keyword">AS</span> total_revenue <span class="sql-keyword">FROM</span> orders;

                        <span class="comment">-- AVG</span>
                        <span class="sql-keyword">SELECT</span> <span class="sql-function">AVG</span>(age) <span class="sql-keyword">AS</span> avg_age <span class="sql-keyword">FROM</span> users;

                        <span class="comment">-- MIN / MAX</span>
                        <span class="sql-keyword">SELECT</span> <span class="sql-function">MIN</span>(price) <span class="sql-keyword">AS</span> cheapest, <span class="sql-function">MAX</span>(price) <span class="sql-keyword">AS</span> most_expensive <span class="sql-keyword">FROM</span> products;

                        <span class="comment">-- GROUP BY</span>
                        <span class="sql-keyword">SELECT</span> city, <span class="sql-function">COUNT</span>(*) <span class="sql-keyword">AS</span> user_count
                        <span class="sql-keyword">FROM</span> users
                        <span class="sql-keyword">GROUP BY</span> city
                        <span class="sql-keyword">ORDER BY</span> user_count <span class="sql-keyword">DESC</span>;

                        <span class="comment">-- GROUP BY with HAVING (filter groups)</span>
                        <span class="sql-keyword">SELECT</span> city, <span class="sql-function">COUNT</span>(*) <span class="sql-keyword">AS</span> user_count
                        <span class="sql-keyword">FROM</span> users
                        <span class="sql-keyword">GROUP BY</span> city
                        <span class="sql-keyword">HAVING</span> <span class="sql-function">COUNT</span>(*) > 100;

                        <span class="comment">-- Multiple aggregations</span>
                        <span class="sql-keyword">SELECT</span>
                            category,
                            <span class="sql-function">COUNT</span>(*) <span class="sql-keyword">AS</span> product_count,
                            <span class="sql-function">AVG</span>(price) <span class="sql-keyword">AS</span> avg_price,
                            <span class="sql-function">SUM</span>(stock) <span class="sql-keyword">AS</span> total_stock
                        <span class="sql-keyword">FROM</span> products
                        <span class="sql-keyword">GROUP BY</span> category;

                        <span class="comment">-- ROLLUP (PostgreSQL)</span>
                        <span class="sql-keyword">SELECT</span> category, <span class="sql-function">SUM</span>(price) <span class="sql-keyword">FROM</span> products
                        <span class="sql-keyword">GROUP BY</span> <span class="sql-function">ROLLUP</span>(category);
                    </div>
                </div>

                <div class="note-box warning">
                    <i class="fas fa-exclamation-triangle"></i>
                    <strong>Important:</strong> Any column in SELECT that is not in an aggregate function must be in the GROUP BY clause.
                </div>
            `

            content: `
                <div class="note-section">
                    <h3><i class="fas fa-list-ol"></i> Subqueries</h3>
                    <p>A <strong>subquery</strong> is a query inside another query.</p>
                </div>

                <div class="note-section">
                    <h3><i class="fas fa-code"></i> Subquery Examples</h3>
                    <div class="code-block">
                        <span class="lang-tag">SQL</span>
                        <span class="comment">-- Subquery in WHERE</span>
                        <span class="sql-keyword">SELECT</span> * <span class="sql-keyword">FROM</span> users
                        <span class="sql-keyword">WHERE</span> age > (<span class="sql-keyword">SELECT</span> <span class="sql-function">AVG</span>(age) <span class="sql-keyword">FROM</span> users);

                        <span class="comment">-- Subquery in SELECT</span>
                        <span class="sql-keyword">SELECT</span>
                            name,
                            ( <span class="sql-keyword">SELECT</span> <span class="sql-function">COUNT</span>(*) <span class="sql-keyword">FROM</span> orders <span class="sql-keyword">WHERE</span> user_id = users.id ) <span class="sql-keyword">AS</span> order_count
                        <span class="sql-keyword">FROM</span> users;

                        <span class="comment">-- Subquery in FROM (derived table)</span>
                        <span class="sql-keyword">SELECT</span> avg_age
                        <span class="sql-keyword">FROM</span> ( <span class="sql-keyword">SELECT</span> <span class="sql-function">AVG</span>(age) <span class="sql-keyword">AS</span> avg_age <span class="sql-keyword">FROM</span> users ) <span class="sql-keyword">AS</span> derived;

                        <span class="comment">-- EXISTS</span>
                        <span class="sql-keyword">SELECT</span> * <span class="sql-keyword">FROM</span> users u
                        <span class="sql-keyword">WHERE</span> <span class="sql-keyword">EXISTS</span> (
                            <span class="sql-keyword">SELECT</span> 1 <span class="sql-keyword">FROM</span> orders o <span class="sql-keyword">WHERE</span> o.user_id = u.id
                        );

                        <span class="comment">-- ANY / ALL</span>
                        <span class="sql-keyword">SELECT</span> * <span class="sql-keyword">FROM</span> products
                        <span class="sql-keyword">WHERE</span> price > <span class="sql-keyword">ANY</span> (<span class="sql-keyword">SELECT</span> price <span class="sql-keyword">FROM</span> products <span class="sql-keyword">WHERE</span> category = <span class="sql-string">'premium'</span>);
                    </div>
                </div>

                <div class="note-section">
                    <h3><i class="fas fa-code"></i> CTE (Common Table Expressions)</h3>
                    <div class="code-block">
                        <span class="lang-tag">SQL</span>
                        <span class="comment">-- Basic CTE</span>
                        <span class="sql-keyword">WITH</span> top_users <span class="sql-keyword">AS</span> (
                            <span class="sql-keyword">SELECT</span> user_id, <span class="sql-function">SUM</span>(total) <span class="sql-keyword">AS</span> total_spent
                            <span class="sql-keyword">FROM</span> orders
                            <span class="sql-keyword">GROUP BY</span> user_id
                            <span class="sql-keyword">ORDER BY</span> total_spent <span class="sql-keyword">DESC</span>
                            <span class="sql-keyword">LIMIT</span> 10
                        )
                        <span class="sql-keyword">SELECT</span> users.name, top_users.total_spent
                        <span class="sql-keyword">FROM</span> top_users
                        <span class="sql-keyword">JOIN</span> users <span class="sql-keyword">ON</span> users.id = top_users.user_id;

                        <span class="comment">-- Multiple CTEs</span>
                        <span class="sql-keyword">WITH</span>
                            cte1 <span class="sql-keyword">AS</span> ( <span class="sql-keyword">SELECT</span> ... ),
                            cte2 <span class="sql-keyword">AS</span> ( <span class="sql-keyword">SELECT</span> ... )
                        <span class="sql-keyword">SELECT</span> * <span class="sql-keyword">FROM</span> cte1 <span class="sql-keyword">JOIN</span> cte2 <span class="sql-keyword">ON</span> ...;

                        <span class="comment">-- Recursive CTE (hierarchical data)</span>
                        <span class="sql-keyword">WITH</span> <span class="sql-function">RECURSIVE</span> org_tree <span class="sql-keyword">AS</span> (
                            <span class="comment">-- Base case</span>
                            <span class="sql-keyword">SELECT</span> id, name, manager_id, 1 <span class="sql-keyword">AS</span> level
                            <span class="sql-keyword">FROM</span> employees <span class="sql-keyword">WHERE</span> manager_id <span class="sql-keyword">IS</span> <span class="sql-keyword">NULL</span>
                            <span class="sql-keyword">UNION</span> <span class="sql-keyword">ALL</span>
                            <span class="comment">-- Recursive case</span>
                            <span class="sql-keyword">SELECT</span> e.id, e.name, e.manager_id, ot.level + 1
                            <span class="sql-keyword">FROM</span> employees e
                            <span class="sql-keyword">JOIN</span> org_tree ot <span class="sql-keyword">ON</span> e.manager_id = ot.id
                        )
                        <span class="sql-keyword">SELECT</span> * <span class="sql-keyword">FROM</span> org_tree;
                    </div>
                </div>

                <div class="note-box success">
                    <i class="fas fa-check-circle"></i>
                    <strong>Best Practice:</strong> CTEs make complex queries more readable and maintainable. Use them instead of nested subqueries when possible.
                </div>
            `
        },
        '7. SQL Indexes & Performance': {
            tech: 'sql',
            content: `
                <div class="note-section">
                    <h3><i class="fas fa-bolt"></i> Database Indexing</h3>
                    <p><strong>Indexes</strong> are data structures that improve query performance by allowing fast data retrieval.</p>
                </div>

                <div class="note-section">
                    <h3><i class="fas fa-code"></i> Index Types</h3>
                    <div class="code-block">
                        <span class="lang-tag">SQL</span>
                        <span class="comment">-- B-Tree Index (default, most common)</span>
                        <span class="sql-keyword">CREATE INDEX</span> idx_users_email <span class="sql-keyword">ON</span> users(email);

                        <span class="comment">-- Composite Index (multiple columns)</span>
                        <span class="sql-keyword">CREATE INDEX</span> idx_orders_user_date <span class="sql-keyword">ON</span> orders(user_id, created_at);

                        <span class="comment">-- Unique Index</span>
                        <span class="sql-keyword">CREATE UNIQUE INDEX</span> idx_users_email_unique <span class="sql-keyword">ON</span> users(email);

                        <span class="comment">-- Hash Index (PostgreSQL - equality only)</span>
                        <span class="sql-keyword">CREATE INDEX</span> idx_users_email_hash <span class="sql-keyword">ON</span> users <span class="sql-keyword">USING HASH</span> (email);

                        <span class="comment">-- Full-Text Index (PostgreSQL)</span>
                        <span class="sql-keyword">CREATE INDEX</span> idx_posts_content <span class="sql-keyword">ON</span> posts <span class="sql-keyword">USING GIN</span> (<span class="sql-function">to_tsvector</span>(<span class="sql-string">'english'</span>, content));

                        <span class="comment">-- Partial Index (PostgreSQL)</span>
                        <span class="sql-keyword">CREATE INDEX</span> idx_active_users <span class="sql-keyword">ON</span> users(email) <span class="sql-keyword">WHERE</span> is_active = <span class="sql-keyword">true</span>;

                        <span class="comment">-- Drop Index</span>
                        <span class="sql-keyword">DROP INDEX</span> idx_users_email;
                    </div>
                </div>

                <div class="note-section">
                    <h3><i class="fas fa-code"></i> Query Optimization</h3>
                    <div class="code-block">
                        <span class="lang-tag">SQL</span>
                        <span class="comment">-- EXPLAIN ANALYZE (PostgreSQL)</span>
                        <span class="sql-keyword">EXPLAIN ANALYZE</span>
                        <span class="sql-keyword">SELECT</span> * <span class="sql-keyword">FROM</span> orders <span class="sql-keyword">WHERE</span> user_id = 12345;

                        <span class="comment">-- Use SELECT only needed columns</span>
                        <span class="comment">-- Bad:</span>
                        <span class="sql-keyword">SELECT</span> * <span class="sql-keyword">FROM</span> orders <span class="sql-keyword">WHERE</span> user_id = 12345;
                        <span class="comment">-- Good:</span>
                        <span class="sql-keyword">SELECT</span> id, total, created_at <span class="sql-keyword">FROM</span> orders <span class="sql-keyword">WHERE</span> user_id = 12345;

                        <span class="comment">-- Use EXISTS instead of IN for large datasets</span>
                        <span class="comment">-- Bad:</span>
                        <span class="sql-keyword">SELECT</span> * <span class="sql-keyword">FROM</span> users <span class="sql-keyword">WHERE</span> id <span class="sql-keyword">IN</span> (<span class="sql-keyword">SELECT</span> user_id <span class="sql-keyword">FROM</span> orders);
                        <span class="comment">-- Good:</span>
                        <span class="sql-keyword">SELECT</span> * <span class="sql-keyword">FROM</span> users u <span class="sql-keyword">WHERE EXISTS</span> (<span class="sql-keyword">SELECT</span> 1 <span class="sql-keyword">FROM</span> orders o <span class="sql-keyword">WHERE</span> o.user_id = u.id);

                        <span class="comment">-- Use LIMIT for pagination</span>
                        <span class="sql-keyword">SELECT</span> * <span class="sql-keyword">FROM</span> orders <span class="sql-keyword">ORDER BY</span> created_at <span class="sql-keyword">DESC LIMIT</span> 20 <span class="sql-keyword">OFFSET</span> 40;
                    </div>
                </div>

                <div class="note-box warning">
                    <i class="fas fa-exclamation-triangle"></i>
                    <strong>Trade-offs:</strong> Indexes speed up reads but slow down writes (INSERT, UPDATE, DELETE). Each index consumes storage space.
                </div>
            `
        },
        '8. SQL Transactions & ACID': {
            tech: 'sql',
            content: `
                <div class="note-section">
                    <h3><i class="fas fa-exchange-alt"></i> Transactions</h3>
                    <p>A <strong>transaction</strong> is a sequence of operations performed as a single logical unit of work.</p>
                </div>

                <div class="note-section">
                    <h3><i class="fas fa-code"></i> ACID Properties</h3>
                    <ul>
                        <li><strong>Atomicity:</strong> All or nothing - if one part fails, the entire transaction is rolled back</li>
                        <li><strong>Consistency:</strong> Data remains valid - constraints, rules, and relationships are maintained</li>
                        <li><strong>Isolation:</strong> Transactions are independent - they don't interfere with each other</li>
                        <li><strong>Durability:</strong> Committed data is permanent - even after system failure</li>
                    </ul>
                </div>

                <div class="note-section">
                    <h3><i class="fas fa-code"></i> Transaction Commands</h3>
                    <div class="code-block">
                        <span class="lang-tag">SQL</span>
                        <span class="comment">-- Begin a transaction</span>
                        <span class="sql-keyword">BEGIN</span>;

                        <span class="comment">-- Perform operations</span>
                        <span class="sql-keyword">UPDATE</span> accounts <span class="sql-keyword">SET</span> balance = balance - 100 <span class="sql-keyword">WHERE</span> id = 1;
                        <span class="sql-keyword">UPDATE</span> accounts <span class="sql-keyword">SET</span> balance = balance + 100 <span class="sql-keyword">WHERE</span> id = 2;

                        <span class="comment">-- Check if everything is correct</span>
                        <span class="sql-keyword">SELECT</span> * <span class="sql-keyword">FROM</span> accounts <span class="sql-keyword">WHERE</span> id <span class="sql-keyword">IN</span> (1, 2);

                        <span class="comment">-- Commit (make permanent)</span>
                        <span class="sql-keyword">COMMIT</span>;

                        <span class="comment">-- OR Rollback (undo)</span>
                        <span class="sql-keyword">ROLLBACK</span>;

                        <span class="comment">-- Savepoint (partial rollback)</span>
                        <span class="sql-keyword">SAVEPOINT</span> before_update;
                        <span class="sql-keyword">UPDATE</span> accounts <span class="sql-keyword">SET</span> balance = balance - 50 <span class="sql-keyword">WHERE</span> id = 1;
                        <span class="comment">-- Oops, mistake! Rollback to savepoint</span>
                        <span class="sql-keyword">ROLLBACK TO</span> before_update;
                        <span class="sql-keyword">COMMIT</span>;
                    </div>
                </div>

                <div class="note-section">
                    <h3><i class="fas fa-code"></i> Isolation Levels</h3>
                    <table class="comparison-table">
                        <tr><th>Isolation Level</th><th>Dirty Read</th><th>Non-Repeatable Read</th><th>Phantom Read</th></tr>
                        <tr><td>READ UNCOMMITTED</td><td>✅ Allowed</td><td>✅ Allowed</td><td>✅ Allowed</td></tr>
                        <tr><td>READ COMMITTED</td><td>❌ Prevented</td><td>✅ Allowed</td><td>✅ Allowed</td></tr>
                        <tr><td>REPEATABLE READ</td><td>❌ Prevented</td><td>❌ Prevented</td><td>✅ Allowed</td></tr>
                        <tr><td>SERIALIZABLE</td><td>❌ Prevented</td><td>❌ Prevented</td><td>❌ Prevented</td></tr>
                    </table>
                    <div class="code-block">
                        <span class="lang-tag">SQL</span>
                        <span class="comment">-- Set isolation level (PostgreSQL)</span>
                        <span class="sql-keyword">SET TRANSACTION</span> <span class="sql-keyword">ISOLATION LEVEL</span> <span class="sql-keyword">SERIALIZABLE</span>;
                        <span class="sql-keyword">BEGIN</span>;
                        <span class="comment">-- Your operations</span>
                        <span class="sql-keyword">COMMIT</span>;
                    </div>
                </div>

                <div class="note-box sql-box">
                    <i class="fas fa-lightbulb"></i>
                    <strong>Example:</strong> Bank transfer is the classic transaction example. Deduct from one account and credit another - both must succeed or fail together.
                </div>
            `
        },
        '9. SQL Views & Stored Procedures': {
            tech: 'sql',
            content: `
                <div class="note-section">
                    <h3><i class="fas fa-eye"></i> Views</h3>
                    <p>A <strong>view</strong> is a virtual table based on a SELECT query. It doesn't store data but shows a filtered/combined view of data.</p>
                </div>

                <div class="note-section">
                    <h3><i class="fas fa-code"></i> Creating Views</h3>
                    <div class="code-block">
                        <span class="lang-tag">SQL</span>
                        <span class="comment">-- Simple View</span>
                        <span class="sql-keyword">CREATE VIEW</span> active_users <span class="sql-keyword">AS</span>
                        <span class="sql-keyword">SELECT</span> id, name, email, created_at
                        <span class="sql-keyword">FROM</span> users
                        <span class="sql-keyword">WHERE</span> is_active = <span class="sql-keyword">true</span>;

                        <span class="comment">-- Use view like a table</span>
                        <span class="sql-keyword">SELECT</span> * <span class="sql-keyword">FROM</span> active_users <span class="sql-keyword">WHERE</span> created_at > <span class="sql-string">'2024-01-01'</span>;

                        <span class="comment">-- Complex View with JOINs</span>
                        <span class="sql-keyword">CREATE VIEW</span> order_summary <span class="sql-keyword">AS</span>
                        <span class="sql-keyword">SELECT</span>
                            u.id <span class="sql-keyword">AS</span> user_id,
                            u.name,
                            <span class="sql-function">COUNT</span>(o.id) <span class="sql-keyword">AS</span> order_count,
                            <span class="sql-function">SUM</span>(o.total) <span class="sql-keyword">AS</span> total_spent
                        <span class="sql-keyword">FROM</span> users u
                        <span class="sql-keyword">LEFT JOIN</span> orders o <span class="sql-keyword">ON</span> u.id = o.user_id
                        <span class="sql-keyword">GROUP BY</span> u.id, u.name;

                        <span class="comment">-- Materialized View (PostgreSQL - stores data)</span>
                        <span class="sql-keyword">CREATE MATERIALIZED VIEW</span> daily_sales <span class="sql-keyword">AS</span>
                        <span class="sql-keyword">SELECT</span>
                            <span class="sql-function">DATE</span>(created_at) <span class="sql-keyword">AS</span> sale_date,
                            <span class="sql-function">SUM</span>(total) <span class="sql-keyword">AS</span> daily_total
                        <span class="sql-keyword">FROM</span> orders
                        <span class="sql-keyword">GROUP BY</span> <span class="sql-function">DATE</span>(created_at);

                        <span class="comment">-- Refresh materialized view</span>
                        <span class="sql-keyword">REFRESH MATERIALIZED VIEW</span> daily_sales;
                    </div>
                </div>

                <div class="note-section">
                    <h3><i class="fas fa-code"></i> Stored Procedures</h3>
                    <div class="code-block">
                        <span class="lang-tag">SQL (PostgreSQL)</span>
                        <span class="comment">-- Stored Procedure</span>
                        <span class="sql-keyword">CREATE OR REPLACE PROCEDURE</span> transfer_money(
                            from_account <span class="sql-keyword">INT</span>,
                            to_account <span class="sql-keyword">INT</span>,
                            amount <span class="sql-keyword">DECIMAL</span>
                        )
                        <span class="sql-keyword">LANGUAGE plpgsql</span>
                        <span class="sql-keyword">AS</span> $$
                        <span class="sql-keyword">BEGIN</span>
                            <span class="comment">-- Check balance</span>
                            <span class="sql-keyword">IF</span> (<span class="sql-keyword">SELECT</span> balance <span class="sql-keyword">FROM</span> accounts <span class="sql-keyword">WHERE</span> id = from_account) < amount <span class="sql-keyword">THEN</span>
                                <span class="sql-keyword">RAISE EXCEPTION</span> <span class="sql-string">'Insufficient funds'</span>;
                            <span class="sql-keyword">END IF</span>;

                            <span class="comment">-- Transfer</span>
                            <span class="sql-keyword">UPDATE</span> accounts <span class="sql-keyword">SET</span> balance = balance - amount <span class="sql-keyword">WHERE</span> id = from_account;
                            <span class="sql-keyword">UPDATE</span> accounts <span class="sql-keyword">SET</span> balance = balance + amount <span class="sql-keyword">WHERE</span> id = to_account;

                            <span class="comment">-- Log transaction</span>
                            <span class="sql-keyword">INSERT INTO</span> transactions (from_account, to_account, amount, created_at)
                            <span class="sql-keyword">VALUES</span> (from_account, to_account, amount, <span class="sql-function">NOW</span>());

                            <span class="sql-keyword">COMMIT</span>;
                        <span class="sql-keyword">END</span>;
                        $$;

                        <span class="comment">-- Call procedure</span>
                        <span class="sql-keyword">CALL</span> transfer_money(1, 2, 100.00);
                    </div>
                </div>
            `
        },

                    <p>Understanding the differences and when to use each.</p>

                <div class="note-section">
                    <h3><i class="fas fa-code"></i> Comparison Table</h3>
                    <table class="comparison-table">
                        <tr><th>Feature</th><th>SQL</th><th>NoSQL</th></tr>
                        <tr><td>Data Model</td><td>Relational (tables)</td><td>Document/Key-Value/Graph</td></tr>
                        <tr><td>Schema</td><td>Fixed, predefined</td><td>Dynamic, schema-less</td></tr>
                        <tr><td>Scaling</td><td>Vertical (hard)</td><td>Horizontal (easy)</td></tr>
                        <tr><td>Transactions</td><td>ACID (strong)</td><td>BASE (eventual)</td></tr>
                        <tr><td>Query Language</td><td>SQL</td><td>API/Query-specific</td></tr>
                        <tr><td>Relationships</td><td>Foreign keys, JOINs</td><td>Embedded or referenced</td></tr>
                        <tr><td>Performance</td><td>Complex queries, JOINs</td><td>Simple queries, fast reads</td></tr>

                <div class="note-section">

                    <ul>
                        <li><strong>Complex relationships:</strong> Many-to-many relationships, JOINs</li>
                        <li><strong>ACID compliance:</strong> Banking, financial systems, inventory</li>
                        <li><strong>Structured data:</strong> Known schema, stable requirements</li>
                        <li><strong>Data integrity:</strong> Foreign keys, constraints, validation</li>
                        <li><strong>Reporting:</strong> Complex aggregations, analytics</li>
                    </ul>

                    <h3><i class="fas fa-code"></i> When to Use NoSQL</h3>
                    <ul>
                        <li><strong>Unstructured data:</strong> JSON, documents, flexible schema</li>
                        <li><strong>High scalability:</strong> Millions of reads/writes per second</li>
                        <li><strong>Rapid development:</strong> Schema changes without migration</li>
                        <li><strong>Real-time data:</strong> Caching, session storage, user profiles</li>
                        <li><strong>Big Data:</strong> Logs, analytics, IoT data</li>
                    </ul>
                </div>

                <div class="note-box success">
                    <i class="fas fa-check-circle"></i>
                    <strong>Modern Approach:</strong> Many systems use both - SQL for core transactional data and NoSQL for cache, logs, and flexible data.

                <div class="note-section">
                    <h3><i class="fas fa-leaf"></i> What is MongoDB?</h3>
                    <p><strong>MongoDB</strong> is a NoSQL document database that stores data in flexible, JSON-like documents.</p>
                </div>

                <div class="note-section">
                    <h3><i class="fas fa-code"></i> Key Concepts</h3>
                    <ul>
                        <li><strong>Database:</strong> Container for collections</li>
                        <li><strong>Collection:</strong> Group of documents (like SQL tables)</li>

                    <h3><i class="fas fa-code"></i> Replica Set</h3>
                    <div class="diagram-box">
                        ┌─────────────────────────────────────────────────────┐
                        │                    Replica Set                    │
                        ├─────────────────────────────────────────────────────┤
                        │                                                   │
                        │            ┌──────────────┐                      │
                        │            │   Primary    │                      │
                        │            │  (Writes)    │                      │
                        │            └──────┬───────┘                      │
                        │                   │                              │
                        │         ┌─────────┼─────────┐                    │
                        │         │         │         │                    │
                        │    ┌────▼────┐ ┌───▼────┐ ┌─▼─────┐             │
                        │    │Secondary│ │Secondary│ │Secondary│           │
                        │    │ (Read)  │ │ (Read)  │ │ (Read)  │           │
                        │    └─────────┘ └─────────┘ └─────────┘           │
                        │                                                   │
                        │         ┌──────────┐                             │
                        │         │  Arbiter │ (Voting only, no data)      │
                        │         └──────────┘                             │
                        └─────────────────────────────────────────────────────┘
                    </div>
                </div>

                <div class="note-section">
                    <h3><i class="fas fa-code"></i> Replica Set Configuration</h3>

                                { <span class="variable">_id</span>: 2, <span class="variable">host</span>: <span class="string">"mongodb3:27017"</span>, <span class="variable">arbiterOnly</span>: <span class="keyword">true</span> }
                            ]
                        });

                        <span class="comment">// Check status</span>
                        rs.<span class="function">status</span>();

                        <span class="comment">// Read preferences in application</span>

                        ├─────────────────────────────────────────────────────┤
                        │                                                   │
                        │              ┌──────────────┐                    │
                        │              │   Router     │                    │
                        │              │  (mongos)    │                    │
                        │              └──────┬───────┘                    │
                        │                     │                            │
                        │                     ▼                            │
                        │              ┌──────────────┐                    │
                        │              │   Config     │                    │

                        │              └──────────────┘                    │
                        │                     │                            │
                        │         ┌───────────┼───────────┐                │
                        │         ▼           ▼           ▼                │
                        │    ┌─────────┐ ┌─────────┐ ┌─────────┐         │
                        │    │ Shard 1 │ │ Shard 2 │ │ Shard 3 │         │
                        │    │(Replica)│ │(Replica)│ │(Replica)│         │
                        │    └─────────┘ └─────────┘ └─────────┘         │
                        │                                                   │
                        └─────────────────────────────────────────────────────┘

                </div>

                <div class="note-section">
                    <h3><i class="fas fa-code"></i> Sharding Configuration</h3>
                    <div class="code-block">

                        <span class="comment">// Enable sharding for database</span>
                        sh.<span class="function">enableSharding</span>(<span class="string">"myapp"</span>);

                        sh.<span class="function">shardCollection</span>(

                <div class="note-section">

                <div class="note-section">

                <div class="note-section">
                    <h3><i class="fas fa-code"></i> Change Streams Example</h3>
                    <div class="code-block">
                        <span class="lang-tag">JavaScript (Node.js with Mongoose)</span>
                        <span class="comment">// Listen to changes on a collection</span>
                        <span class="keyword">const</span> changeStream = User.<span class="function">watch</span>();

                        changeStream.<span class="function">on</span>(<span class="string">'change'</span>, (change) => {
                            <span class="function">console</span>.<span class="function">log</span>(<span class="string">'Change detected:'</span>, change);

                            <span class="comment">// Handle different operations</span>
                            <span class="keyword">switch</span> (change.<span class="variable">operationType</span>) {
                                <span class="keyword">case</span> <span class="string">'insert'</span>:
                                    <span class="function">console</span>.<span class="function">log</span>(<span class="string">'New document inserted:'</span>, change.<span class="variable">fullDocument</span>);
                                    <span class="keyword">break</span>;

                                <span class="keyword">case</span> <span class="string">'update'</span>:
                                    <span class="function">console</span>.<span class="function">log</span>(<span class="string">'Document updated:'</span>, change.<span class="variable">documentKey</span>);
                                    <span class="keyword">break</span>;

                                <span class="keyword">case</span> <span class="string">'delete'</span>:
                                    <span class="function">console</span>.<span class="function">log</span>(<span class="string">'Document deleted:'</span>, change.<span class="variable">documentKey</span>);
                                    <span class="keyword">break</span>;

                                <span class="keyword">case</span> <span class="string">'replace'</span>:
                                    <span class="function">console</span>.<span class="function">log</span>(<span class="string">'Document replaced:'</span>, change.<span class="variable">fullDocument</span>);
                                    <span class="keyword">break</span>;
                            }
                        });

                        <span class="comment">// Listen with aggregation pipeline filtering</span>
                        <span class="keyword">const</span> changeStream = User.<span class="function">watch</span>([
                            {
                                <span class="variable">$match</span>: {
                                    <span class="variable">$or</span>: [
                                        { <span class="variable">operationType</span>: <span class="string">'insert'</span> },
                                        { <span class="variable">operationType</span>: <span class="string">'update'</span> }
                                    ],
                                    <span class="string">'fullDocument.age'</span>: { <span class="variable">$gte</span>: 18 }

                        <span class="comment">// Store resumeToken to resume later</span>

                        <span class="comment">// Resume from token</span>
                        <span class="keyword">const</span> changeStream = User.<span class="function">watch</span>([], {
                            <span class="variable">resumeAfter</span>: resumeToken
                        });

                        <span class="comment">// Close change stream</span>
                        changeStream.<span class="function">close</span>();
                    </div>
                </div>

                <div class="note-section">
                    <h3><i class="fas fa-code"></i> Use Cases</h3>

                        <li><strong>Cache Invalidation:</strong> Invalidate cache when data changes</li>

                    <i class="fas fa-exclamation-triangle"></i>
                    <strong>Important:</strong> Change Streams require replica sets or sharded clusters. They don't work on standalone MongoDB instances.

    // ================================================================
    // RENDER ENGINE
    // ================================================================
    const topicNames = Object.keys(topicData);

    function init() {
        const topicNav = document.getElementById('topicNav');
        const topicTitle = document.getElementById('topicTitle');
        const topicBadge = document.getElementById('topicBadge');
        const notesContent = document.getElementById('notesContent');
        const progressFill = document.getElementById('progressFill');

        let activeTopic = topicNames[0];

        function renderNav() {
            const label = topicNav.querySelector('.label');
            topicNav.innerHTML = '';
            topicNav.appendChild(label);
            topicNames.forEach(name => {
                const btn = document.createElement('button');
                let className = 'topic-btn';
                const tech = topicData[name]?.tech || 'both';
                if (name === activeTopic) {
                    if (tech === 'sql') className += ' active-sql';
                    else if (tech === 'mongo') className += ' active-mongo';
                    else className += ' active-sql';
                }
                btn.className = className;
                let displayName = name;
                if (name.length > 45) {
                    displayName = name.substring(0, 42) + '...';
                }
                btn.textContent = displayName;
                btn.title = name;
                btn.dataset.topic = name;
                btn.addEventListener('click', () => {
                    activeTopic = name;
                    renderNav();
                    renderContent(name);
                });
                topicNav.appendChild(btn);
            });
        }

        function renderContent(topicName) {
            const data = topicData[topicName];
            if (!data) {
                notesContent.innerHTML = '<p style="padding:2rem;text-align:center;color:#64748b;">Topic not found.</p>';
                return;
            }

            topicTitle.textContent = topicName;
            topicBadge.textContent = 'Deep Notes';
            notesContent.innerHTML = data.content;

            const total = topicNames.length;
            const current = topicNames.indexOf(topicName) + 1;
            const progress = Math.round((current / total) * 100);
            progressFill.style.width = progress + '%';
            progressFill.title = progress + '% complete';
        }

        renderNav();
        renderContent(activeTopic);
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
</script>
